        `Per migliorare ci sono la <b>ricerca ibrida</b> e il <b>re-ranking</b>, che vedi al Giorno 6. Si aggiungono quando le misure dicono che servono, non a priori.`],
    k: [[`Recall`, `Quanti dei passaggi giusti la ricerca riesce a trovare.`], [`Precisione`, `Quanti dei passaggi trovati sono davvero giusti.`]] }
];

SLIDES.g6 = [
  { t: `I due difetti del RAG di base`,
    s: `Il RAG del Giorno 5 ha due problemi: capisce male le domande scritte di fretta e mostra a tutti anche i documenti riservati.`,
    p: [`<b>Primo problema.</b> Marco è allo sportello con un cliente e scrive di fretta "<i>ven ok?</i>". L'embedding di sette caratteri non assomiglia a "<i>Le operazioni verso il Venezuela richiedono verifica rafforzata secondo la procedura antiriciclaggio</i>". Il sistema trova un documento sbagliato e <b>risponde comunque</b>, con sicurezza.`,
        `Tu, da sviluppatore, scrivevi domande complete perché sai quali documenti hai caricato nella base di conoscenza del RAG (la tabella dei chunk in Postgres) e con che parole sono scritti. Gli operatori della banca non lo sanno: scrivono di fretta, con abbreviazioni.`,
        `<b>Secondo problema.</b> Fra i documenti caricati nella base di conoscenza ci sono anche documenti riservati, per esempio un fascicolo antiriciclaggio. Con la domanda giusta, quel testo finisce nel prompt e poi nella risposta, a chiunque. Non serve un hacker: basta una domanda fortunata.`,
        `Oggi li risolviamo così: la <b>riscrittura della domanda</b> (query rewriting) per il primo problema; l'<b>autenticazione con JWT</b> e la <b>ricerca filtrata per ruolo</b> per il secondo.`],
    ex: `Il RAG del Giorno 5 era come un collega che ha letto tutti i documenti dell'azienda e risponde a chiunque glielo chieda. Oggi gli insegni a capire cosa gli chiedi davvero e a ricordarsi con chi sta parlando.`,
    k: [[`Recall`, `Quanta parte dei documenti giusti la ricerca riesce a trovare.`], [`Antiriciclaggio (AML)`, `Controlli bancari per impedire che denaro illecito entri nel sistema.`]] },
  { t: `Riscrivere la domanda prima di cercare`,
    s: `Un LLM riscrive la domanda in forma completa, ma solo per cercare meglio. Al modello che risponde arriva la domanda originale.`,
    p: [`Prima della ricerca, un LLM <b>riscrive</b> la domanda in forma completa: "ven ok?" diventa "Quali verifiche servono per un'operazione verso il Venezuela?". Così la ricerca trova molti più documenti giusti.`,
        `La cosa più importante: la domanda riscritta serve <b>solo per cercare</b>. Al modello che scrive la risposta va la domanda <b>originale</b>, altrimenti risponderebbe a una domanda che l'utente non ha fatto. È l'errore più comune con questa tecnica.`,
        `Il modello che riscrive non deve aggiungere informazioni. "20k" deve diventare "superiore a 20.000 euro", non "tra 20.000 e 50.000, soglia della procedura rafforzata". Una soglia inventata finirebbe nella ricerca, quindi nei documenti trovati e poi nella risposta.`,
        `Per evitarlo si usano: regole chiare nel prompt di sistema (non aggiungere fatti, non cambiare nomi propri e codici); alcuni esempi di riscritture giuste nel prompt (few-shot); una sola domanda in uscita; e un controllo sulla lunghezza. Se il testo che torna è molto più lungo della domanda, probabilmente il modello sta rispondendo invece di riscrivere, e si scarta.`,
        `Se il servizio che riscrive non risponde, si cerca con la domanda originale. C'è anche un interruttore <code>enabled</code> per spegnerlo del tutto. Il sistema funziona un po' peggio invece di rompersi: si chiama <b>degradazione</b>.`,
        `Quanto costa: poco più di un euro al mese con mille domande al giorno, e qualche centinaio di millisecondi in più per domanda.`],
    k: [[`Few-shot`, `Mettere nel prompt alcuni esempi di input e output desiderati.`], [`Degradazione controllata`, `Se un pezzo fallisce il sistema continua con meno qualità invece di rompersi.`]] },
  { t: `Chi sei? Autenticazione con JWT`,
    s: `Dopo il login ricevi un token firmato, il JWT, e lo mandi a ogni richiesta. Il server lo verifica e sa chi sei e che ruolo hai.`,
    p: [`Due parole da distinguere: <b>autenticazione</b> vuol dire dimostrare chi sei; <b>autorizzazione</b> vuol dire decidere cosa puoi fare.`,
        `Il flusso: fai login con <code>POST /api/auth/login</code> mandando username e password; il server ti risponde con un <b>token JWT</b>; da quel momento lo mandi in ogni richiesta, nell'intestazione <code>Authorization: Bearer &lt;token&gt;</code>.`,
        `Un JWT è fatto di tre parti separate da punti: <b>header.payload.firma</b>, scritte in Base64.`,
        `Il <b>payload</b> si legge senza nessuna chiave, quindi dentro ci vanno solo informazioni non sensibili: <code>sub</code> (chi sei), <code>role</code> (il tuo ruolo), <code>iat</code> (quando è stato creato il token) ed <code>exp</code> (quando scade).`,
        `Il JWT è <b>firmato</b>, non cifrato. La firma è calcolata su header e payload usando <code>JWT_SECRET</code>, la variabile che hai configurato al Giorno 1. Se qualcuno modifica il payload, per esempio cambiando "operator" in "admin", la firma non corrisponde più e il server rifiuta il token.`,
        `Il server non tiene un elenco dei login attivi: tutto ciò che serve è nel token. Questo rende facile avere più copie del server. Il rovescio della medaglia: non puoi annullare un token prima che scada. Le soluzioni, dalla più semplice: una <b>durata breve</b> (il corso usa 30 minuti); poi un <b>refresh token</b>; e solo se le regole interne della banca (compliance) lo impongono, una lista di token annullati da controllare a ogni richiesta.`],
    ex: `È come un badge aziendale timbrato: chiunque può leggere il nome, ma solo l'ufficio con il timbro può crearlo. Lato Angular è il token che il tuo interceptor aggiungeva a ogni chiamata.`,
    k: [[`Token`, `Stringa che dimostra la tua identità senza rimandare la password.`], [`Base64`, `Codifica che trasforma dati in testo; non è cifratura, si decodifica in un attimo.`], [`HMAC`, `Firma calcolata con un segreto: chi non ha il segreto non può produrla.`], [`Refresh token`, `Token a lunga durata usato solo per ottenere nuovi token brevi; quello sì si salva e si può annullare.`]] },
  { t: `Password e ruoli`,
    s: `Le password si salvano con un hash lento e con salt. I ruoli si controllano con una dipendenza che risponde 403 se il ruolo non basta.`,
    p: [`Le password non si salvano mai così come sono, e nemmeno con un hash veloce come SHA-256, perché un attaccante può provare miliardi di combinazioni al secondo. Si usa un hash <b>lento e con salt</b>: <b>argon2</b> (oppure bcrypt), in <code>src/auth/passwords.py</code>.`,
        `Il <b>salt</b> è un valore casuale, diverso per ogni password, che si aggiunge prima di calcolare l'hash. Così due utenti con la stessa password hanno hash diversi.`,
        `Un dettaglio di sicurezza del login: se lo username non esiste, il server calcola comunque un hash finto. Così il tempo di risposta è uguale in tutti e due i casi, e un attaccante non può capire quali username esistono misurando i tempi.`,
        `Lato FastAPI: <code>OAuth2PasswordBearer</code> è la dipendenza che legge il token dall'intestazione (e attiva il pulsante <b>Authorize</b> su /docs); <code>get_current_user</code> lo verifica e restituisce chi sei.`,
        `Per limitare un endpoint a certi ruoli si usa <code>require_role("compliance_lead", "admin")</code>: è una dipendenza che controlla il ruolo nel token e risponde <b>403</b> se non è tra quelli ammessi.`,
        `Per non confondersi: <b>401</b> vuol dire "non so chi sei" (token mancante, scaduto o non valido); <b>403</b> vuol dire "so chi sei, ma non hai il permesso".`,
        `Se un token non ha un ruolo, si assume <code>public</code>, quello con meno permessi. In sicurezza, nel dubbio, si sceglie sempre l'opzione più restrittiva.`],
    k: [[`Hash`, `Trasformazione a senso unico: dalla password si ottiene l'hash, non il contrario.`], [`Salt`, `Valore casuale aggiunto alla password prima dell'hash.`], [`Brute force`, `Indovinare una password provando moltissime combinazioni.`]] },
  { t: `Ogni ruolo vede solo i suoi documenti`,
    s: `Ogni chunk ha un livello di visibilità, e ogni ruolo vede solo certi livelli. Il filtro va nella query SQL, così i dati riservati non escono mai dal database.`,
    p: [`Ogni chunk ha una colonna <code>visibility</code> con uno di questi livelli:<br>• <b>public</b>: materiale che anche un cliente potrebbe leggere (fogli informativi, commissioni);<br>• <b>internal</b>: procedure per il personale (blocco carta, verifiche allo sportello);<br>• <b>risk_only</b>: soglie operative e limiti di esposizione;<br>• <b>compliance_only</b>: fascicoli e segnalazioni antiriciclaggio.`,
        `Una tabella in <code>src/auth/acl.py</code> dice quali livelli può vedere ogni ruolo. Per esempio <code>compliance_lead</code> vede public, internal e compliance_only. I ruoli <b>non sono in ordine di importanza</b>: compliance_lead e risk_lead vedono cose <b>diverse</b>, non uno più dell'altro. Per questo non si usano livelli numerici (1, 2, 3), che inventerebbero un ordine che non esiste.`,
        `Il filtro si scrive <b>nella query SQL</b> (<code>WHERE visibility IN (...)</code>), non nel codice Python dopo aver letto i risultati.`,
        `Il motivo è di sicurezza. Se prima leggi tutto e poi scarti i chunk riservati in Python, quel testo è già uscito dal database: è passato nella memoria del server e potrebbe finire in un log, in un messaggio d'errore o in una cache. La regola è che dal database esce solo ciò che l'utente può vedere.`,
        `Sulla colonna <code>visibility</code> si crea un indice del database (la struttura che velocizza la ricerca, come l'indice di un libro), perché da ora ogni ricerca filtra su quella colonna.`,
        `Il primo test da scrivere: un <code>operator</code> non deve mai vedere un chunk <code>compliance_only</code>. Il test controlla anche l'SQL generato, cioè che contenga il filtro, e non solo che il risultato sia giusto: un risultato giusto per caso non dimostra che il filtro c'è.`],
    ex: `In Angular nascondere un bottone con <code>*ngIf</code> non protegge niente: il dato è già arrivato nel browser. Qui vale lo stesso ragionamento, ma dentro il backend.`,
    k: [[`ACL`, `Access Control List: elenco di chi può accedere a cosa.`], [`Data minimization`, `Far circolare solo i dati strettamente necessari.`], [`RBAC`, `Controllo degli accessi basato sui ruoli.`]] },
  { t: `Il percorso a tappe e i tempi`,
    s: `Ogni domanda passa da una serie di tappe, e per ognuna si misura quanto tempo impiega. Così, se il sistema rallenta, sai dove guardare.`,
    p: [`Ora il servizio RAG (<code>RAGService</code>) è una sequenza di tappe: autenticazione → riscrittura → embedding → ricerca per ruolo → costruzione del prompt → generazione della risposta.`,
        `Per ogni tappa si misurano i <b>millisecondi</b> impiegati e si scrivono nel log della richiesta (si chiama <b>tracing</b>). Se le risposte diventano lente, vedi subito quale tappa è la colpevole.`,
        `Un numero che userai spesso è il <b>p95</b>: il tempo entro cui risponde il 95% delle richieste. Se il p95 sale ma non hai i tempi per tappa, sai che qualcosa rallenta, ma non cosa.`,
        `Ogni tappa che non è indispensabile ha un piano B. Se la riscrittura non risponde, si va avanti con la domanda originale. Se il modello principale non risponde, la risposta lo dice chiaramente invece di restituire un errore 500.`,
        `C'è anche un limite di richieste per utente (con la libreria slowapi). Chi lo supera riceve un <b>429</b>, con lo stesso formato di errore del Giorno 2.`],
    k: [[`Tracing`, `Registrare quanto dura ogni passo di una richiesta.`], [`Percentile (p95)`, `Il valore sotto cui sta il 95% delle misure.`], [`Log strutturato`, `Log scritto come campi (JSON), facile da filtrare e analizzare.`]] },
  { t: `Quando il chunk giusto non arriva primo`,
    s: `Se il chunk giusto viene trovato ma non è in cima, si riordinano i risultati. Se la domanda contiene un codice, si aggiunge la ricerca per parole.`,
    p: [`Prima si capisce dov'è il problema. Il chunk giusto non è proprio tra i risultati? Il problema è a monte, nel chunking o negli embedding. C'è, ma non è al primo posto? Serve <b>riordinare</b>. La domanda contiene un codice? Serve la <b>ricerca per parole</b>.`,
        `<b>Riordinare (re-ranking).</b> Si prendono tanti candidati, per esempio 20, e un secondo modello, il <b>cross-encoder</b>, li rimette in ordine tenendo i migliori. Il cross-encoder legge domanda e chunk <b>insieme</b>, quindi è più preciso. Ma mentre gli embedding dei documenti li calcoli una volta sola durante l'ingestion, il punteggio del cross-encoder dipende anche dalla domanda e va ricalcolato a ogni domanda, per ogni candidato. È lento, per questo si usa solo su pochi candidati. Per testi in italiano deve essere un modello multilingue.`,
        `<b>Ricerca ibrida.</b> Si affiancano la ricerca per <b>significato</b> (embedding) e quella per <b>parole</b>. Per la seconda si usa la ricerca full-text di Postgres: il testo di ogni chunk viene scomposto in parole normalizzate in una colonna <code>tsvector</code>, con un indice GIN che rende veloce trovare quali chunk contengono una parola. Serve per IBAN, codici cliente o "S-2026-137": un codice non ha un significato che l'embedding possa catturare. Nella ricerca per parole basta che il chunk contenga almeno una parola della domanda; un codice invece si cerca intero, con tutti i pezzi in fila.`,
        `Le due classifiche si uniscono con la <b>Reciprocal Rank Fusion</b> (RRF): ogni chunk riceve <code>1/(60 + posizione)</code> da ciascuna classifica e i punteggi si sommano. Si usano le posizioni perché i punteggi delle due ricerche sono su scale diverse e non si possono sommare direttamente. Il filtro per ruolo va messo in <b>tutte e due</b> le ricerche.`,
        `Ogni miglioria si misura prima e dopo, sulle stesse domande di prova e guardando anche i tempi: <b>hit@k</b> (il chunk giusto è tra i primi k?), <b>MRR</b> (in media, quanto in alto compare il primo chunk giusto) e <b>nDCG</b> (quanto è buono l'ordine complessivo).`],
    k: [[`Full-text search`, `Ricerca per parole, con radici e varianti (lessicale).`], [`Cross-encoder`, `Modello che legge domanda e passaggio insieme e dà un punteggio.`], [`Bi-encoder`, `Modello che calcola un vettore per ogni testo separatamente: è l'embedding normale.`], [`MRR`, `Mean Reciprocal Rank: media di 1/posizione del primo risultato giusto.`]] }
];

(function applySlim(){
  const words = t => t.replace(/<[^>]+>/g, " ").split(/\s+/).filter(Boolean).length;
  const seenTerms = new Set();
  DAYS.forEach(d => {
    const cfg = SLIM[d.id] || {};
    d.slides.forEach((s, i) => {
      const mv = (cfg.more || {})[i] || (Array.isArray(s.more) ? s.more.filter(x => typeof x === "number") : []);
      s.more = s.p.filter((_, j) => mv.includes(j));
      s.p = s.p.filter((_, j) => !mv.includes(j));
      s.opt = (cfg.opt || []).includes(i);
      s.kAll = s.k || [];
      s.k = s.kAll.filter(([a]) => { const key = a.toLowerCase(); if (seenTerms.has(key)) return false; seenTerms.add(key); return true; });
    });
    if (cfg.flash) d.flash = cfg.flash.map(i => d.flash[i]);
    if (cfg.quiz) d.quiz = cfg.quiz.map(i => d.quiz[i]);
    if (MAPS[d.id]) d.map = MAPS[d.id];
    /* tempi stimati in base alle parole: lettura attenta ~150 parole/minuto */
    const core = d.slides.filter(s => !s.opt);
    const slideW = core.reduce((a, s) => a + words(s.s || "") + words(s.p.join(" ")) + words(s.ex || "") + words((s.k || []).flat().join(" ")), 0);
    const mapW = words(d.map.branches.map(b => b.items.join(" ")).join(" ") + (d.map.flow || []).join(" "));
    d.mins = { map: Math.max(1, Math.round(mapW / 120)), slides: Math.round(slideW / 150), flash: 3, quiz: 4 };
    d.min = d.mins.map + d.mins.slides + d.mins.flash + d.mins.quiz;
  });
})();

  { a: `pyproject.toml`, d: 1, b: `Il file che descrive il progetto (nome, Python richiesto, librerie con versione minima) e configura ruff, mypy e pytest. Come package.json.` },
  { a: `uv.lock`, d: 1, b: `Il lockfile di uv: versione esatta e impronta di ogni libreria installata. Va su Git. Come package-lock.json.` },
  { a: `Type hints`, al: [`type hint`], d: 1, b: `Annotazioni che dichiarano i tipi (<code>nome: str</code>, <code>-&gt; int</code>). Python non li controlla mentre gira: li controlla mypy prima, e Pydantic/FastAPI li leggono per validare.` },
  { a: `Pydantic`, d: 2, b: `Libreria che valida e serializza i dati partendo dai type hints. Un modello Pydantic controlla i dati quando arrivano. Simile a Zod.` },
  { a: `FastAPI`, d: 2, b: `Framework Python per scrivere API web: asincrono, guidato dai type hints, genera da solo la documentazione su /docs.` },
  { a: `uvicorn`, d: 2, b: `Il server che fa girare un'app FastAPI e riceve le richieste HTTP.` },
  { a: `Endpoint`, d: 2, b: `Una combinazione metodo + indirizzo che il server gestisce, es. <code>POST /api/chat</code>.` },
  { a: `Middleware`, d: 2, b: `Codice che avvolge ogni richiesta: lavora prima e dopo l'endpoint (es. CORS, request-id). Come un HttpInterceptor.` },
  { a: `pytest`, d: 1, b: `Lo strumento standard per scrivere ed eseguire i test in Python.` },
  { a: `PostgreSQL`, al: [`Postgres`], d: 3, b: `Il database relazionale usato nel corso: tabelle, SQL, transazioni.` },
  { a: `SQLAlchemy`, d: 3, b: `L'ORM di riferimento in Python: traduce classi in tabelle e costruisce le query. Come TypeORM o Prisma.` },
  { a: `Alembic`, d: 3, b: `Lo strumento delle migration per SQLAlchemy: tiene le versioni dello schema del database. Come Flyway o Liquibase.` },
  { a: `asyncpg`, d: 3, b: `Il driver asincrono che collega Python a PostgreSQL.` },
  { a: `Instructor`, d: 4, b: `Libreria che obbliga il modello a rispondere secondo uno schema Pydantic, valida la risposta e ritenta se non va bene.` },
  { a: `RAG`, d: 5, b: `Retrieval-Augmented Generation: prima recuperi i passaggi giusti dai tuoi documenti, poi il modello risponde usando solo quelli e li cita.` },
  { a: `Embedding`, d: 5, b: `Una lista di numeri che rappresenta il significato di un testo. Testi con significato simile hanno vettori vicini.` },
  { a: `pgvector`, d: 5, b: `Estensione di PostgreSQL che aggiunge il tipo <code>vector</code> e la ricerca per vicinanza (operatore <code>&lt;=&gt;</code>).` },
  { a: `HNSW`, d: 5, b: `Indice vettoriale a grafo a strati: trova i vicini molto velocemente, in modo approssimato (circa il 99% di quelli veri).` },
  { a: `Similarità coseno`, al: [`cosine similarity`, `coseno`], d: 5, b: `Misura l'angolo fra due vettori: 1 = stessa direzione (molto simili), 0 = nessuna relazione.` },
  { a: `Re-ranking`, al: [`riordino`], d: 6, b: `Secondo passaggio: si prendono molti candidati e un modello più preciso (cross-encoder) li riordina, tenendone pochi.` },
  { a: `Ricerca ibrida`, al: [`hybrid search`], d: 6, b: `Combina la ricerca per significato (embedding) con quella per parole (full-text). Utile per codici come IBAN o numeri di pratica.` },
  { a: `RRF`, al: [`Reciprocal Rank Fusion`], d: 6, b: `Modo di fondere due classifiche: ogni risultato prende 1/(60 + posizione) da ogni elenco e i valori si sommano.` },
  { a: `JWT`, d: 6, b: `JSON Web Token: un "badge" firmato che il client manda a ogni richiesta. Contiene chi sei e il tuo ruolo; si legge senza chiave ma non si può modificare.` },
  { a: `argon2`, d: 6, b: `Algoritmo di hash per le password, volutamente lento e con salt, per resistere ai tentativi a forza bruta.` },
  { a: `Query rewriting`, d: 6, b: `Un LLM riscrive la domanda dell'utente in forma completa, solo per cercare meglio. Al modello che risponde va la domanda originale.` },
  { a: `Streaming`, d: 4, b: `Il modello manda la risposta a pezzi mentre la genera, così l'utente vede subito il testo.` }
];
/* Termini delle slide troppo comuni in italiano: restano nel glossario ma non vengono evidenziati nel testo */
const NO_AUTO = new Set([`indice`,`sessione`,`origine`,`distanza`,`soglia`,`citazione`,`connessione`,`istanza`,`vincolo`,`dimensioni`,`grafo`,`client`,`log`,`deprecato`,`mutabile`,`normalizzare`,`atomico`,`confine`,`schema`,`layer`,`segreto`,`interprete`,`validazione`,`serializzazione`,`tassonomia`,`eval`,`timeout`,`driver`,`metadati di provenienza`]);

</script>
<script>
(function(){
  const KEY = "lipari-ripasso-v1";
  let st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { st = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };
  const prog = id => (st[id] = st[id] || {});

  const app = document.getElementById("app");
  const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
  const STEPS = [["map","Mappa"],["slides","Slide"],["flash","Flashcard"],["quiz","Quiz"]];
  const stepMin = (d,k) => d.mins ? d.mins[k] : 3;
  let view = { day:null, step:"map", i:0, fc:null, qz:null };

  function dayDone(d){ const p = st[d.id]||{}; return STEPS.filter(s => s[0]==="quiz" ? p.quiz!=null : p[s[0]]).length; }

  function setNav(which){
    document.getElementById("nav-home").setAttribute("aria-current", which==="home");
    document.getElementById("nav-gl").setAttribute("aria-current", which==="gl");
  }


  /* ---------- GLOSSARIO CONDIVISO + POPUP ---------- */
  const GL = [];            // {a, b, n, keys:[...]}
  const byKey = new Map();
  const addTerm = (a, b, n, al) => {
    const keys = new Set([a]);
    const m = a.match(/^(.*?)\s*\((.+)\)\s*$/); if (m) { keys.add(m[1]); keys.add(m[2]); }
    (al||[]).forEach(x => keys.add(x));
    const ks = [...keys].map(k => k.trim()).filter(k => k.length > 1);
    if (ks.some(k => byKey.has(k.toLowerCase()))) return;
    const e = { a, b, n, keys: ks }; GL.push(e);
    ks.forEach(k => byKey.set(k.toLowerCase(), e));
  };
  DAYS.forEach(d => d.slides.forEach(s => (s.k||[]).forEach(([a,b]) => addTerm(a, b, d.n))));
  GLOSS_EXTRA.forEach(x => addTerm(x.a, x.b, x.d, x.al));
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const autoKeys = [...byKey.keys()].filter(k => !NO_AUTO.has(k)).sort((x,y) => y.length - x.length);
  const RX = new RegExp("(?<![\\p{L}\\p{N}_.])(" + autoKeys.map(esc).join("|") + ")(?![\\p{L}\\p{N}_])", "giu");

  function annotate(root, skip){
    const used = new Set(skip || []);
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n =>
      n.parentElement.closest("code,.terms,.tt,.lbl,button.opt,.verdict,h3,.center") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const txt = node.nodeValue; RX.lastIndex = 0;
      let m, last = 0, frag = null;
      while ((m = RX.exec(txt))) {
        const e = byKey.get(m[1].toLowerCase());
        if (!e || used.has(e)) continue;
        used.add(e);
        frag = frag || document.createDocumentFragment();
        frag.append(txt.slice(last, m.index));
        const sp = document.createElement("span");
        sp.className = "tt"; sp.tabIndex = 0; sp.textContent = m[1]; sp.dataset.k = m[1].toLowerCase();
        frag.append(sp); last = m.index + m[1].length;
      }
      if (frag) { frag.append(txt.slice(last)); node.replaceWith(frag); }
    });
  }

  const pop = document.getElementById("pop");
  let popFor = null, shownAt = 0;
  function showPop(el){
    const e = byKey.get(el.dataset.k); if (!e) return;
    pop.innerHTML = `<b>${e.a}</b>${e.b}<small>Giornata ${e.n} · nel glossario</small>`;
    pop.hidden = false; popFor = el; shownAt = Date.now();
    document.querySelectorAll(".tt.open").forEach(x => x.classList.remove("open")); el.classList.add("open");
    const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    let left = Math.min(Math.max(16, r.left + r.width/2 - pw/2), innerWidth - pw - 16);
    let top = r.bottom + 8; if (top + ph > innerHeight - 8) top = r.top - ph - 8;
    pop.style.left = left + "px"; pop.style.top = Math.max(8, top) + "px";
  }
  function hidePop(){ pop.hidden = true; if (popFor) popFor.classList.remove("open"); popFor = null; }
  document.addEventListener("mouseover", ev => { const t = ev.target.closest && ev.target.closest(".tt"); if (t && matchMedia("(hover:hover)").matches) showPop(t); });
  document.addEventListener("mouseout", ev => { const t = ev.target.closest && ev.target.closest(".tt"); if (t && matchMedia("(hover:hover)").matches) hidePop(); });
  document.addEventListener("focusin", ev => { if (ev.target.classList && ev.target.classList.contains("tt")) showPop(ev.target); });
  document.addEventListener("focusout", ev => { if (ev.target.classList && ev.target.classList.contains("tt")) hidePop(); });
  document.addEventListener("click", ev => {
    const t = ev.target.closest && ev.target.closest(".tt");
    if (t) { ev.stopPropagation(); ev.preventDefault(); if (popFor === t) { if (Date.now() - shownAt > 400) hidePop(); } else showPop(t); return; }
    hidePop();
  }, true);
  addEventListener("scroll", hidePop, { passive:true });
  addEventListener("keydown", ev => { if (ev.key === "Escape") hidePop(); });

  /* ---------- HOME ---------- */
  function renderHome(){
    setNav("home"); app.classList.remove("with-side");
    const total = DAYS.reduce((a,d)=>a+d.min,0);
    const doneSteps = DAYS.reduce((a,d)=>a+dayDone(d),0), all = DAYS.length*4;
    const next = DAYS.find(d => dayDone(d) < 4);
    app.innerHTML = "";
    app.append($(`<section class="hero">
      <span class="eyebrow">Corso Python AI · giornate 1–${DAYS.length} di 10</span>
      <h1>Il percorso di ripasso</h1>
      <p>Ogni giornata richiede circa ${Math.round(total/DAYS.length)} minuti: prima la mappa per vedere il quadro, poi poche slide, poi flashcard e quiz per fissare. Totale circa ${Math.round(total/5)*5} minuti.</p>
      <div class="meter"><div class="bar"><i style="width:${Math.round(doneSteps/all*100)}%"></i></div><span>${doneSteps}/${all} passi fatti</span></div>
    </section>`));
    app.append($(`<div class="tip"><b>Come usarlo:</b> vai con calma, una giornata alla volta e in ordine. Se un quiz va meno bene del previsto, rileggi le slide di quella giornata e rifai le flashcard "da ripassare": capita a tutti. ${next ? `Prossima tappa: <b>Giornata ${next.n}</b>.` : `Hai completato tutte le giornate disponibili.`}</div>`));
    const ol = $(`<ol class="route"></ol>`);
    DAYS.forEach(d => {
      const p = st[d.id]||{}, n = dayDone(d);
      const cls = n===4 ? "done" : n>0 ? "part" : "";
      const li = $(`<li>
        <div class="stop ${cls}">${n===4 ? "✓" : d.n}</div>
        <button class="daycard" type="button">
          <span class="eyebrow">Giornata ${d.n} · ${d.min} min</span>
          <h3>${d.title}</h3>
          <p>${d.sub}</p>
          <span class="chips">${STEPS.map(s=>{
            const ok = s[0]==="quiz" ? p.quiz!=null : p[s[0]];
            const lbl = s[0]==="quiz" && p.quiz!=null ? `Quiz ${p.quiz}/${d.quiz.length}` : s[1];
            return `<span class="chip ${ok?"on":""}">${lbl}</span>`;}).join("")}</span>
        </button></li>`);
      li.querySelector(".daycard").onclick = () => go(d.id);
      ol.append(li);
    });
    COMING.forEach(n => ol.append($(`<li class="soon"><div class="stop">${n}</div><div class="daycard"><span class="eyebrow">Giornata ${n}</span><p>In arrivo: la aggiungo quando mi mandi il file.</p></div></li>`)));
    app.append(ol);
  }

  /* ---------- GIORNATA ---------- */
  function renderDay(){
    hidePop(); setNav("day");
    const d = view.day;
    app.innerHTML = ""; app.classList.add("with-side");
    app.append(renderSide(d));
    const mainEl = $(`<div class="daymain"></div>`); app.append(mainEl);
    mainEl.append($(`<section class="dayhead"><span class="eyebrow">Giornata ${d.n} · circa ${d.min} minuti</span><h1>${d.title}</h1><p>${d.sub}</p></section>`));
    const p = st[d.id]||{};
    const tabs = $(`<div class="steps" role="tablist"></div>`);
    STEPS.forEach(([k,lbl],ix) => { const t = stepMin(d,k) + " min";
      const ok = k==="quiz" ? p.quiz!=null : p[k];
      const b = $(`<button class="step ${ok?"ok":""}" role="tab" type="button" aria-selected="${view.step===k}"><b><span class="num">${ix+1}. </span>${lbl}</b><small>${ok ? (k==="quiz" ? `fatto · ${p.quiz}/${d.quiz.length}` : "fatto") : t}</small></button>`);
      b.onclick = () => { view.step = k; view.i = 0; view.fc = null; view.qz = null; renderDay(); };
      tabs.append(b);
    });
    mainEl.append(tabs);
    const body = $(`<section></section>`);
    mainEl.append(body);
    ({map:renderMap, slides:renderSlides, flash:renderFlash, quiz:renderQuiz})[view.step](d, body);
  }


  function renderSide(d){
    const side = $(`<nav class="side" aria-label="Giornate"><span class="eyebrow">Giornate</span></nav>`);
    DAYS.forEach(x => {
      const cur = x === d, done = dayDone(x) === 4;
      const b = $(`<button class="sd ${done?"done":""}" type="button" ${cur?'aria-current="page"':""} title="Giornata ${x.n}: ${x.title.replace(/"/g,"")}"><span class="c">${done?"✓":x.n}</span><span class="t">${x.title}</span></button>`);
      b.onclick = () => go(x.id);
      side.append(b);
      if (cur) {
        const p = st[x.id]||{};
        const sub = $(`<div class="substeps"></div>`);
        STEPS.forEach(([k,lbl]) => {
          const ok = k==="quiz" ? p.quiz!=null : p[k];
          const sb = $(`<button class="ss" type="button" ${view.step===k?'aria-current="step"':""}><span>${lbl}</span>${ok?`<span class="ok">${k==="quiz"?p.quiz+"/"+x.quiz.length:"✓"}</span>`:""}</button>`);
          sb.onclick = () => { view.step = k; view.i = 0; view.fc = null; view.qz = null; renderDay(); scrollTo(0,0); };
          sub.append(sb);
        });
        side.append(sub);
      }
    });
    COMING.forEach(n => side.append($(`<div class="sd soon"><span class="c">${n}</span><span class="t">In arrivo</span></div>`)));
    requestAnimationFrame(() => { const a = side.querySelector('[aria-current="page"]'); if (a && side.scrollWidth > side.clientWidth) side.scrollLeft = a.offsetLeft - 16; });
    return side;
  }

  function nextStepBtn(d, label){
    const ix = STEPS.findIndex(s=>s[0]===view.step);
    if (ix < 3) { const b = $(`<button class="btn primary" type="button">${label || "Avanti: " + STEPS[ix+1][1]} →</button>`); b.onclick = () => { view.step = STEPS[ix+1][0]; view.i=0; view.fc=null; view.qz=null; renderDay(); scrollTo(0,0); }; return b; }
    const nd = DAYS[DAYS.indexOf(d)+1];
    const b = $(`<button class="btn primary" type="button">${nd ? `Giornata ${nd.n} →` : "Torna al percorso"}</button>`);
    b.onclick = () => nd ? go(nd.id) : go("");
    return b;
  }

  function renderMap(d, el){
    prog(d.id).map = true; save();
    const m = d.map;
    const box = $(`<div class="map"><div class="center">${m.center}</div></div>`);
    if (m.flow) box.append($(`<div class="flowbox"><div class="eyebrow">Il flusso, in ordine</div><div class="flow">${m.flow.map(s=>`<span class="n">${s}</span>`).join(`<span class="a">→</span>`)}</div></div>`));
    box.append($(`<div class="branches">${m.branches.map(b=>`<div class="branch"><h3>${b.name}</h3><ul>${b.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")}</div>`));
    el.append(box); annotate(box);
    const pg = $(`<div class="pager"><span><small>Dai un'occhiata al quadro: serve a sapere dove sei, non a memorizzare.</small></span></div>`);
    pg.append(nextStepBtn(d));
    el.append(pg);
  }

  function renderSlides(d, el){
    const s = d.slides[view.i], n = d.slides.length;
    const lastCore = d.slides.map((x,j)=>x.opt?-1:j).reduce((a,b)=>Math.max(a,b), 0);
    if (view.i >= lastCore) { prog(d.id).slides = true; save(); }
    const card = $(`<article class="slide" aria-live="polite">
      <span class="count">${s.opt ? `<span class="optb">Facoltativa</span> ` : ""}${view.i+1} / ${n}</span>
      <h2>${s.t}</h2>
      ${s.opt ? `<p class="optnote">Questo è un ripasso: se queste basi ti sono già chiare, puoi saltarlo e andare alle flashcard.</p>` : ""}
      ${s.s ? `<p class="brief"><b>In breve</b>${s.s}</p>` : ""}
      <div class="body">${s.p.map(x=>`<p>${x}</p>`).join("")}</div>
      ${s.ex ? `<div class="analogy"><b class="lbl">Dal mondo TS / Angular</b>${s.ex}</div>` : ""}
      ${s.k && s.k.length ? `<div class="terms"><span class="lbl">Parole nuove</span><dl>${s.k.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl></div>` : ""}
      ${s.more && s.more.length ? `<details class="more"><summary>Per approfondire <small>(${s.more.length} ${s.more.length===1?"punto":"punti"}, facoltativo)</small></summary><div class="body">${s.more.map(x=>`<p>${x}</p>`).join("")}</div></details>` : ""}
    </article>`);
    el.append(card);
    annotate(card, (s.k||[]).map(([a]) => byKey.get(a.toLowerCase())).filter(Boolean));
    const pg = $(`<div class="pager"></div>`);
    const prev = $(`<button class="btn" type="button" ${view.i===0?"disabled":""}>← Indietro</button>`);
    prev.onclick = () => { view.i--; renderDay(); };
    const dots = $(`<div class="dots">${d.slides.map((x,j)=>`<i class="${j<=view.i?"on":""} ${x.opt?"opt":""}"></i>`).join("")}</div>`);
    pg.append(prev, dots);
    const right = $(`<div class="pg-right"></div>`);
    if (view.i === lastCore && lastCore < n-1) {
      const o = $(`<button class="btn" type="button">Ripasso facoltativo</button>`); o.onclick = () => { view.i++; renderDay(); };
      right.append(o, nextStepBtn(d));
    } else if (view.i < n-1) { const nx = $(`<button class="btn primary" type="button">Avanti →</button>`); nx.onclick = () => { view.i++; renderDay(); }; right.append(nx); }
    else right.append(nextStepBtn(d));
    pg.append(right);
    el.append(pg);
  }

  function renderFlash(d, el){
    if (!view.fc) view.fc = { order: d.flash.map((_,j)=>j), pos:0, miss:[], flipped:false };
    const f = view.fc;
    if (f.pos >= f.order.length) {
      prog(d.id).flash = true; save();
      const box = $(`<div class="qcard result"><div class="big">${f.order.length - f.miss.length}/${f.order.length}</div><p>${f.miss.length ? `Ne hai ${f.miss.length} da ripassare.` : "Le sapevi tutte."}</p></div>`);
      const acts = $(`<div class="fc-actions"></div>`);
      if (f.miss.length) { const r = $(`<button class="btn" type="button">Ripassa solo quelle</button>`); r.onclick = () => { view.fc = { order:f.miss.slice(), pos:0, miss:[], flipped:false }; renderDay(); }; acts.append(r); }
      acts.append(nextStepBtn(d));
      box.append(acts); el.append(box); return;
    }
    const [q,a] = d.flash[f.order[f.pos]];
    const wrap = $(`<div class="fc-wrap"></div>`);
    const card = $(`<button class="fc ${f.flipped?"flip":""}" type="button" aria-label="Gira la carta"><div class="fc-in">
      <div class="face front"><span class="count eyebrow">Carta ${f.pos+1} di ${f.order.length}</span><div class="q">${q}</div><span class="hint">Rispondi a mente, poi tocca la carta per girarla</span></div>
      <div class="face back"><span class="eyebrow">Risposta</span><div>${a}</div></div></div></button>`);
    card.onclick = () => { f.flipped = !f.flipped; card.classList.toggle("flip", f.flipped); acts.hidden = !f.flipped; };
    const acts = $(`<div class="fc-actions"></div>`);
    const no = $(`<button class="btn no" type="button">Da ripassare</button>`), yes = $(`<button class="btn yes" type="button">La sapevo</button>`);
    no.onclick = () => { f.miss.push(f.order[f.pos]); f.pos++; f.flipped=false; renderDay(); };
    yes.onclick = () => { f.pos++; f.flipped=false; renderDay(); };
    acts.append(no, yes); acts.hidden = !f.flipped;
    wrap.append(card, acts); el.append(wrap);
  }

  function renderQuiz(d, el){
    if (!view.qz) view.qz = { pos:0, score:0, picked:null, perm: d.quiz.map(q => q.o.map((_,j)=>j).sort(()=>Math.random()-.5)) };
    const z = view.qz;
    if (z.pos >= d.quiz.length) {
      const p = prog(d.id); p.quiz = z.score; save();
      const msg = z.score >= 5 ? "Ottimo, questa giornata è a posto." : z.score >= 4 ? "Bene! Se vuoi, rivedi solo le domande sbagliate." : "Nessun problema: dai un'altra occhiata alle slide e alle flashcard da ripassare, poi riprova. Due giri sono normali.";
      const box = $(`<div class="qcard result"><div class="big">${z.score}/${d.quiz.length}</div><p>${msg}</p></div>`);
      const acts = $(`<div class="fc-actions"></div>`);
      const again = $(`<button class="btn" type="button">Rifai il quiz</button>`); again.onclick = () => { view.qz = null; renderDay(); };
      acts.append(again, nextStepBtn(d)); box.append(acts); el.append(box); return;
    }
    const raw = d.quiz[z.pos], pm = z.perm[z.pos];
    const q = Object.assign({}, raw, { o: pm.map(j=>raw.o[j]), c: pm.indexOf(raw.c) });
    const card = $(`<article class="qcard"><span class="count eyebrow">Domanda ${z.pos+1} di ${d.quiz.length}</span><h2>${q.q}</h2><div class="opts"></div></article>`);
    const opts = card.querySelector(".opts");
    q.o.forEach((t,j) => {
      const b = $(`<button class="opt" type="button"><span class="l">${"ABCD"[j]}</span><span>${t}</span></button>`);
      if (z.picked != null) { b.disabled = true; if (j===q.c) b.classList.add("right"); else if (j===z.picked) b.classList.add("wrong"); }
      b.onclick = () => { z.picked = j; if (j===q.c) z.score++; renderDay(); };
      opts.append(b);
    });
    if (z.picked != null) {
      const ok = z.picked === q.c;
      const ex = $(`<div class="explain"><p class="verdict ${ok?"r":"w"}">${ok ? "Esatto!" : "Quasi! La risposta giusta è la " + "ABCD"[q.c] + "."}</p><p>${q.w}</p><div class="lex"><span class="lbl">Come lo dice un dev</span>${q.term}</div></div>`);
      const nx = $(`<button class="btn primary" type="button" style="justify-self:end">${z.pos < d.quiz.length-1 ? "Prossima domanda →" : "Vedi il risultato →"}</button>`);
      nx.onclick = () => { z.pos++; z.picked=null; renderDay(); };
      annotate(ex); ex.append(nx); card.append(ex);
    }
    el.append(card);
  }

  /* ---------- GLOSSARIO ---------- */
  function renderGlossary(){
    setNav("gl"); app.classList.remove("with-side");
    const items = GL.slice().sort((x,y)=>x.a.localeCompare(y.a,"it"));
    app.innerHTML = "";
    app.append($(`<section class="dayhead"><span class="eyebrow">${items.length} termini dalle giornate 1–${DAYS.length}</span><h1>Glossario</h1><p>Le "parole nuove" delle slide e gli strumenti del corso, in ordine alfabetico. Nel testo li trovi sottolineati: passa il mouse o tocca per leggere la definizione.</p></section>`));
    const inp = $(`<input class="gl-search" id="gl-q" type="search" placeholder="Cerca un termine, es. embedding">`);
    const list = $(`<div class="gl"></div>`);
    const draw = () => {
      const q = inp.value.trim().toLowerCase();
      const f = items.filter(i => !q || (i.a+" "+i.b).toLowerCase().includes(q));
      list.innerHTML = f.length ? f.map(i=>`<div><b>${i.a}</b><span class="d">${i.b}</span><small>G${i.n}</small></div>`).join("") : `<p class="empty">Nessun termine trovato.</p>`;
    };
    inp.oninput = draw; draw();
    app.append(inp, list);
  }

  /* ---------- ROUTING ---------- */
  function go(h){ if (location.hash.slice(1) === h) route(); else location.hash = h; }
  function route(){
    const h = location.hash.slice(1);
    const d = DAYS.find(x => x.id === h);
    if (d) {
      if (view.day !== d) {
        const p = st[d.id]||{};
        view = { day:d, step: (STEPS.find(s => s[0]==="quiz" ? p.quiz==null : !p[s[0]]) || STEPS[0])[0], i:0, fc:null, qz:null };
      }
      renderDay();
    } else if (h === "glossario") { view.day = null; renderGlossary(); }
    else { view.day = null; renderHome(); }
    scrollTo(0,0);
  }
  document.getElementById("home-btn").onclick = () => go("");
  document.getElementById("nav-home").onclick = () => go("");
  document.getElementById("nav-gl").onclick = () => go("glossario");
  addEventListener("hashchange", route);
  addEventListener("keydown", e => {
    if (!view.day || e.target.tagName === "INPUT") return;
    if (view.step === "slides") {
      if (e.key === "ArrowRight" && view.i < view.day.slides.length-1) { view.i++; renderDay(); }
      if (e.key === "ArrowLeft" && view.i > 0) { view.i--; renderDay(); }
    }
  });
  route();
})();
</script>

</body></html>
