<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="LipariBank AI"><meta name="theme-color" content="#2750C4"><link rel="apple-touch-icon" href="ripasso-liparibank-icon.png"><title>Ripasso LipariBank AI</title></head><body>
<title>Ripasso LipariBank AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: colonna di lettura centrale; home = percorso a tappe, giornata = 4 passi (mappa, slide, flashcard, quiz) */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E9EDF4; --ink:#172031; --muted:#566275; --line:#D9DFE9;
  --accent:#2750C4; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --hl:#F3C537; --hl-soft:#FDF3D2; --hl-ink:#5B4500;
  --ok:#1C7F53; --ok-soft:#DDF2E8; --bad:#B93B33; --bad-soft:#F8E1DF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F141D; --surface:#171F2C; --sunk:#1E2838; --ink:#E6EBF2; --muted:#9AA6B7; --line:#2A3547;
  --accent:#7F9DFF; --accent-ink:#0F141D; --accent-soft:#222F4D;
  --hl:#E7BC3A; --hl-soft:#33301F; --hl-ink:#F3DB8C;
  --ok:#4CC38A; --ok-soft:#173327; --bad:#F07A70; --bad-soft:#3A1F1E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141D; --surface:#171F2C; --sunk:#1E2838; --ink:#E6EBF2; --muted:#9AA6B7; --line:#2A3547;
  --accent:#7F9DFF; --accent-ink:#0F141D; --accent-soft:#222F4D;
  --hl:#E7BC3A; --hl-soft:#33301F; --hl-ink:#F3DB8C;
  --ok:#4CC38A; --ok-soft:#173327; --bad:#F07A70; --bad-soft:#3A1F1E; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
small{color:var(--muted)}

/* barra in alto */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:24px}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{white-space:nowrap;font-family:var(--f-display);font-weight:750;font-size:18px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand .dot{width:12px;height:12px;border-radius:3px;background:linear-gradient(135deg,var(--accent) 50%,var(--hl) 50%)}
.top nav{margin-left:auto;display:flex;gap:6px}
.navbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:15px}
.navbtn[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* home */
.hero{display:grid;gap:10px;margin-bottom:28px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero h1{font-size:clamp(30px,5vw,44px);font-weight:750}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.meter{display:flex;align-items:center;gap:12px;margin-top:6px;font-variant-numeric:tabular-nums}
.bar{flex:1;max-width:340px;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.route{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.route li{display:grid;grid-template-columns:52px 1fr;gap:14px;position:relative}
.route li::before{content:"";position:absolute;left:25px;top:52px;bottom:-4px;width:2px;background:var(--line)}
.route li:last-child::before{display:none}
.stop{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:750;font-size:20px;background:var(--surface);border:2px solid var(--line);position:relative;z-index:1}
.stop.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stop.part{border-color:var(--accent);color:var(--accent)}
.daycard{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;width:100%;min-width:0}
.daycard:hover{border-color:var(--accent)}
.daycard h3{font-size:20px;font-weight:750}
.daycard p{margin:0;color:var(--muted);font-size:15.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:13px;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ok-soft);color:var(--ok);font-weight:600}
.soon .stop{border-style:dashed;color:var(--muted)}
.soon .daycard{background:transparent;border-style:dashed;cursor:default}
.tip{background:var(--hl-soft);color:var(--hl-ink);border-radius:var(--r);padding:12px 16px;font-size:15.5px;margin:6px 0 26px}
.tip b{color:inherit}

/* giornata */
.dayhead{display:grid;gap:6px;margin-bottom:18px}
.dayhead h1{font-size:clamp(26px,4.4vw,36px);font-weight:750}
.dayhead p{margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:22px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;text-align:left;display:grid;gap:0;min-width:0}
.step b{font-family:var(--f-display);font-size:16px}
.step small{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.step.ok small{color:var(--ok);font-weight:600}
@media (max-width:520px){ .step small,.step .num{display:none} .step{text-align:center;padding:9px 4px} .step b{font-size:15px}
  .brand{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis} .navbtn{padding:4px 9px;font-size:13.5px} .top .wrap{flex-wrap:nowrap;gap:8px} .top nav{flex:none} }

/* mappa */
.map{display:grid;gap:18px}
.center{justify-self:center;font-family:var(--f-display);font-weight:750;font-size:21px;background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;text-align:center}
.flowbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.flowbox .eyebrow{margin-bottom:10px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.flow span.n{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:15px;line-height:1.3;text-align:center}
.flow span.a{color:var(--accent);font-weight:700}
.branches{columns:3 230px;column-gap:12px;column-fill:balance}
.branches .branch{break-inside:avoid;margin:0 0 12px;display:block}
.branch{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.branch h3{font-size:16.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.branch h3::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--hl);flex:none}
.branch ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:15.5px}

/* slide */
.slide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px);display:grid;gap:14px;min-height:340px}
.slide .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.slide h2{font-size:clamp(23px,3.6vw,30px);font-weight:750}
.slide .body{display:grid;gap:10px;max-width:68ch}
.slide .body p{margin:0}
.analogy{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:16px}
.analogy b.lbl{display:block;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.terms{background:var(--hl-soft);border-radius:8px;padding:10px 14px;display:grid;gap:6px;font-size:15.5px}
.terms .lbl{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--hl-ink);font-weight:700}
.terms dl{margin:0;display:grid;gap:5px}
.terms dt{font-weight:700;display:inline;color:var(--ink)}
.terms dd{display:inline;margin:0}
.terms dt::after{content:" — "}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}

/* flashcard */
.fc-wrap{display:grid;gap:14px}
.fc{perspective:1200px;border:0;background:none;padding:0;width:100%;text-align:left}
.fc-in{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d;display:grid}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;border-radius:14px;padding:26px;display:grid;align-content:center;gap:10px;border:1px solid var(--line)}
.face.front{background:var(--surface)}
.face.back{background:var(--accent-soft);transform:rotateY(180deg)}
.face .q{font-family:var(--f-display);font-size:clamp(21px,3.4vw,26px);font-weight:750;line-height:1.25}
.face .hint{font-size:14px;color:var(--muted)}
.fc-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn.no{border-color:var(--bad);color:var(--bad)}
.btn.yes{border-color:var(--ok);color:var(--ok)}
@media (prefers-reduced-motion:reduce){ .fc-in,.bar i{transition:none} }

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,28px);display:grid;gap:14px}
.qcard h2{font-size:clamp(20px,3.2vw,24px);font-weight:750;line-height:1.3}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.opt .l{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.verdict{font-weight:700}
.verdict.r{color:var(--ok)} .verdict.w{color:var(--bad)}
.explain{display:grid;gap:10px}
.explain p{margin:0}
.lex{background:var(--hl-soft);border-radius:8px;padding:10px 14px;font-size:15.5px}
.lex .lbl{display:block;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--hl-ink);font-weight:700;margin-bottom:2px}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:24px}
.result .big{font-family:var(--f-display);font-size:56px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1}

/* glossario */
.gl-search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin:14px 0 18px}
.gl{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.gl div{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:12px;align-items:baseline}
.gl div:last-child{border-bottom:0}
.gl b{font-family:var(--f-display)}
.gl span.d{font-size:15.5px}
.gl small{font-family:var(--f-mono);font-size:12px}
@media (max-width:560px){ .gl div{grid-template-columns:1fr auto} .gl span.d{grid-column:1/-1;grid-row:2} }
.empty{color:var(--muted);padding:16px}

/* termini con definizione al passaggio del mouse */
.tt{text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help;border-radius:3px}
.tt:hover,.tt:focus-visible,.tt.open{background:var(--accent-soft)}
#pop{position:fixed;z-index:20;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 13px;font-size:14.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
#pop b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:2px}
#pop code{background:rgba(127,127,127,.25);color:inherit}
#pop small{display:block;margin-top:6px;color:inherit;opacity:.7;font-size:12px}

/* barra laterale delle giornate (solo nella vista giornata) */
#app.with-side{max-width:1140px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:2px;max-height:calc(100vh - 100px);overflow:auto;padding-bottom:8px}
.side .eyebrow{padding:0 10px 6px}
.sd{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;font-size:15px;line-height:1.3;color:var(--muted)}
.sd:hover{background:var(--sunk);color:var(--ink)}
.sd .c{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:750;font-size:13px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted)}
.sd.done .c{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.sd[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.sd[aria-current="page"] .c{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.sd.soon{cursor:default;opacity:.55}
.sd.soon:hover{background:none;color:var(--muted)}
.substeps{display:grid;gap:1px;margin:2px 0 8px 46px;border-left:2px solid var(--line);padding-left:8px}
.ss{background:none;border:0;text-align:left;padding:4px 8px;border-radius:6px;font-size:14.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ss:hover{background:var(--sunk);color:var(--ink)}
.ss[aria-current="step"]{color:var(--accent);font-weight:700}
.ss .ok{color:var(--ok);font-weight:700}
@media (max-width:899px){
  #app.with-side{display:block}
  .side{position:static;max-height:none;overflow-x:auto;overflow-y:hidden;display:flex;gap:6px;margin-bottom:18px;padding-bottom:6px;scrollbar-width:thin}
  .side .eyebrow,.side .substeps{display:none}
  .sd{flex:none;grid-template-columns:auto;padding:6px;border:1px solid var(--line);background:var(--surface)}
  .sd .t{display:none}
  .sd[aria-current="page"]{border-color:var(--accent)}
  .sd[aria-current="page"] .t{display:block;font-size:14px;white-space:nowrap;padding-right:4px}
  .sd[aria-current="page"]{grid-template-columns:26px auto;gap:8px}
}
.brief{margin:0;background:var(--sunk);border-radius:8px;padding:10px 14px;font-size:16.5px;max-width:68ch}
.brief b{display:block;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.more{border-top:1px dashed var(--line);padding-top:10px}
.more summary{cursor:pointer;font-weight:700;color:var(--accent);list-style-position:inside}
.more summary small{font-weight:400}
.more .body{margin-top:10px;font-size:16px}
.optb{font-family:var(--f-body);background:var(--hl-soft);color:var(--hl-ink);border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.optnote{margin:0;color:var(--muted);font-size:15px}
.dots i.opt{opacity:.5}
.pg-right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
</style>

<header class="top"><div class="wrap">
  <button class="brand" id="home-btn" type="button"><span class="dot"></span>Ripasso LipariBank AI</button>
  <nav>
    <button class="navbtn" id="nav-home" type="button">Percorso</button>
    <button class="navbtn" id="nav-gl" type="button">Glossario</button>
  </nav>
</div></header>

<main class="wrap" id="app"></main>
<div id="pop" role="tooltip" hidden></div>

<script>
const DAYS = [];

/* ============ GIORNATA 1 ============ */
DAYS.push({
  id: `g1`, n: 1, min: 17,
  title: `Setup Python, uv e tipi`,
  sub: `Gli attrezzi del progetto e le basi del linguaggio che servono da qui in poi`,
  map: {
    center: `Un progetto Python moderno`,
    branches: [
      { name: `Attrezzi`, items: [
        `<b>uv</b>: il gestore del progetto. Installa la versione di Python giusta, crea l'ambiente isolato (<code>.venv</code>) e installa le librerie. Ogni comando parte con <code>uv run</code>.`,
        `<b>pyproject.toml</b>: la "carta d'identità" del progetto. Dichiara nome, versione minima di Python e le librerie che <b>chiedi</b> con un vincolo minimo (es. <code>fastapi&gt;=0.110</code> = "FastAPI dalla 0.110 in su"). Contiene anche le impostazioni di ruff, mypy e pytest.`,
        `<b>uv.lock</b>: il registro di cosa è stato <b>installato davvero</b>: la versione esatta di ogni libreria, anche di quelle che FastAPI si porta dietro, con la sua impronta. Così tutti hanno lo stesso ambiente.`,
        `<b>ruff</b>: controlla lo stile e gli errori comuni, e formatta il codice. Uno strumento al posto di tre (black, flake8, isort).`,
        `<b>mypy</b> (strict): legge il codice senza eseguirlo e controlla che i tipi tornino.`] },
      { name: `Configurazione`, items: [
        `<b>.env</b>: file con i valori segreti (chiavi API, password del DB). Resta sul tuo computer, <b>mai su Git</b>.`,
        `<b>.env.example</b>: stessa lista di nomi, con i valori solo dove non sono segreti. Va su Git, così chi clona sa cosa configurare.`,
        `<b>Settings</b>: classe Pydantic che legge le variabili e controlla i tipi all'avvio. Se manca qualcosa il progetto <b>non parte</b> e dice quale variabile manca.`,
        `Una chiave finita su Git per errore si <b>revoca</b> (si genera una nuova), non basta cancellarla.`] },
      { name: `Type hints`, items: [
        `Annotazioni che dichiarano i tipi: <code>nome: str</code>, <code>-&gt; int</code>.`,
        `<code>str | None</code>: "una stringa oppure niente". Così chi usa la funzione sa che il valore può mancare e deve gestire il caso.`,
        `<code>list[int]</code>, <code>dict[str, int]</code>: contenitore e cosa contiene. <code>Literal["a","b"]</code>: solo quei valori.`,
        `mypy li controlla <b>prima</b> di eseguire; Pydantic e FastAPI li <b>leggono</b> mentre il programma gira.`,
        `Se proprio devi zittire mypy su una riga scrivi <code>#&nbsp;type:&nbsp;ignore[codice-errore]</code>: così ignori solo quell'errore, non anche quelli futuri sulla stessa riga.`] },
      { name: `async / await`, items: [
        `L'AI passa quasi tutto il tempo ad <b>aspettare</b> (risposta del modello, database).`,
        `<code>await</code> cede il controllo durante l'attesa: l'<b>event loop</b> fa avanzare altre richieste.`,
        `<code>asyncio.gather</code>: più attese sovrapposte, come <code>Promise.all</code>.`,
        `Trappola: codice bloccante (<code>time.sleep</code>, <code>requests</code>) dentro <code>async def</code> rallenta tutto il server.`] },

  slides: [
    { t: `Perché Python per l'AI`,
      p: [`Quasi tutto il mondo AI nasce in Python: gli SDK ufficiali di OpenAI, Anthropic e Google, le librerie come LangChain, LlamaIndex e Instructor, il machine learning (PyTorch, scikit-learn), l'analisi dati (Pandas, NumPy). Quando esce una novità, esce prima per Python.`,
          `Il Python del 2026 non è più "lo script senza tipi": ha <b>type hints</b> ovunque, controllati da mypy in modalità strict; <b>async/await</b> maturo per gestire tante attese insieme; un interprete più veloce dalla 3.11 in poi. Il corso usa la <b>3.12</b>.`,
          `Le scelte del corso sono fisse: <b>uv</b> come unico gestore, <b>ruff</b> per lo stile, <b>mypy strict</b> per i tipi, <b>FastAPI</b> per le API, <b>Pydantic v2</b> per validare i dati.`,
          `Il progetto è <b>LipariBank AI Assistant</b>: un backend che aiuta gli operatori di una banca. Chatta con un LLM, categorizza i movimenti, risponde usando i documenti interni.`,

      ex: `Pensa a Python come al TypeScript dell'AI: il linguaggio "di default" in cui escono prima tutte le librerie.`,
      k: [[`SDK`, `Software Development Kit: la libreria ufficiale per usare un servizio da codice (es. il pacchetto <code>openai</code>).`], [`LLM`, `Large Language Model: il modello che genera testo, come GPT o Claude.`], [`Interprete`, `Il programma che legge ed esegue il codice Python riga per riga.`]] },
    { t: `uv: un solo strumento per l'ambiente`,
      p: [`<b>uv</b> fa tre lavori che prima richiedevano tre strumenti: installa la versione di Python, crea l'<b>ambiente virtuale</b> e gestisce le librerie.`,
          `Comandi da sapere: <code>uv add fastapi</code> aggiunge una libreria (aggiorna pyproject.toml e uv.lock); <code>uv add --dev mypy</code> la aggiunge solo per lo sviluppo; <code>uv sync</code> installa esattamente quanto scritto nel lockfile; <code>uv run ...</code> esegue un comando con il Python e le librerie del progetto.`,
          `Regola: <b>ogni comando comincia con <code>uv run</code></b> (es. <code>uv run pytest</code>, <code>uv run uvicorn src.main:app --reload</code>). Non attivi niente a mano e non ti chiedi mai quale Python stai usando.`,
          `Errore classico: usare <code>pip install</code> in un progetto uv. La libreria funziona da te ma non entra nel lockfile, quindi il collega che clona riceve un <code>ImportError</code>.`,
          `uv è molto veloce, ma il motivo vero per usarlo è un altro: chiunque cloni il progetto ottiene <b>esattamente lo stesso ambiente</b> (stesse versioni di Python e delle librerie), quindi "da me funziona" vale anche per gli altri.`],
      ex: `uv ≈ npm + nvm insieme. <code>uv add</code> ≈ <code>npm install pacchetto</code>, <code>uv sync</code> ≈ <code>npm ci</code>, <code>uv run</code> ≈ <code>npx</code>.`,
      k: [[`Ambiente virtuale`, `Una cartella (<code>.venv</code>) con le librerie solo di questo progetto, separate dal resto del computer. Come <code>node_modules</code>.`], [`Dipendenza`, `Una libreria esterna di cui il tuo progetto ha bisogno.`], [`Dipendenza di sviluppo`, `Serve a te mentre lavori (test, controlli), non al servizio quando gira in produzione.`]] },
    { t: `pyproject.toml e uv.lock`,
      p: [`<b>pyproject.toml</b> è il file che descrive il progetto e configura gli strumenti, in quattro sezioni:<br>① <code>[project]</code>: nome, Python richiesto (<code>&gt;=3.12</code>), librerie con il <b>vincolo</b> minimo (<code>"fastapi&gt;=0.110"</code>, <code>"uvicorn[standard]&gt;=0.27"</code>, <code>"pydantic-settings&gt;=2.2"</code>).<br>② <code>[tool.ruff]</code>: lunghezza delle righe e quali regole di stile attivare.<br>③ <code>[tool.mypy]</code>: <code>strict = true</code> e il plugin di Pydantic.<br>④ <code>[tool.pytest.ini_options]</code>: dove stanno i test.`,
          `Prima servivano quattro file diversi (setup.py, .flake8, mypy.ini, pytest.ini). Ora è uno.`,
          `<b>uv.lock</b> registra la <b>soluzione</b>: dopo <code>uv add fastapi</code> trovi FastAPI 0.110.2, ma anche starlette, anyio e pydantic con la versione esatta e l'impronta (hash) di ogni pacchetto.`,
          `<b>Entrambi vanno su Git.</b> pyproject è l'intenzione, uv.lock la riproducibilità. Se il codice funziona da te e non da un collega, con il lockfile sapete che l'ambiente è identico e il problema è altrove.`,
          `Il lockfile si aggiorna con un comando esplicito (<code>uv lock --upgrade</code>): l'aggiornamento si vede nel diff e si può annullare.`],
      ex: `pyproject.toml ≈ package.json (con dentro anche la config di ESLint e tsconfig). uv.lock ≈ package-lock.json.`,
      k: [[`Vincolo di versione`, `Regola su quali versioni vanno bene, es. <code>&gt;=0.110</code> = dalla 0.110 in poi.`], [`Lockfile`, `File che "congela" le versioni esatte installate.`], [`Hash`, `Impronta digitale di un file: se il pacchetto cambia anche di un byte, l'impronta non torna.`]] },
    { t: `Configurazione: .env e Settings`,
      p: [`Chiavi API, password del database, segreti per firmare i token: <b>non stanno nel codice</b>. Stanno nelle <b>variabili d'ambiente</b>, che in sviluppo scrivi nel file <code>.env</code>.`,
          `<code>.env</code> resta sul tuo computer, <b>mai su Git</b>. Su Git va <code>.env.example</code>: tutti i nomi delle variabili, con i valori solo dove non sono segreti (es. <code>APP_NAME=LipariBank AI</code>).`,
          `La classe <code>Settings</code> in <code>src/config.py</code> eredita da <code>BaseSettings</code> (libreria pydantic-settings). Ogni campo è una variabile con il suo tipo: <code>openai_api_key: str</code>, <code>debug: bool = False</code>.`,
          `All'avvio Settings legge le variabili e le <b>valida</b>. Se ne manca una obbligatoria o ha un tipo sbagliato, il progetto <b>non parte</b> e dice quale. Con <code>os.getenv</code> lo stesso errore arriverebbe più tardi, nel mezzo di una richiesta, e più difficile da capire.`,
          `Se una chiave finisce su Git per sbaglio è <b>compromessa</b>: va revocata e rigenerata, perché resta nella storia dei commit.`],
      ex: `Come gli <code>environment.ts</code> di Angular, ma con validazione dei tipi: un errore all'avvio è meglio di un errore misterioso alla prima richiesta.`,
      k: [[`Variabile d'ambiente`, `Un valore (nome = valore) che il sistema operativo passa al programma quando parte.`], [`Fail fast`, `Fallire subito e in modo chiaro, invece che più tardi e in modo confuso.`], [`Segreto`, `Un valore che dà accesso a qualcosa (chiave, password) e non deve mai essere pubblico.`]] },
    { t: `Type hints: promesse sui tipi`,
      p: [`Un type hint dice che tipo ha una variabile o cosa restituisce una funzione: <code>def by_id(session_id: str) -&gt; ChatSession | None</code>.`,
          `<b>Python non li controlla mentre gira.</b> Li controlla <b>mypy</b>, leggendo il codice senza eseguirlo. Però a runtime esistono, e <b>Pydantic e FastAPI li leggono</b> per validare i dati e costruire le API.`,
          `Sintassi di tutti i giorni: <code>list[int]</code>, <code>dict[str, int]</code> (contenitore e contenuto); <code>str | None</code> (al posto del vecchio <code>Optional[str]</code>); <code>Literal["ENTRATA", "USCITA"]</code> (solo quei valori); <code>Callable[[int, str], bool]</code> (una funzione come valore).`,
          `<b>Explicit check</b>: se una funzione può non trovare un risultato, la firma lo dice. Chi la chiama controlla e <b>esce presto</b> con un'eccezione di dominio (es. <code>ChatSessionNotFoundError</code>), che al Giorno 2 diventa un <b>404</b> chiaro. Senza il controllo avresti un <code>AttributeError</code> su <code>None</code>, cioè un 500 muto.`,
          `Perché mypy in modalità <b>strict</b>: se una funzione non ha annotazioni, mypy le assegna il tipo <code>Any</code> ("qualsiasi cosa") e smette di controllare quella funzione e tutti i valori che ne escono. Quindi annotare solo metà del codice ti fa credere di essere protetto quando non lo sei. Strict obbliga ad annotare tutto.`],
      ex: `<code>str | None</code> è identico a <code>string | null</code> in TS. La differenza: in TS i tipi spariscono dopo la compilazione, in Python restano e le librerie li usano.`,
      k: [[`Runtime`, `Il momento in cui il programma sta girando (contrario di "prima", quando lo scrivi o lo controlli).`], [`None`, `Il "niente" di Python, come <code>null</code>.`], [`Any`, `Il tipo "qualsiasi cosa": disattiva il controllo, come <code>any</code> in TS.`], [`Eccezione di dominio`, `Un errore con un nome che ha senso nel tuo problema (conversazione inesistente), non tecnico.`]] },
    { t: `async/await: perché l'AI vive sull'I/O`,
      p: [`<b>I/O</b> (input/output) significa parlare con qualcosa fuori dal programma: rete, database, disco. Una chiamata a un LLM è I/O: il tuo codice passa secondi ad <b>aspettare</b>.`,
          `Con <code>async def</code> e <code>await</code> c'è <b>un solo thread</b> con sopra un <b>event loop</b>. Quando una richiesta fa <code>await</code>, cede il controllo e il loop fa avanzare le altre. Quindi non si fanno più calcoli contemporaneamente: si <b>aspetta</b> per più richieste nello stesso momento. È perfetto quando il programma passa il tempo ad aspettare (come qui), inutile quando deve fare calcoli pesanti.`,
          `<code>await asyncio.sleep(1)</code> lascia libero il loop; <code>time.sleep(1)</code> lo <b>blocca</b> per tutti. Stesso discorso per la libreria <code>requests</code> o per un driver di database non async.`,
          `Questa trappola non dà errore e in sviluppo non si vede: sotto carico rallenta <b>tutti</b> gli endpoint, e per questo viene diagnosticata male.`,
          `Due <code>await</code> uno dopo l'altro sono <b>sequenziali</b>. Per sovrapporli usi <code>asyncio.gather(a(), b())</code>, che restituisce i risultati nell'ordine in cui li hai passati.`,
          `<code>asyncio.to_thread(f)</code> esegue in un thread separato una funzione sincrona che non puoi cambiare, così non blocca il loop. Ogni chiamata però occupa un thread, che è una risorsa limitata: se esiste una versione async della libreria (es. <code>httpx</code> al posto di <code>requests</code>), usa quella.`,
          `Chiamare una funzione async <b>senza await</b> non la esegue: ottieni solo una coroutine e un avviso.`],
      ex: `È lo stesso event loop di JavaScript. <code>gather</code> ≈ <code>Promise.all</code>. Una coroutine ≈ una Promise che parte solo quando fai await.`,
      k: [[`I/O`, `Ogni operazione in cui il programma aspetta qualcosa da fuori (rete, DB, file).`], [`Thread`, `Una "linea di esecuzione" del programma. Più thread possono lavorare insieme.`], [`Event loop`, `Il ciclo che decide quale attività far avanzare mentre le altre aspettano.`], [`Coroutine`, `Il risultato di una funzione <code>async def</code>: un lavoro pronto a partire con <code>await</code>.`]] },
    { t: `Ripasso Python 1: valori e funzioni`,
      p: [`<b>Strutture base</b>: lista <code>[1, 2]</code> (modificabile), dizionario <code>{"k": v}</code>, tupla <code>(a, b)</code> (non modificabile, si "spacchetta": <code>x, y = t</code>), set <code>{1, 2}</code> (valori unici).`,
          `<b>Comprehension</b>: costruire una lista in una riga, con filtro. <code>[abs(x) for x in importi if x &lt; 0]</code>. Esiste anche per i dizionari <code>{m.id: m for m in movimenti}</code> e i set.`,
          `<b><code>d["k"]</code> vs <code>d.get("k")</code></b>: il primo solleva <code>KeyError</code> se la chiave manca, il secondo restituisce <code>None</code> (o un default: <code>d.get("k", 0)</code>).`,
          `<b>L'indentazione è sintassi</b>: i 4 spazi definiscono i blocchi, non ci sono graffe.`,
          `<b>Default mutabile</b>: <code>def f(x=[])</code> crea la lista <b>una volta sola</b>, quando la funzione viene definita, e la condivide fra tutte le chiamate. Usa <code>None</code> come default e crea la lista dentro.`],
      ex: `Comprehension ≈ <code>importi.filter(x =&gt; x &lt; 0).map(x =&gt; Math.abs(x))</code>, scritto in una riga.`,
      k: [[`Mutabile`, `Un oggetto che si può modificare dopo averlo creato (liste, dizionari).`], [`KeyError`, `L'errore di Python quando chiedi una chiave che il dizionario non ha.`]] },
    { t: `Ripasso Python 2: classi, with, yield, errori`,
      p: [`<b>Classi</b>: ogni metodo riceve <code>self</code> come primo parametro (è il <code>this</code>). Se lo dimentichi, l'errore lo dice chiaramente. In una sottoclasse si chiama <code>super().__init__()</code>.`,
          `<b>Decoratore</b>: una funzione che prende un'altra funzione e la avvolge, aggiungendo comportamento. <code>@app.get("/")</code> è un decoratore.`,
          `<b><code>with</code></b>: apre una risorsa e la <b>chiude sempre</b>, anche se nel mezzo c'è un errore. Esempio: <code>with open(f) as file:</code>.`,
          `<b><code>yield</code></b>: una funzione con yield è un <b>generatore</b>: produce valori uno alla volta e si consuma una sola volta. Al Giorno 3 la sessione del DB è proprio una dipendenza con yield: apre, presta, chiude.`,
          `<b>Eccezioni</b>: mai <code>except:</code> nudo, nasconde anche i bug. Cattura l'errore preciso, oppure lascialo salire. Le tue eccezioni portano i dati dentro (es. l'id che non esiste).`,
          `<b>Traceback</b>: si legge dal basso. L'ultima riga dice <b>cosa</b> è successo, le righe sopra <b>da dove</b> si è arrivati.`],
      ex: `<code>with</code> ≈ <code>try/finally</code> automatico. I decoratori Python sono funzioni vere, più semplici di quelli di Angular. Un generatore assomiglia a un iterator JS con <code>function*</code>.`,
      k: [[`Traceback`, `L'elenco delle chiamate che hanno portato all'errore.`], [`Generatore`, `Funzione con <code>yield</code>: restituisce i valori uno per volta.`], [`Context manager`, `Un oggetto usabile con <code>with</code>: sa cosa fare all'ingresso e all'uscita.`]] }
  ],
  flash: [
