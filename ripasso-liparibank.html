          `In una banca, se la Compliance chiede perché il sistema ha aperto una segnalazione, "gliel'ha suggerito il modello" non basta. Devi poter dire: al passo 2 ha cercato la regola, al passo 3 ha visto due bonifici esteri nel mese. Un sistema che non si può ricostruire non si può usare.`,
          `Per ogni tool eseguito si scrive una riga di log con: quale tool, la forma degli argomenti, il tipo di risultato (<code>ok</code>, <code>vuoto</code>, <code>errore</code>) e quanto tempo ci ha messo.`,
          `Tutte le righe di un'esecuzione hanno lo stesso <code>run_id</code>, un UUID creato all'inizio di <code>run_agent</code>. Senza, con dieci utenti contemporanei, le righe si mescolano e non ricostruisci niente. È lo stesso ragionamento del request-id del Giorno 2. Il <code>run_id</code> torna anche al client: chi segnala una risposta strana ti dà quel codice e tu trovi l'esecuzione.`,
          `Nel log non si scrivono dati: al posto degli argomenti c'è un'<b>impronta</b> (i primi 8 caratteri dello SHA-256 del valore), così vedi se il modello ripete lo stesso IBAN senza sapere quale fosse. Al posto del risultato c'è il suo tipo. Per il tool che scrive resta solo una <b>ricevuta</b> con il numero di pratica.`],
      more: [1, 4],
      ex: `Il <code>run_id</code> è come un correlation id che passi tra i servizi per seguire una richiesta attraverso più chiamate.`,
      k: [[`run_id`, `Identificativo unico di un'esecuzione dell'agente, che collega tutte le sue righe di log.`], [`Impronta`, `Un riassunto breve (hash) di un valore: uguale per valori uguali, ma da cui non si risale al valore.`]] },
    { t: `Cinque modi di sbagliare senza errori`,
      s: `Un agente può sbagliare in cinque modi tipici senza sollevare nessuna eccezione. Conoscerli per nome aiuta a riconoscerli nei log.`,
      p: [`Come per il RAG, anche qui il pericolo è che il sistema <b>risponde</b> invece di andare in errore. Con l'agente è più grave: fa più scelte, e può lasciare una riga nel database.`,
          `<b>1. Il ciclo di cortesia.</b> Un tool risponde "nessun risultato" e il modello, per essere utile, riprova con parole diverse, quattro volte. Rimedio: nel system prompt si dice esplicitamente che, se un dato non c'è, va riferito e basta.`,
          `<b>2. Il tool mai chiamato.</b> Il tool funziona, ma il modello non lo usa mai. Quasi sempre la colpa è della descrizione. Rimedio: scrivere quando usarlo e l'alternativa per i casi vicini.`,
          `<b>3. Argomenti inventati.</b> Il modello genera un IBAN plausibile invece di copiare quello giusto, o scrive "dieci" invece di 10. Rimedio: validazione con Pydantic e controllo sul portafoglio, che lo rifiuta.`,
          `<b>4. Il contesto che esplode.</b> Ogni giro porta con sé tutti i precedenti: se un tool restituisce testi lunghi, dopo pochi passi la conversazione diventa enorme e lenta. Rimedio: tagliare il risultato alla fonte (300 caratteri per passaggio, top-k 3).`,
          `<b>5. L'azione ripetuta.</b> Il modello chiama di nuovo il tool che scrive. Rimedio: l'idempotenza della slide precedente.`],
      k: [] }
  ],
  flash: [
    [`Cosa distingue un agente dal tool use semplice?`, `Il tool use è un giro deciso da te. L'agente ripete il giro in un ciclo: quanti passi fare e quali tool usare lo decide il modello durante l'esecuzione.`],
    [`Cosa vede il modello di un tool?`, `Solo nome, descrizione e schema dei parametri. Non vede il codice né la query.`],
    [`Quanti messaggi si aggiungono a ogni giro?`, `Due: il messaggio assistant con la richiesta del tool e il messaggio tool con il risultato.`],
    [`Le tre uscite dal ciclo?`, `Il modello risponde (unica vera risposta), passi finiti, budget superato. Le ultime due vanno dichiarate con stopped_by.`],
    [`Un tool va in errore: cosa fai?`, `Rimandi l'errore al modello come testo: quasi sempre si corregge. Si solleva un'eccezione solo se fallisce la chiamata al modello.`],
    [`Come si impedisce al modello di leggere dati di altri clienti?`, `I tool contengono l'utente nella closure e filtrano nella query sul portafoglio dell'operatore. Il prompt non è un controllo d'accesso.`],
    [`Perché serve il run_id?`, `Collega tutte le righe di log di un'esecuzione, così puoi ricostruire i passi dell'agente anche con tanti utenti contemporanei.`]
  ],
  quiz: [
    { q: `L'agente arriva a max_steps senza aver finito. Cosa deve restituire?`,
      o: [`L'ultima frase del modello`, `Un messaggio esplicito di non completamento, con stopped_by="max_steps"`, `Un errore 500`, `Rifare il ciclo da capo`], c: 1,
      w: `L'ultima frase del modello è a metà ragionamento: presentarla come risposta darebbe all'operatore una conclusione mai raggiunta.`,
      term: `Si parla di <b>terminazione per esaurimento passi</b>: va trattata come <b>non-completamento esplicito</b>, non come <b>risposta finale</b>.` },
    { q: `Aggiungi alla conversazione solo il messaggio tool con il risultato, senza il messaggio assistant. Cosa succede?`,
      o: [`Funziona lo stesso`, `L'API rifiuta la richiesta con un errore su tool_call_id`, `Il modello ignora il risultato`, `Il risultato viene duplicato`], c: 1,
      w: `Il modello riceverebbe il risultato di una chiamata che, nella storia, non ha mai fatto: l'API lo rifiuta.`,
      term: `Ogni <b>tool message</b> deve riferirsi a un <b>tool call</b> presente nel messaggio <b>assistant</b> precedente, tramite il <code>tool_call_id</code>.` },
    { q: `Un tool riceve un argomento non valido dal modello. Cosa fa il ciclo?`,
      o: [`Solleva un'eccezione e ferma tutto`, `Rimanda al modello un messaggio con l'errore, così può correggersi`, `Ignora la chiamata in silenzio`, `Chiude il run con stopped_by="budget"`], c: 1,
      w: `L'errore di un tool è un'informazione utile al modello: al giro successivo di solito manda gli argomenti giusti.`,
      term: `L'errore diventa un'<b>osservazione</b> (observation) nel ciclo <b>ragiona-agisci-osserva</b>, invece di un'<b>eccezione</b> propagata.` },
    { q: `Per impedire che un operatore veda conti di clienti non suoi, qual è la soluzione corretta?`,
      o: [`Scriverlo nel system prompt`, `Passare l'id dell'operatore come argomento del tool`, `Creare i tool per l'operatore autenticato (closure) e filtrare nella query sul suo portafoglio`, `Controllare la risposta finale del modello`], c: 2,
      w: `Il prompt si può aggirare e un argomento lo sceglie il modello. L'identità deve stare dove il modello non può cambiarla: nella closure, e il filtro nella query.`,
      term: `<b>Autorizzazione per costruzione</b>: l'identità è <b>catturata nella closure</b> e il controllo è applicato a <b>livello di query</b>.` },
    { q: `Il modello chiama due volte di seguito il tool che apre una segnalazione per lo stesso conto. Cosa deve succedere?`,
      o: [`Due segnalazioni`, `Una sola segnalazione, grazie alla chiave di idempotenza`, `Errore 500`, `La seconda cancella la prima`], c: 1,
      w: `Un'azione ripetuta non deve produrre effetti doppi: la chiave (conto, operatore, giorno) con vincolo di unicità garantisce una sola riga.`,
      term: `<b>Idempotenza</b> tramite una <b>idempotency key</b> con <b>vincolo di unicità</b> nel database.` }
  ]
});

/* Slide riscritte in tono colloquiale. Sostituiscono quelle in data1/data2. s = "In breve" */
const SLIDES = {};

SLIDES.g1 = [
  { t: `Perché Python per l'AI`,
    s: `Python è il linguaggio in cui nasce quasi tutto il mondo AI, ed è il motivo per cui lo stai imparando.`,
    p: [`Pensa a quando esce una nuova libreria AI: quasi sempre la prima versione è per Python. Gli SDK ufficiali di OpenAI, Anthropic e Google, librerie come LangChain e Instructor, il machine learning (PyTorch, scikit-learn), l'analisi dei dati (Pandas, NumPy): tutto parte da lì.`,
        `Se ti ricordi Python come "il linguaggio degli script senza tipi", oggi è cambiato parecchio. Ha i <b>type hints</b> (i tipi, un po' come in TypeScript), un buon supporto per <b>async/await</b> e un interprete più veloce dalla versione 3.11. Nel corso usiamo la <b>3.12</b>.`,
        `Gli strumenti del corso sono già scelti, così non devi pensarci: <b>uv</b> per gestire il progetto, <b>ruff</b> per lo stile, <b>mypy</b> per controllare i tipi, <b>FastAPI</b> per scrivere le API, <b>Pydantic</b> per validare i dati. Li vediamo uno per volta.`,
        `Il progetto su cui lavori si chiama <b>LipariBank AI Assistant</b>: un backend che aiuta gli operatori di una banca. Chatta con un LLM, mette in categorie i movimenti del conto e risponde usando i documenti interni.`,
        `Python non è perfetto per tutto. Quando un servizio deve reggere un numero enorme di richieste al secondo si preferiscono Go, Rust o Java; dove conta ogni millisecondo (trading, videogiochi) si usano C++ o Rust; nel browser c'è JavaScript/TypeScript e sulle app mobile Swift, Kotlin o Flutter. Ma in un backend AI il tempo si perde quasi tutto ad aspettare la risposta del modello, non a far girare Python: per questo qui va benissimo.`],
    ex: `Pensa a Python come al TypeScript dell'AI: il linguaggio "di default" in cui escono prima tutte le librerie.`,
    k: [[`SDK`, `Software Development Kit: la libreria ufficiale per usare un servizio da codice (es. il pacchetto <code>openai</code>).`], [`LLM`, `Large Language Model: il modello che genera testo, come GPT o Claude.`], [`Interprete`, `Il programma che legge ed esegue il codice Python riga per riga.`]] },
  { t: `uv: un solo strumento per l'ambiente`,
    s: `uv installa Python, prepara l'ambiente del progetto e gestisce le librerie. Tu lanci tutto con <code>uv run</code> e non ci pensi più.`,
    p: [`In Python, storicamente, servivano tre strumenti diversi: uno per installare la versione giusta di Python, uno per creare l'<b>ambiente virtuale</b> (la cartella con le librerie del progetto), uno per installare le librerie. <b>uv</b> fa tutte e tre le cose.`,
        `I comandi che userai più spesso:<br>• <code>uv add fastapi</code> aggiunge una libreria al progetto;<br>• <code>uv add --dev mypy</code> aggiunge una libreria che serve solo a te mentre sviluppi;<br>• <code>uv sync</code> installa esattamente le versioni scritte nel lockfile (lo vediamo nella prossima slide);<br>• <code>uv run ...</code> esegue un comando usando il Python e le librerie del progetto.`,
        `L'abitudine da prendere: fai partire ogni comando con <code>uv run</code>, per esempio <code>uv run pytest</code> o <code>uv run uvicorn src.main:app --reload</code>. Così sei sicuro di usare il Python giusto, senza attivare niente a mano.`,
        `Una cosa a cui fare attenzione: se in un progetto uv installi una libreria con <code>pip install</code>, sul tuo computer funziona, ma uv non la registra. Il collega che scarica il progetto non la trova e riceve un <code>ImportError</code>. Quindi le librerie si aggiungono sempre con <code>uv add</code>.`,
        `uv è anche molto veloce, ma il vantaggio che conta davvero è un altro: chiunque scarichi il progetto ottiene esattamente lo stesso ambiente che hai tu.`],
    ex: `uv ≈ npm + nvm insieme. <code>uv add</code> ≈ <code>npm install pacchetto</code>, <code>uv sync</code> ≈ <code>npm ci</code>, <code>uv run</code> ≈ <code>npx</code>.`,
    k: [[`Ambiente virtuale`, `Una cartella (<code>.venv</code>) con le librerie solo di questo progetto, separate dal resto del computer. Come <code>node_modules</code>.`], [`Dipendenza`, `Una libreria esterna di cui il tuo progetto ha bisogno.`], [`Dipendenza di sviluppo`, `Serve a te mentre lavori (test, controlli), non al servizio quando gira in produzione.`]] },
  { t: `pyproject.toml e uv.lock`,
    s: `pyproject.toml dice cosa vuoi, uv.lock registra cosa è stato installato davvero. Vanno su Git tutti e due.`,
    p: [`<b>pyproject.toml</b> è il file che descrive il progetto. Dentro trovi quattro sezioni:<br>① <code>[project]</code>: il nome, la versione di Python richiesta (<code>&gt;=3.12</code>) e le librerie, ognuna con la versione minima che va bene (<code>"fastapi&gt;=0.110"</code> vuol dire "FastAPI dalla 0.110 in su").<br>② <code>[tool.ruff]</code>: le regole di stile, per esempio la lunghezza massima delle righe.<br>③ <code>[tool.mypy]</code>: le impostazioni del controllo dei tipi, con <code>strict = true</code>.<br>④ <code>[tool.pytest.ini_options]</code>: dove si trovano i test.`,
        `Prima servivano quattro file diversi per queste cose (setup.py, .flake8, mypy.ini, pytest.ini). Ora è tutto in uno.`,
        `<b>uv.lock</b> è diverso: non dice cosa vuoi, ma cosa uv ha effettivamente installato. Per esempio, dopo <code>uv add fastapi</code> ci trovi FastAPI 0.110.2, ma anche starlette, anyio e pydantic (le librerie che FastAPI si porta dietro), ognuna con la versione esatta e la sua impronta (hash).`,
        `Vanno su Git <b>tutti e due</b>. Così, se il codice funziona da te e non da un collega, sapete già che l'ambiente è identico e il problema è da un'altra parte.`,
        `Quando vuoi aggiornare le librerie lanci <code>uv lock --upgrade</code>. Le modifiche al lockfile si vedono nel diff e, se qualcosa non va, puoi tornare indietro.`],
    ex: `pyproject.toml ≈ package.json (con dentro anche la configurazione di ESLint e tsconfig). uv.lock ≈ package-lock.json.`,
    k: [[`Vincolo di versione`, `Regola su quali versioni vanno bene, es. <code>&gt;=0.110</code> = dalla 0.110 in poi.`], [`Lockfile`, `File che "congela" le versioni esatte installate.`], [`Hash`, `Impronta digitale di un file: se il pacchetto cambia anche di un byte, l'impronta non torna.`]] },
  { t: `Configurazione: .env e Settings`,
    s: `I segreti (chiavi, password) stanno nel file .env, che non va su Git. Una classe Settings li legge e controlla all'avvio.`,
    p: [`L'app ha bisogno di valori segreti: la chiave per chiamare OpenAI, la password del database, il segreto per firmare i token. Questi valori non si scrivono nel codice. Si mettono nelle <b>variabili d'ambiente</b>, che durante lo sviluppo scrivi nel file <code>.env</code>.`,
        `Il file <code>.env</code> resta solo sul tuo computer e non va mai su Git. Su Git metti invece <code>.env.example</code>: la stessa lista di nomi, con i valori solo dove non sono segreti (es. <code>APP_NAME=LipariBank AI</code>). Così chi scarica il progetto sa quali variabili deve impostare.`,
        `Per leggerle c'è la classe <code>Settings</code> in <code>src/config.py</code>, che eredita da <code>BaseSettings</code> (dalla libreria pydantic-settings). Ogni variabile è un campo con il suo tipo: <code>openai_api_key: str</code>, <code>debug: bool = False</code>.`,
        `Il bello è che Settings controlla tutto all'avvio. Se manca una variabile obbligatoria, o ha un tipo sbagliato, l'app non parte e ti dice quale variabile è il problema. Se invece leggessi le variabili a mano con <code>os.getenv</code>, lo stesso errore salterebbe fuori più tardi, magari a metà di una richiesta, e sarebbe molto più difficile capire da dove viene.`,
        `Se per sbaglio una chiave finisce su Git, cancellarla non basta, perché resta nella storia dei commit. Bisogna andare dal fornitore, disattivarla e generarne una nuova.`],
    ex: `Somiglia agli <code>environment.ts</code> di Angular, con in più il controllo dei tipi all'avvio.`,
    k: [[`Variabile d'ambiente`, `Un valore (nome = valore) che il sistema operativo passa al programma quando parte.`], [`Fail fast`, `Fallire subito e in modo chiaro, invece che più tardi e in modo confuso.`], [`Segreto`, `Un valore che dà accesso a qualcosa (chiave, password) e non deve mai essere pubblico.`]] },
  { t: `Type hints: dire che tipo ha un valore`,
    s: `I type hints sono le annotazioni dei tipi. Python non li controlla mentre gira: lo fa mypy prima, e Pydantic e FastAPI li usano per validare i dati.`,
    p: [`Un type hint dice che tipo ha una variabile o cosa restituisce una funzione. Per esempio: <code>def by_id(session_id: str) -&gt; ChatSession | None</code> vuol dire "riceve una stringa e restituisce una ChatSession, oppure niente".`,
        `Una cosa che sorprende chi arriva da TypeScript: <b>Python non controlla i tipi mentre il programma gira</b>. Se passi un numero dove avevi scritto <code>str</code>, Python va avanti lo stesso. A controllare ci pensa <b>mypy</b>, che legge il codice senza eseguirlo. I type hints però restano disponibili mentre il programma gira, e <b>Pydantic e FastAPI li leggono</b> per controllare i dati che arrivano dall'esterno.`,
        `Le forme che userai ogni giorno:<br>• <code>list[int]</code>, <code>dict[str, int]</code>: un contenitore e cosa contiene;<br>• <code>str | None</code>: una stringa oppure niente (prima si scriveva <code>Optional[str]</code>);<br>• <code>Literal["ENTRATA", "USCITA"]</code>: solo uno di questi valori;<br>• <code>Callable[[int, str], bool]</code>: una funzione passata come valore.`,
        `Il caso più utile è <code>| None</code>. Se una funzione può non trovare un risultato, lo scrivi nel tipo. Chi la chiama è costretto da mypy a controllare: se il risultato è <code>None</code>, solleva subito un errore con un nome chiaro (es. <code>ChatSessionNotFoundError</code>), che al Giorno 2 diventerà una risposta 404. Senza questo controllo, il programma andrebbe avanti e si romperebbe più in là con un errore confuso (<code>AttributeError</code>) e una risposta 500.`,
        `Il corso usa mypy in modalità <b>strict</b>, cioè severa. Il motivo: se una funzione non ha annotazioni, mypy le dà il tipo <code>Any</code> ("qualsiasi cosa") e smette di controllarla. Annotare solo metà del codice ti farebbe credere di essere protetto quando non lo sei.`],
    ex: `<code>str | None</code> è identico a <code>string | null</code> in TypeScript. La differenza: in TS i tipi spariscono dopo la compilazione, in Python restano e alcune librerie li usano.`,
    k: [[`Runtime`, `Il momento in cui il programma sta girando (contrario di "prima", quando lo scrivi o lo controlli).`], [`None`, `Il "niente" di Python, come <code>null</code>.`], [`Any`, `Il tipo "qualsiasi cosa": disattiva il controllo, come <code>any</code> in TS.`], [`Eccezione di dominio`, `Un errore con un nome che ha senso nel tuo problema (conversazione inesistente), non tecnico.`]] },
  { t: `async/await: aspettare senza bloccare`,
    s: `Un backend AI passa quasi tutto il tempo ad aspettare il modello e il database. Con async/await, mentre una richiesta aspetta, il server ne serve altre.`,
    p: [`Partiamo da un esempio. Un operatore fa una domanda, il tuo codice chiama l'LLM e aspetta 3 secondi la risposta. Se in quei 3 secondi il server restasse fermo, gli altri operatori dovrebbero aspettare in fila. Questo "aspettare qualcosa da fuori" (rete, database, disco) si chiama <b>I/O</b>.`,
        `Con <code>async def</code> e <code>await</code> la cosa si risolve così: c'è un solo thread con un <b>event loop</b>. Quando una richiesta arriva a un <code>await</code>, dice al loop "io aspetto, intanto vai avanti con gli altri". Il loop passa ad altre richieste e torna da lei quando la risposta è arrivata.`,
        `Attenzione: questo non fa più calcoli nello stesso momento. Fa <b>aspettare più richieste nello stesso momento</b>. È perfetto per un backend AI, che passa il tempo ad aspettare; non aiuta se il codice deve fare calcoli pesanti.`,
        `Il tranello più comune: usare dentro una funzione <code>async def</code> qualcosa che blocca, come <code>time.sleep(1)</code> o la libreria <code>requests</code>. Blocca l'unico thread, quindi si fermano tutte le richieste. Non dà errore e in sviluppo non te ne accorgi; sotto carico invece tutto rallenta. La versione corretta è <code>await asyncio.sleep(1)</code>, e al posto di requests si usa <code>httpx</code>.`,
        `Altre cose utili:<br>• due <code>await</code> uno dopo l'altro vanno in sequenza; per farli andare insieme usi <code>asyncio.gather(a(), b())</code>;<br>• se devi usare per forza una funzione che blocca, <code>asyncio.to_thread(f)</code> la esegue in un thread a parte, così il loop resta libero;<br>• se chiami una funzione async <b>senza</b> <code>await</code>, non parte: ottieni solo un oggetto "coroutine" e un avviso.`],
    ex: `È lo stesso event loop di JavaScript. <code>asyncio.gather</code> ≈ <code>Promise.all</code>. Una coroutine ≈ una Promise che parte solo quando fai await.`,
    k: [[`I/O`, `Ogni operazione in cui il programma aspetta qualcosa da fuori (rete, DB, file).`], [`Thread`, `Una "linea di esecuzione" del programma. Più thread possono lavorare insieme.`], [`Event loop`, `Il ciclo che decide quale attività far avanzare mentre le altre aspettano.`], [`Coroutine`, `Il risultato di una funzione <code>async def</code>: un lavoro pronto a partire con <code>await</code>.`]] },
  { t: `Ripasso Python 1: valori e funzioni`,
    s: `Le strutture base di Python, il modo veloce per costruire liste e due tranelli da conoscere.`,
    p: [`Le strutture base: la <b>lista</b> <code>[1, 2]</code> (modificabile), il <b>dizionario</b> <code>{"k": v}</code> (coppie chiave/valore), la <b>tupla</b> <code>(a, b)</code> (non modificabile, e puoi "spacchettarla": <code>x, y = t</code>) e il <b>set</b> <code>{1, 2}</code> (valori senza ripetizioni).`,
        `La <b>comprehension</b> serve a costruire una lista in una riga, anche con un filtro: <code>[abs(x) for x in importi if x &lt; 0]</code> prende gli importi negativi e li rende positivi. Esiste anche per i dizionari (<code>{m.id: m for m in movimenti}</code>) e per i set.`,
        `Per leggere da un dizionario ci sono due modi. <code>d["k"]</code> dà errore (<code>KeyError</code>) se la chiave non c'è. <code>d.get("k")</code> invece restituisce <code>None</code>, oppure un valore di riserva se glielo passi: <code>d.get("k", 0)</code>.`,
        `In Python non ci sono le graffe: i blocchi di codice si riconoscono dall'<b>indentazione</b> (4 spazi). Se la sbagli, è un errore di sintassi.`,
        `Un tranello classico: <code>def aggiungi(x, lista=[])</code>. Sembra che ogni chiamata riceva una lista vuota nuova, invece la lista viene creata una volta sola, quando Python legge la funzione, e poi è sempre la stessa. Il modo giusto è mettere <code>None</code> come valore di default e creare la lista dentro la funzione.`],
    ex: `La comprehension di sopra equivale a <code>importi.filter(x =&gt; x &lt; 0).map(x =&gt; Math.abs(x))</code>, scritto in una riga.`,
    k: [[`Mutabile`, `Un oggetto che si può modificare dopo averlo creato (liste, dizionari).`], [`KeyError`, `L'errore di Python quando chiedi una chiave che il dizionario non ha.`]] },
  { t: `Ripasso Python 2: classi, with, yield, errori`,
    s: `Classi, decoratori, il blocco with, i generatori con yield e come leggere un errore.`,
    p: [`<b>Classi</b>: ogni metodo riceve <code>self</code> come primo parametro, ed è l'equivalente di <code>this</code>. Se ti dimentichi di scriverlo, Python te lo segnala con un errore chiaro. In una classe figlia, il costruttore della classe madre si chiama con <code>super().__init__()</code>.`,
        `<b>Decoratore</b>: una funzione che "avvolge" un'altra funzione per aggiungerle qualcosa. Lo riconosci dalla <code>@</code>: <code>@app.get("/")</code> è un decoratore che registra la funzione come endpoint.`,
        `<b><code>with</code></b>: apre una risorsa e la chiude da solo alla fine, anche se nel mezzo c'è un errore. Esempio: <code>with open(f) as file:</code>. Quando esci dal blocco, il file è chiuso.`,
        `<b><code>yield</code></b>: una funzione che usa yield si chiama <b>generatore</b> e restituisce i valori uno alla volta invece che tutti insieme. Si può scorrere una volta sola. Lo rivedrai al Giorno 3: la sessione del database viene data all'endpoint proprio con una funzione con yield, che la apre, la presta e poi la chiude.`,
        `<b>Errori</b>: evita <code>except:</code> senza specificare quale errore vuoi catturare, perché cattura tutto, compresi i bug veri, e li nasconde. Quando qualcosa si rompe, Python stampa il <b>traceback</b>: si legge dal basso. L'ultima riga ti dice cosa è successo, le righe sopra da dove ci sei arrivato.`],
    ex: `<code>with</code> ≈ un <code>try/finally</code> automatico. I decoratori Python sono funzioni normali, più semplici di quelli di Angular. Un generatore somiglia a una <code>function*</code> di JavaScript.`,
    k: [[`Traceback`, `L'elenco delle chiamate che hanno portato all'errore.`], [`Generatore`, `Funzione con <code>yield</code>: restituisce i valori uno per volta.`], [`Context manager`, `Un oggetto usabile con <code>with</code>: sa cosa fare all'ingresso e all'uscita.`]] }
];

SLIDES.g2 = [
  { t: `Cos'è un backend`,
    s: `Un backend riceve richieste HTTP e risponde, di solito in JSON. Finora le chiamavi da Angular, ora le scrivi tu.`,
    p: [`Un backend è un programma che sta in ascolto, riceve <b>richieste HTTP</b> e restituisce <b>risposte</b>, quasi sempre in <b>JSON</b>.`,
        `Ogni richiesta ha:<br>• un <b>metodo</b>: GET per leggere, POST per creare o inviare, PUT/PATCH per modificare, DELETE per cancellare;<br>• un <b>indirizzo</b> (path), es. <code>/api/chat</code>;<br>• delle <b>intestazioni</b> (header), es. quella con il token;<br>• a volte un <b>corpo</b> (body) con i dati in JSON.`,
        `Ogni coppia metodo + indirizzo che il server sa gestire si chiama <b>endpoint</b>, es. <code>POST /api/chat</code>.`,
        `Lo <b>status code</b> della risposta dice com'è andata: <b>200</b> tutto ok, <b>201</b> creato, <b>401</b> non so chi sei, <b>403</b> so chi sei ma non puoi, <b>404</b> non trovato, <b>422</b> i dati che mi hai mandato non vanno bene, <b>429</b> troppe richieste, <b>500</b> errore del server.`,
        `Per scrivere il backend usiamo <b>FastAPI</b>, un framework Python asincrono che si basa sui type hints. A farlo girare è <b>uvicorn</b>, il server: lo avvii con <code>uv run uvicorn src.main:app --reload</code>.`],
    ex: `Finora chiamavi le API con HttpClient da Angular. Ora sei dall'altra parte: sei tu a ricevere quelle chiamate e a decidere cosa rispondere.`,
    k: [[`HTTP`, `Il protocollo con cui client e server si parlano.`], [`REST`, `Stile di API in cui ogni risorsa ha un indirizzo e i metodi HTTP dicono cosa farne.`], [`JSON`, `Formato testo per dati strutturati, lo stesso degli oggetti JS.`], [`Header`, `Intestazione della richiesta: coppie nome/valore (es. Authorization).`]] },
  { t: `Pydantic: dati che si controllano da soli`,
    s: `Con Pydantic descrivi la forma dei dati con una classe, e i dati vengono controllati appena arrivano.`,
    p: [`Un modello Pydantic è una classe che descrive come devono essere fatti i dati, usando i type hints. Per esempio <code>class ChatRequest(BaseModel)</code> con i campi <code>session_id: str</code> e <code>message: str</code>. Quando crei l'oggetto, Pydantic controlla che i dati rispettino quella forma.`,
        `È il punto di ingresso dei dati: tutto ciò che arriva da fuori passa da qui. Se il modello accetta i dati, il resto del codice può fidarsi e non deve ricontrollarli.`,
        `Se usi un modello come parametro di un endpoint e arriva un dato sbagliato, non devi scrivere niente: FastAPI risponde da solo con <b>422</b> e l'elenco dei campi che non vanno.`,
        `Con <code>Field(...)</code> aggiungi regole e descrizioni. I tre puntini vogliono dire "campo obbligatorio". Esempi: <code>Field(gt=0)</code> (maggiore di zero), <code>Field(max_length=2000)</code>.`,
        `Pydantic ha anche tipi già pronti con il controllo incluso: <code>EmailStr</code> (deve essere un'email valida), <code>UUID4</code>, <code>PositiveFloat</code>, <code>Literal["a","b"]</code>. Invece di scrivere un <code>if</code> per controllare, scegli il tipo giusto. E questi vincoli compaiono da soli nella documentazione su /docs.`,
        `Ricapitolando: <b>mypy</b> controlla il codice che scrivi tu, <b>Pydantic</b> controlla i dati che arrivano da fuori.`],
    ex: `Immagina un'interface TS che viene anche controllata mentre il programma gira, un po' come fa Zod. Il 422 è l'equivalente di un form Angular non valido, ma lato server.`,
    k: [[`Validazione`, `Verificare che i dati abbiano tipo e valori ammessi.`], [`Serializzazione`, `Trasformare un oggetto in un formato da spedire (es. JSON).`], [`Confine (boundary)`, `Il punto in cui i dati entrano dall'esterno: lì si controllano una volta per tutte.`]] },
  { t: `Validator e sintassi di Pydantic v2`,
    s: `Quando i controlli automatici non bastano, scrivi tu un validator. E conviene usare sempre la sintassi della versione 2.`,
    p: [`A volte ti serve un controllo che i tipi da soli non fanno. Ci sono due strumenti:<br>• <code>@field_validator("campo")</code> controlla un singolo campo mentre il modello viene costruito. Può vedere anche i campi già controllati prima di lui (in <code>info.data</code>);<br>• <code>@model_validator(mode="after")</code> parte quando il modello è completo e vede tutti i campi. Serve per le regole tra più campi, es. "la data di fine deve essere dopo la data di inizio".`,
        `Un validator può anche sistemare il dato, per esempio togliere gli spazi o mettere tutto in maiuscolo. Se invece trova un problema, solleva <code>ValueError</code>, e il client riceve un 422 che indica il campo.`,
        `Una cosa da evitare: dentro un validator non fare query al database o chiamate di rete. Quella è logica dell'applicazione e va nel service, che vedremo al Giorno 3.`,
        `In Pydantic v2 alcuni nomi sono cambiati: si scrive <code>model_config</code> (non più <code>class Config</code>), <code>.model_dump()</code> (non più <code>.dict()</code>), <code>.model_validate()</code> (non più <code>parse_obj()</code>). I nomi vecchi in parte funzionano ancora, ma alcune opzioni sono state rinominate: se scrivi il nome vecchio, Pydantic non dà errore e semplicemente la ignora. Il modello sembra configurato e invece non lo è.`],
    ex: `<code>field_validator</code> somiglia a un Validator su un singolo FormControl; <code>model_validator</code> a un validator sull'intero FormGroup.`,
    k: [[`Normalizzare`, `Portare un dato a una forma standard (es. "  mario " → "mario").`], [`Deprecato`, `Ancora funzionante ma destinato a sparire: non va più usato.`]] },
  { t: `Endpoint, router e response_model`,
    s: `Un endpoint è una funzione con un decoratore; i router raggruppano gli endpoint per argomento; response_model decide cosa esce nella risposta.`,
    p: [`Un endpoint si scrive così: <code>@router.post("/chat", response_model=ChatResponse, status_code=201)</code> sopra una funzione. Nel decoratore metti quello che vede chi usa l'API (indirizzo, formato della risposta, status in caso di successo). Nel corpo della funzione c'è l'implementazione, che puoi cambiare senza che il client se ne accorga.`,
        `Gli endpoint di uno stesso argomento (chat, categorize…) stanno in un <code>APIRouter(prefix="/api/chat", tags=["chat"])</code>, un file per argomento. Nel decoratore il path si scrive <b>senza</b> il prefisso: <code>"/send"</code>, non <code>"/api/chat/send"</code>. Se lo scrivi intero, l'indirizzo finale diventa <code>/api/chat/api/chat/send</code> e il client riceve 404.`,
        `<code>response_model</code> descrive la forma della risposta. Fa tre cose: controlla quello che esce, toglie i campi che non sono dichiarati e lo documenta. Per esempio, se l'oggetto interno ha un campo <code>tokens_used</code> ma <code>ChatResponse</code> non lo prevede, quel campo non arriva al client. È anche una protezione contro l'invio per sbaglio di dati interni.`,
        `Il file <code>main.py</code> mette insieme i pezzi: crea l'app, registra i router e aggiunge i middleware. Lì dentro non va logica.`,
        `Dai tipi, FastAPI genera da solo la documentazione interattiva su <code>/docs</code> (Swagger UI) e <code>/redoc</code>.`],
    ex: `I router somigliano ai feature module di Angular: un file per area, poi tutto si registra in un punto solo.`,
    k: [[`OpenAPI`, `Lo standard che descrive un'API in un file; da qui nascono /docs e i client generati.`], [`Swagger UI`, `Pagina web che mostra gli endpoint e permette di provarli.`]] },
  { t: `Dependency Injection con Depends`,
    s: `Un endpoint dichiara cosa gli serve con Depends, e FastAPI glielo prepara. Nei test puoi sostituirlo con una versione finta.`,
    p: [`Un endpoint spesso ha bisogno di qualcosa: la sessione del database, l'utente che sta facendo la richiesta, le impostazioni. Invece di crearlo dentro la funzione, lo chiede con <code>Depends(funzione)</code>. FastAPI chiama quella funzione e gli passa il risultato.`,
        `Le dipendenze si possono combinare: quella che restituisce l'utente corrente chiede a sua volta il token, che a sua volta chiede le Settings.`,
        `Quelle usate da più endpoint stanno in <code>src/api/deps.py</code>. Il vantaggio di chiederle invece di crearle: nei test le sostituisci con versioni finte usando <code>app.dependency_overrides</code>, senza toccare il codice dell'endpoint.`,
        `Se una dipendenza solleva un errore, la richiesta si ferma lì e l'endpoint non viene neanche eseguito. Per questo è il posto giusto per i controlli d'accesso.`,
        `Un caso pratico: se dichiari un'intestazione obbligatoria con <code>Header()</code> e il client non la manda, FastAPI risponde 422. Ma se manca il token di accesso, la risposta corretta è 401. Quindi l'intestazione del token la dichiari facoltativa e controlli tu se c'è.`],
    ex: `È come <code>inject()</code> in Angular, ma per singola funzione invece che per classe. <code>dependency_overrides</code> somiglia ai provider finti che usi in <code>TestBed</code>.`,
    k: [[`Dependency Injection`, `Chi usa un oggetto non lo crea: lo riceve già pronto da fuori. Rende il codice testabile.`]] },
  { t: `Errori gestiti in un punto solo`,
    s: `Il codice solleva errori con un nome chiaro, e tre gestori in main.py li trasformano in risposte JSON tutte con la stessa forma.`,
    p: [`Quando nel codice qualcosa non va, si solleva un'<b>eccezione</b> con un nome che spiega il problema, definita in <code>src/exceptions.py</code>: per esempio <code>ChatSessionNotFoundError</code> ("questa conversazione non esiste") o <code>RateLimitError</code> ("troppe richieste").`,
        `Ogni eccezione porta tre informazioni: <code>status_code</code> (lo status HTTP da rispondere), <code>code</code> (un codice fisso che il frontend può controllare, es. "SESSION_NOT_FOUND") e <code>message</code> (un testo leggibile da una persona).`,
        `In <code>main.py</code> ci sono tre <b>gestori</b> (exception handler), che trasformano gli errori in risposte:<br>1. uno per gli errori dell'app (<code>AppError</code>), che usa i tre campi sopra;<br>2. uno per gli errori di FastAPI (per esempio la validazione), così anche loro hanno la stessa forma;<br>3. uno per qualsiasi altro errore imprevisto: risponde 500 e scrive l'errore nel log insieme all'indirizzo della richiesta, così poi lo ritrovi.`,
        `Il risultato: l'operatore vede "questa conversazione non esiste" invece di un generico "errore interno", e il frontend riceve sempre lo stesso formato di errore.`],
    ex: `Somiglia a un ErrorHandler o a un HttpInterceptor di Angular che gestisce gli errori, ma lato server.`,
    k: [[`Exception handler`, `Funzione che intercetta un tipo di errore e lo trasforma in una risposta HTTP.`], [`Log`, `Registro di cosa succede nel server, per capire i problemi dopo.`]] },
  { t: `Middleware e async vs sync`,
    s: `Un middleware lavora su ogni richiesta, prima e dopo l'endpoint. E FastAPI tratta in modo diverso le funzioni async e quelle normali.`,
    p: [`Un <b>middleware</b> è un pezzo di codice che avvolge <b>ogni</b> richiesta: fa qualcosa all'andata, prima di <code>await call_next(request)</code>, e qualcosa al ritorno, dopo. Vede anche le richieste che non arrivano a nessun endpoint.`,
        `Un esempio del corso è il <b>request-id</b>: il middleware dà a ogni richiesta un codice unico e lo scrive nei log e nella risposta. Così, se qualcosa va storto, puoi seguire quella richiesta dall'inizio alla fine. È un middleware, e non una dipendenza, proprio perché deve valere per tutte le richieste.`,
        `Un altro esempio è <b>CORS</b>, con <code>CORSMiddleware</code>. Dice al <b>browser</b> quali siti possono chiamare la tua API. Le origini si confrontano carattere per carattere: <code>http://localhost:4200</code> e <code>http://127.0.0.1:4200</code> sono diverse. Evita <code>allow_origins=["*"]</code> ("tutti") insieme a <code>allow_credentials=True</code>: qualsiasi sito potrebbe chiamare l'API dal browser dell'utente usando i suoi cookie o token.`,
        `Su async e sync: se scrivi l'endpoint con <code>async def</code>, gira sull'event loop. Se lo scrivi con <code>def</code> normale, FastAPI lo esegue in un gruppo di 40 thread (il <b>thread pool</b>), così non blocca gli altri.`,
        `Il caso da evitare è <code>async def</code> con dentro codice che blocca, perché lì FastAPI non può aiutarti. Nel corso il codice nuovo si scrive sempre <code>async</code>; se proprio devi usare una libreria che esiste solo sincrona, meglio un <code>def</code> normale.`],
    ex: `Il middleware è il corrispondente lato server dell'HttpInterceptor di Angular.`,
    k: [[`CORS`, `Regola del browser: una pagina può chiamare un'API di un altro dominio solo se l'API lo permette.`], [`Thread pool`, `Un gruppo di thread pronti a eseguire funzioni sincrone.`], [`Origine`, `Protocollo + dominio + porta di una pagina, es. http://localhost:4200.`]] }
];

SLIDES.g3 = [
  { t: `Perché un database, e cos'è un ORM`,
    s: `Il database tiene i dati al sicuro e li ritrova in fretta. L'ORM ti fa lavorare con classi Python invece che con SQL scritto a mano.`,
    p: [`Perché non salvare le conversazioni in un file? Perché un database fa tre cose che un file non fa: regge tanti accessi nello stesso momento senza perdere dati, trova le informazioni in fretta grazie agli <b>indici</b> e protegge la coerenza dei dati. Per esempio, con una <b>chiave esterna</b> rifiuta un messaggio che appartiene a una chat che non esiste.`,
        `Il database del corso è <b>PostgreSQL</b>. Salva i dati in <b>tabelle</b>, fatte di righe e colonne, e si interroga con <b>SQL</b>. Una curiosità utile: l'SQL si scrive in un ordine ma il database lo esegue in un altro. Prima <code>FROM</code> (da quale tabella), poi <code>WHERE</code> (quali righe), poi <code>ORDER BY</code> (in che ordine), poi <code>LIMIT</code> (quante).`,
        `Un <b>ORM</b> ti permette di lavorare con <b>classi Python</b> invece di scrivere l'SQL a mano. La classe <code>ChatSession</code> corrisponde alla tabella <code>chat_sessions</code>, e ogni oggetto corrisponde a una riga.`,
        `L'ORM che usiamo è <b>SQLAlchemy 2.0</b>. Con il driver <b>asyncpg</b> funziona anche con async/await.`,
        `Anche se l'SQL lo genera l'ORM, conviene saperlo leggere. Per esempio, la "query N+1" (vedi le parole nuove qui sotto) la scopri solo guardando quali query sono state generate.`],
    ex: `SQLAlchemy è l'equivalente di TypeORM o Prisma nel mondo Node.`,
    k: [[`ORM`, `Object-Relational Mapper: traduce fra oggetti del linguaggio e righe del database.`], [`Driver`, `La libreria che parla fisicamente con il database (asyncpg per Postgres async).`], [`Chiave esterna`, `Colonna che punta alla chiave primaria di un'altra tabella; il DB rifiuta valori che non esistono.`], [`Query N+1`, `Una query per la lista più una per ogni elemento: lentissimo con tanti dati.`]] },
  { t: `Engine, pool e sessione`,
    s: `L'engine tiene pronte le connessioni al database. Ogni richiesta riceve la sua sessione, che si apre all'inizio e si chiude alla fine.`,
    p: [`L'<b>engine</b> si crea con <code>create_async_engine</code> ed è l'oggetto che gestisce le connessioni al database. L'indirizzo deve iniziare con <code>postgresql+asyncpg://</code>; se è sbagliato, l'app si ferma subito all'avvio, e almeno te ne accorgi.`,
        `Aprire una connessione al database richiede tempo. Per questo l'engine ne tiene alcune aperte e le riusa: è il <b>connection pool</b>. Due numeri lo regolano: <code>pool_size</code> (le connessioni sempre pronte) e <code>max_overflow</code> (quelle extra nei momenti di picco). Fai un conto: (pool_size + max_overflow) × numero di copie dell'app in esecuzione deve restare sotto il numero massimo di connessioni che Postgres accetta.`,
        `<code>pool_pre_ping=True</code> controlla che una connessione funzioni prima di usarla. Evita l'errore casuale che capita alla prima richiesta dopo un lungo periodo senza traffico.`,
        `La <b>sessione</b> (<code>AsyncSession</code>) è il tuo "dialogo" con il database durante una richiesta. Te la dà la dipendenza <code>get_db</code>, scritta con <code>yield</code>: la apre all'inizio della richiesta e la chiude alla fine. Ogni richiesta ha la sua; non se ne usa mai una condivisa da tutta l'app, perché tiene traccia di cosa hai letto e modificato.`,
        `Un'impostazione da ricordare: <code>expire_on_commit=False</code>. Senza, dopo il salvataggio (commit) gli oggetti andrebbero riletti dal database al primo accesso, e in async questo produce l'errore <code>MissingGreenlet</code>. Con questa impostazione restano leggibili.`],
    ex: `Il pool è come un parcheggio di connessioni pronte: invece di aprirne una nuova ogni volta, che è lento, ne prendi una libera.`,
    k: [[`Connessione`, `Un canale aperto fra l'app e il database. Aprirla costa tempo.`], [`Sessione`, `Unità di lavoro: tiene traccia degli oggetti letti e modificati fino al commit.`], [`Istanza`, `Una copia dell'app in esecuzione; in produzione spesso ce ne sono più di una.`]] },
  { t: `Modelli e query`,
    s: `Ogni tabella è una classe Python con i tipi dichiarati. Le query si costruiscono con select() invece di scrivere SQL a mano.`,
    p: [`I modelli stanno in <code>src/db/models.py</code>. Una colonna si scrive così: <code>id: Mapped[str] = mapped_column(primary_key=True)</code>.`,
        `<code>Mapped[str]</code> dice due cose insieme: a SQLAlchemy che tipo ha la colonna, e a mypy che tipo ha l'attributo. <code>mapped_column</code> raccoglie le opzioni della colonna: chiave primaria, indice, valore di default.`,
        `Alcune scelte che il corso fa nei modelli:<br>• id di tipo <b>UUID</b>, generati da Python;<br>• un <b>indice</b> sulle colonne che usi per cercare;<br>• tipo <code>Text</code> per le risposte del modello, che possono essere lunghe;<br>• il <b>costo salvato su ogni messaggio</b>, così per sapere quanto è costata una conversazione basta sommare i costi dei suoi messaggi con una query;<br>• date con <code>DateTime(timezone=True)</code>, cioè con il fuso orario.`,
        `Le query si costruiscono con <code>select()</code>: <code>select(ChatSession).where(ChatSession.id == sid)</code>. Siccome usi gli attributi della classe e non stringhe, se rinomini un campo mypy ti avvisa.`,
        `Per eseguirle: <code>(await session.execute(stmt)).scalars().all()</code>. Serve <code>.scalars()</code> perché <code>execute()</code> restituisce sempre righe sotto forma di tuple, anche se hai chiesto un solo tipo di oggetto. La vecchia <code>.query()</code> che trovi in giro su internet in async non esiste.`],
    ex: `È un query builder tipizzato: niente stringhe SQL, e l'IDE ti suggerisce i nomi dei campi.`,
    k: [[`Chiave primaria`, `La colonna che identifica in modo unico ogni riga (es. id).`], [`Indice`, `Struttura del database che velocizza la ricerca su una colonna, come l'indice di un libro.`], [`UUID`, `Identificativo casuale di 128 bit, praticamente unico al mondo.`]] },
  { t: `Relazioni: caricare i dati collegati`,
    s: `Una chat ha molti messaggi. In async i messaggi vanno caricati insieme alla chat, nella stessa operazione, con selectinload.`,
    p: [`Una sessione di chat ha tanti messaggi: è una relazione <b>uno-a-molti</b>. Visto dal lato del messaggio, che appartiene a una sola chat, è <b>molti-a-uno</b>.`,
        `La relazione si dichiara nel modello con <code>relationship</code>. Due opzioni utili: <code>cascade</code>, che fa sparire i messaggi quando cancelli la chat, e <code>order_by</code>, che li restituisce in ordine.`,
        `Nel Python sincrono, quando scrivi <code>sessione.messages</code> SQLAlchemy fa partire una query senza dirtelo, per caricare i messaggi in quel momento (<b>lazy loading</b>, caricamento pigro). In async non può farlo, perché ogni accesso al database deve passare da un <code>await</code>. Il risultato è l'errore <code>MissingGreenlet</code>.`,
        `La soluzione è chiedere i messaggi <b>subito</b>, già nella query della chat. Ci sono due modi:<br>• <code>selectinload</code>: fa una seconda query del tipo "dammi i messaggi di queste chat" (<code>IN (id1, id2, …)</code>). È quello giusto per l'uno-a-molti;<br>• <code>joinedload</code>: unisce le due tabelle nella stessa query (<code>JOIN</code>). Va bene per il molti-a-uno; su un uno-a-molti ripeterebbe i dati della chat in ogni riga, una per messaggio.`],
    ex: `In async ogni accesso al database deve essere un <code>await</code> visibile nel codice: niente query nascoste dietro un attributo.`,
    k: [[`Lazy loading`, `Caricamento pigro: i dati collegati si leggono solo quando li usi.`], [`Eager loading`, `Caricamento anticipato: li leggi subito insieme all'oggetto principale.`], [`JOIN`, `Operazione SQL che unisce righe di due tabelle collegate.`]] },
  { t: `Transazioni: flush e commit`,
    s: `Le modifiche al database valgono tutte o nessuna. flush le prepara, commit le conferma. Senza commit non viene salvato niente.`,
    p: [`Una <b>transazione</b> è un gruppo di modifiche al database che vengono confermate tutte insieme, oppure annullate tutte insieme.`,
        `<code>session.flush()</code> manda le modifiche al database, ma <b>dentro</b> la transazione ancora aperta: la tua sessione le vede, gli altri no. È anche il momento in cui il database controlla i vincoli (valore unico, chiave esterna…). Questo è utile: se qualcosa non va, l'errore arriva subito dopo l'operazione che l'ha causato, e capisci subito dov'è il problema.`,
        `<code>session.commit()</code> chiude la transazione e rende le modifiche definitive e visibili a tutti.`,
        `Se la sessione si chiude <b>senza</b> commit, il database annulla tutto (<b>rollback</b>) e non te lo segnala. Quindi, se "non si salva niente", la prima cosa da controllare è se manca il commit.`,
        `Nel corso il commit lo fa il <b>service</b>, una volta sola, alla fine dell'operazione. Esempio: quando l'utente scrive, si salvano due cose, il suo messaggio e la risposta del modello. Con un solo commit alla fine, o vengono salvate entrambe o nessuna. Se il commit fosse dentro ogni metodo del repository, non potresti tenere insieme le due scritture.`],
    ex: `flush ≈ "salva in bozza", commit ≈ "pubblica".`,
    k: [[`Transazione`, `Insieme di operazioni confermate o annullate insieme.`], [`Rollback`, `Annullare tutte le modifiche della transazione.`], [`Atomico`, `Che avviene per intero o per niente, mai a metà.`], [`Vincolo`, `Regola del DB (es. valore unico, non nullo) verificata a ogni scrittura.`]] },
  { t: `Alembic: le versioni dello schema`,
    s: `Quando cambi i modelli, il database va aggiornato. Alembic prepara lo script di aggiornamento; tu lo leggi e poi lo applichi.`,
    p: [`Se aggiungi una colonna a un modello, la tabella nel database non cambia da sola. Serve una <b>migration</b>: uno script che porta il database dalla struttura vecchia a quella nuova.`,
        `Il ciclo ha tre passi:<br>1. <code>alembic revision --autogenerate -m "descrizione"</code>: Alembic confronta i modelli con il database e <b>propone</b> lo script;<br>2. tu lo <b>leggi</b>;<br>3. <code>alembic upgrade head</code>: lo applica.`,
        `Il passo 2 è importante. Per esempio, se rinomini una colonna, Alembic non capisce che è una rinomina: propone "aggiungi una colonna nuova ed elimina quella vecchia", e così perdi i dati che c'erano. In quel caso correggi lo script a mano usando <code>alter_column</code>.`,
        `Un dettaglio che ti salva: nel file <code>env.py</code> di Alembic ci deve essere <code>from src.db import models</code>. Senza, Alembic non vede i modelli, pensa che non debba esistere nessuna tabella e su un database già pieno propone di cancellarle tutte.`,
        `Il database ricorda a quale migration è arrivato in una piccola tabella, <code>alembic_version</code>. Una migration già applicata non si modifica: se serve un'altra modifica, se ne crea una nuova.`,
        `L'indirizzo del database non si scrive in <code>alembic.ini</code>, che finisce su Git: <code>env.py</code> lo legge da Settings. In sviluppo Postgres gira in Docker (immagine <code>pgvector/pgvector:pg16</code>) con un <b>volume</b>, così i dati restano anche quando riavvii il container.`],
    ex: `Una migration è come un commit Git, ma per la struttura del database. Equivale a Flyway o Liquibase nel mondo Java.`,
    k: [[`Migration`, `Script versionato che modifica lo schema del database.`], [`Schema`, `La struttura del database: tabelle, colonne, indici.`], [`Volume Docker`, `Spazio su disco che sopravvive quando il container viene ricreato.`]] },
  { t: `Repository pattern: ognuno il suo compito`,
    s: `Il codice è diviso in tre livelli: endpoint, service e repository. Solo il repository parla con il database.`,
    p: [`Il <b>repository</b> (<code>src/db/repos.py</code>, per esempio <code>ChatRepository</code>) è l'unico posto del codice che sa che esiste un database. Offre metodi semplici come <code>by_id</code>, <code>create_session</code>, <code>add_message</code>.`,
        `Il <b>service</b> (<code>src/services/chat_service.py</code>) contiene la logica: cosa vuol dire una conversazione, cosa va salvato e quando è il momento di fare commit.`,
        `L'<b>endpoint</b> (<code>src/api/chat.py</code>) riceve la richiesta, chiama il service e restituisce la risposta.`,
        `Siccome <code>Depends</code> crea ogni dipendenza una volta sola per richiesta, il repository e il service ricevono la <b>stessa sessione</b> del database, quindi lavorano nella stessa transazione.`,
        `A cosa serve tutta questa divisione? Al Giorno 9 potrai testare il service con un repository finto, senza accendere Postgres. E se un giorno cambiasse il database, toccheresti solo il repository.`],
    ex: `Endpoint → service → repository somiglia a componente → service → HttpClient in Angular: ogni livello fa una cosa sola.`,
    k: [[`Repository`, `Oggetto che nasconde come si leggono e scrivono i dati.`], [`Layer`, `Livello dell'architettura con una responsabilità precisa.`]] }
];

SLIDES.g4 = [
  { t: `LLM, token e prompt: le basi`,
    s: `Un LLM genera testo un pezzetto alla volta, e si paga per ogni pezzetto. Con pochi parametri decidi come si comporta e quanto spendi.`,
    p: [`Un <b>LLM</b> riceve del testo e ne genera altro, un pezzetto alla volta: a ogni passo sceglie il pezzetto successivo più adatto. Ogni pezzetto si chiama <b>token</b>, ed è un frammento di parola. In italiano un token vale in media circa 3 caratteri.`,
        `Si paga <b>a token</b>: quelli che mandi (il prompt) e quelli che ricevi (la risposta). I token in uscita costano di più di quelli in entrata, quindi nei conti vanno tenuti separati.`,
        `La conversazione si manda come una lista di <b>messaggi</b>, ognuno con un ruolo:<br>• <b>system</b>: il ruolo e le regole ("sei l'assistente di LipariBank, rispondi solo su…");<br>• <b>user</b>: la domanda dell'utente;<br>• <b>assistant</b>: le risposte già date dal modello.`,
        `Il modello di solito segue il prompt di sistema, ma non è obbligato: una domanda furba dell'utente può fargli ignorare le regole. Per questo i controlli importanti, come permessi e limiti, si mettono nel codice e non solo nel prompt.`,
        `I tre parametri che contano di più:<br>• <b>model</b>: quale modello usare. È la scelta che pesa di più sul conto. In generale conviene il più piccolo, e quindi più economico, che risponde abbastanza bene ai tuoi test di qualità (gli <b>eval</b>, al Giorno 9);<br>• <b>temperature</b>: quanto il modello è libero di scegliere parole meno probabili. Bassa per classificare o estrarre dati, più alta per scrivere testi. Anche a 0 la risposta può variare un po';<br>• <b>max_tokens</b>: la lunghezza massima della risposta, che è anche un tetto alla spesa. Se il modello ci arriva, la risposta viene tagliata e <code>finish_reason</code> vale <code>"length"</code>: conviene controllarlo.`],
    ex: `Un LLM è un'API esterna come quelle che chiamavi da Angular. Solo che è lenta, costa a ogni chiamata e non risponde sempre allo stesso modo.`,
    k: [[`Token`, `Unità di testo che il modello legge e scrive; la base per prezzo e limiti.`], [`Prompt`, `Il testo di istruzioni e domanda che mandi al modello.`], [`Context window`, `Quanti token il modello può considerare in una volta, prompt e risposta insieme.`]] },
  { t: `Le quattro cose da sapere su un LLM`,
    s: `Un LLM può rispondere in modo diverso alla stessa domanda, costa, è lento e a volte fallisce. Il codice va scritto tenendone conto.`,
    p: [`<b>1. Non risponde sempre uguale.</b> La stessa domanda può dare risposte diverse. Quindi i test non possono confrontare il testo parola per parola: devono accettare che vari e misurare se va bene.`,
        `<b>2. Costa.</b> Con gpt-4o-mini, ai prezzi usati nel corso, un milione di token costa 0,14 € in entrata e 0,56 € in uscita. Sembra poco, ma con un milione di utenti e cento conversazioni al giorno a testa si superano i 20.000 € al giorno. Per questo serve un tetto di spesa. La tabella dei prezzi nel codice (<code>PRICING</code>) è copiata dal listino del fornitore a una certa data: quando i prezzi cambiano, va aggiornata.`,
        `<b>3. È lento.</b> Una risposta può impiegare da mezzo secondo a cinque secondi. Per non lasciare l'utente davanti a una pagina vuota si usa lo streaming (lo vediamo tra poco).`,
        `<b>4. A volte fallisce.</b> I casi tipici: troppe richieste in poco tempo (errore <b>429</b>, rate limit), conversazione troppo lunga per il modello, filtro sui contenuti, problemi di rete. Tre di questi arrivano come errore. Il filtro sui contenuti invece no: la chiamata "riesce", ma la risposta è vuota o un rifiuto. Te ne accorgi solo leggendo la risposta.`,
        `Sul 429 l'SDK riprova da solo, due volte, aspettando un po' di più ogni volta. Se ci aggiungi anche un tuo meccanismo per riprovare, i tentativi si moltiplicano: 3 tuoi × 3 dell'SDK fanno fino a 9 chiamate per una sola richiesta.`,
        `Per le conversazioni troppo lunghe, il service manda al modello solo il prompt di sistema e gli ultimi N messaggi (la costante <code>FINESTRA</code>).`],
    k: [[`Latenza`, `Tempo fra la richiesta e la risposta.`], [`Rate limit`, `Limite di richieste al minuto imposto dal fornitore.`], [`Retry con backoff`, `Riprovare aspettando ogni volta un po' di più.`]] },
  { t: `Chiamare OpenAI e Anthropic`,
    s: `Si crea un client async una volta sola e lo si riusa. OpenAI e Anthropic funzionano in modo un po' diverso.`,
    p: [`Per chiamare OpenAI usi <code>AsyncOpenAI(api_key=..., timeout=..., max_retries=...)</code>. Il client si crea <b>una volta</b> e si riusa per tutte le richieste, passandolo agli endpoint con <code>Depends</code>. Ogni chiamata ha il suo <code>await</code>.`,
        `Il <b>timeout</b>, cioè quanto aspettare prima di arrendersi, di default è di dieci minuti: troppo. Va impostato tu.`,
        `Anthropic, con <code>AsyncAnthropic</code>, funziona in modo un po' diverso:<br>• il prompt di sistema si passa come parametro a parte, non come messaggio;<br>• la risposta è una <b>lista di blocchi</b> (testo, richiesta di usare uno strumento…), quindi si legge in un altro modo;<br>• i token usati hanno nomi di campo diversi;<br>• <code>max_tokens</code> è obbligatorio.`,
        `Queste differenze non devono finire sparse nel codice dell'app: le nasconde l'<b>astrazione</b> che vediamo nella prossima slide.`,
        `Un'abitudine da prendere subito: salvare <code>usage</code>, cioè quanti token sono stati usati, fin dalla prima chiamata. Senza questi dati, al Giorno 9 non potrai sapere quanto spendi.`],
    ex: `È come creare un solo HttpClient configurato e iniettarlo dove serve, invece di crearne uno nuovo a ogni chiamata.`,
    k: [[`Client`, `Oggetto che sa parlare con un servizio esterno (indirizzo, chiave, timeout).`], [`Timeout`, `Tempo massimo di attesa, oltre il quale si rinuncia con un errore.`]] },
  { t: `Un'interfaccia comune per tutti i fornitori`,
    s: `Scrivi un contratto unico per tutti i fornitori di LLM, così puoi cambiarli dalla configurazione senza toccare il resto del codice.`,
    p: [`Per non legare l'app a un solo fornitore, si definisce un <b>contratto</b>, cioè l'elenco dei metodi che ogni fornitore deve avere: <code>class LLMProvider(Protocol)</code> con due metodi, <code>complete</code> (la risposta tutta insieme) e <code>stream</code> (la risposta a pezzi).`,
        `Un <code>Protocol</code> funziona "per forma": una classe lo rispetta se ha quei metodi, senza dover ereditare da niente. Quindi anche un fornitore finto, scritto per i test, va bene.`,
        `Il dato che torna sempre indietro è <code>LLMResponse</code>: oltre al testo contiene i <b>token usati, il costo e il modello</b>. Così ogni chiamata, anche in streaming, porta con sé quanto è costata.`,
        `<code>OpenAIProvider</code> e <code>AnthropicProvider</code> traducono il contratto nel "linguaggio" di ciascun fornitore.`,
        `Una <b>factory</b> (<code>src/llm/factory.py</code>) legge la configurazione e decide quale fornitore usare: cambiarlo è una riga. Se nella configurazione c'è un modello che non conosce, dà subito un errore chiaro invece di usarne un altro di nascosto.`,
        `Così diventa possibile anche il <b>fallback</b>: se il fornitore principale non risponde, si passa al secondo. Occhio però: il modello di riserva risponde in modo diverso (stile, qualità, formato), e questo succede proprio durante un guasto, quando è più difficile accorgersene. Il fallback va provato prima, non scoperto in produzione.`],
    ex: `<code>Protocol</code> funziona come un'interface TypeScript: basta avere quei metodi, non serve "implements". La factory somiglia a un provider Angular con <code>useFactory</code>.`,
    k: [[`Astrazione`, `Un contratto comune che nasconde i dettagli delle diverse implementazioni.`], [`Factory`, `Funzione che decide quale oggetto creare.`], [`Fallback`, `Piano B automatico quando il servizio principale fallisce.`]] },
  { t: `Prompt in file con la versione`,
    s: `I prompt cambiano spesso il comportamento dell'app, quindi si tengono in file con la versione nel nome, come il codice.`,
    p: [`Un prompt cambia il comportamento dell'app tanto quanto il codice, e di solito cambia più spesso. Per questo non si scrive come stringa sparsa nel codice.`,
        `I prompt stanno in file nella cartella <code>src/llm/prompts/</code>, con la <b>versione nel nome</b> (es. <code>categorize_v2</code>), e si caricano con <code>src/llm/prompt.py</code>.`,
        `Un prompt ben fatto ha sezioni chiare: il ruolo, le regole (<b>Rules</b>: cosa fare e cosa non fare) e lo stile (<b>Style</b>: tono e formato della risposta).`,
        `I vantaggi: nel diff vedi esattamente cosa è cambiato nelle istruzioni, un collega le può rivedere in una pull request e, grazie al numero di versione, puoi confrontare due versioni con un <b>eval</b>, cioè facendo le stesse domande di prova a tutte e due e vedendo quale risponde meglio.`],
    ex: `È come tenere i template in file separati invece che come stringhe dentro i componenti.`,
    k: [[`Eval`, `Test di qualità per un LLM: un insieme di casi e una misura dei risultati.`], [`Pull request`, `Richiesta di unire modifiche al codice principale, con revisione di un collega.`]] },
  { t: `Risposte strutturate con Instructor`,
    s: `Quando ti servono dati e non testo libero, Instructor obbliga il modello a rispondere con un oggetto Pydantic valido.`,
    p: [`Spesso dal modello non vuoi un testo, ma un <b>dato</b>. Per esempio: "in quale categoria va questo movimento bancario?", scegliendo tra un elenco fisso.`,
        `Senza strumenti, scriveresti nel prompt "rispondi in JSON" e speri che il testo sia JSON valido. Con <b>Instructor</b> passi un modello Pydantic (<code>CategorizeResponse</code>); Instructor lo trasforma in istruzioni per il modello e poi controlla la risposta.`,
        `Il risultato è un oggetto <code>CategorizeResponse</code> già valido, non una stringa da interpretare. O hai un oggetto corretto, o hai un errore: non esiste il caso "testo quasi giusto".`,
        `Se la risposta non è valida, Instructor riprova: rimanda al modello l'errore e gli chiede di correggersi. Ogni tentativo è una chiamata in più, e quindi si paga.`,
        `Per ridurre i tentativi conta come scrivi il modello Pydantic. <code>Literal["UTILITIES", "STIPENDIO", …]</code> chiude l'elenco delle categorie e impedisce al modello di inventarne di nuove. Nomi chiari e una <code>description</code> su ogni campo aiutano il modello a rispondere giusto al primo colpo.`],
    ex: `È come tipizzare la risposta di un <code>http.get&lt;T&gt;()</code>, ma con un controllo vero: se la risposta non rispetta T, si riprova.`,
    k: [[`Schema`, `Descrizione formale della forma dei dati (campi, tipi, valori ammessi).`], [`Structured output`, `Risposta del modello in un formato dati preciso, invece che testo libero.`], [`Tassonomia`, `L'elenco chiuso di categorie ammesse.`]] },
  { t: `Streaming con SSE`,
    s: `Con lo streaming l'utente vede la risposta comparire man mano che il modello la scrive, invece di aspettare secondi davanti a una pagina vuota.`,
    p: [`Cinque secondi di schermo vuoto sembrano un'eternità. Con lo <b>streaming</b> il modello manda la risposta a pezzi mentre la scrive. Il tempo totale non cambia molto, ma il primo pezzo arriva quasi subito, e l'utente capisce che il sistema sta lavorando.`,
        `In Python si attiva con <code>stream=True</code> e si leggono i pezzi con <code>async for chunk in stream</code>. Il provider espone una funzione <code>async def</code> con <code>yield</code> (un <code>AsyncGenerator</code>) che restituisce i pezzi uno alla volta.`,
        `Verso il browser, i pezzi viaggiano con <b>Server-Sent Events (SSE)</b>: una connessione che resta aperta e su cui il server manda messaggi uno dopo l'altro. Per provarlo da terminale si usa <code>curl -N</code>.`,
        `Due accorgimenti:<br>• i controlli (per esempio "la conversazione esiste?") si fanno <b>prima</b> di far partire lo stream. Lo status della risposta (200, 404…) parte insieme al primo pezzo, e dopo non si può più cambiare;<br>• il costo si salva <b>una volta</b>, quando lo stream è finito, non a ogni pezzo.`,
        `In streaming il conteggio dei token arriva solo se lo chiedi: <code>stream_options={"include_usage": True}</code>. Altrimenti non sai quanto ti è costato proprio l'endpoint più usato.`],
    ex: `Un AsyncGenerator somiglia a un Observable RxJS che emette valori nel tempo. SSE è una connessione aperta su cui il server "spinge" eventi.`,
    k: [[`SSE`, `Server-Sent Events: standard per inviare eventi dal server al browser su HTTP.`], [`AsyncGenerator`, `Funzione asincrona che produce una serie di valori nel tempo.`], [`Chunk`, `Un pezzo della risposta in streaming.`]] },
  { t: `Tool use e tetto di spesa`,
    s: `Il modello può chiederti di eseguire una funzione del tuo codice, ma sei tu a decidere se farlo. E prima di ogni chiamata si controlla quanto hai già speso oggi.`,
    p: [`Con il <b>tool use</b> (chiamato anche function calling) dai al modello l'elenco degli strumenti che può usare: nome, <b>descrizione</b> e parametri di ognuno (<code>TOOLS_SCHEMA</code>).`,
        `Il modello non esegue niente da solo. Ti <b>propone</b> una chiamata ("vorrei usare questo strumento con questi parametri"); il tuo codice controlla i parametri, verifica che l'utente abbia il permesso, la esegue e restituisce il risultato al modello. Servono quindi <b>due chiamate</b> al modello, che vuol dire il doppio del costo e del tempo. Se sai già quali dati servono, conviene recuperarli tu con una query e metterli nel prompt; il tool use serve quando è il modello a dover decidere cosa cercare.`,
        `I parametri li sceglie il modello, quindi non sono affidabili. Se propone un <code>account_id</code>, non vuol dire che l'operatore possa vedere quel conto: il permesso si controlla sempre sull'utente che ha fatto la richiesta.`,
        `Il modello sceglie lo strumento leggendo solo le <code>description</code>: scrivile bene. Meglio pochi strumenti, ben distinti tra loro.`,
        `Il <b>tetto di spesa</b> (<code>CostTracker</code>): prima di ogni chiamata si somma quanto si è speso oggi (si può fare perché il costo è salvato su ogni messaggio). Se il tetto è superato, la risposta è <b>429</b> con <code>Retry-After</code> e il modello non viene chiamato. Bloccare è l'ultima risorsa: prima conviene risparmiare, passando a un modello più economico o accorciando le risposte.`],
    ex: `Il modello è come un collega che ti dice "chiameresti questa API con questi parametri?". La decisione resta tua.`,
    k: [[`Tool use`, `Il modello chiede di eseguire funzioni del tuo codice per ottenere dati o compiere azioni.`], [`Guardrail`, `Controllo di sicurezza che blocca un comportamento indesiderato (qui: spendere troppo).`], [`Retry-After`, `Header che dice al client dopo quanto riprovare.`]] }
];

SLIDES.g5 = [
  { t: `Il problema e l'idea del RAG`,
    s: `Il modello non conosce i documenti della banca. Con il RAG prima cerchi i pezzi giusti nei documenti, poi glieli passi insieme alla domanda.`,
    p: [`Un LLM sa quello che ha letto durante l'addestramento. Le procedure interne di LipariBank non le ha mai viste. Se gli chiedi "come si sblocca una carta da noi?", rischia di <b>inventare</b> una risposta con tono sicuro: si chiama allucinazione.`,
        `La soluzione è il <b>RAG</b>, Retrieval-Augmented Generation, che funziona in tre passi:<br>1. <b>Retrieval</b> (recupero): cerchi nei documenti della banca i passaggi che parlano della domanda;<br>2. <b>Augmented</b> (arricchito): metti quei passaggi nel prompt, insieme alla domanda;<br>3. <b>Generation</b> (generazione): il modello risponde usando quei passaggi e indica da quali ha preso le informazioni.`,
        `Nel progetto è l'endpoint <code>/api/ai/advice</code>, che risponde sulle procedure della banca. C'è anche un secondo endpoint che carica i documenti (l'<b>ingestion</b>). Va protetto: senza controllo degli accessi, chiunque potrebbe aggiungere documenti alla base di conoscenza da cui il sistema risponde.`],
    ex: `È un esame a libro aperto: il modello non deve ricordare niente, deve solo leggere le pagine giuste che gli passi tu.`,
    k: [[`Allucinazione`, `Quando il modello afferma con sicurezza qualcosa di falso o inventato.`], [`Grounding`, `Ancorare la risposta a fonti precise.`], [`Base di conoscenza`, `Tutti i documenti caricati con l'ingestion, salvati in Postgres come chunk (testo + embedding + provenienza). È dove il RAG cerca.`]] },
  { t: `Cos'è un embedding`,
    s: `Un embedding trasforma un testo in una lista di numeri che ne rappresenta il significato. Testi con significato simile hanno numeri simili.`,
    p: [`Il computer non capisce le parole, lavora con i numeri. Un <b>embedding</b> trasforma un testo in una <b>lista di numeri</b> (si chiama <b>vettore</b>) che ne rappresenta il <b>significato</b>.`,
        `Pensa alle coordinate GPS: due numeri dicono dove si trova un posto, e due posti vicini hanno coordinate simili. Un embedding fa la stessa cosa con il significato, solo che usa molti più numeri: <b>1536</b> con il modello del corso (<code>text-embedding-3-small</code> di OpenAI). È come una "posizione" in una mappa dei significati.`,
        `Il risultato è che testi con <b>significato simile</b> finiscono <b>vicini</b>, anche se usano parole diverse. Cercando "istituto di credito" trovi un testo che parla di "banca", cosa che una ricerca per parole non farebbe.`,
        `Occhio però: l'embedding misura quanto due testi parlano della stessa cosa, non se dicono la stessa cosa. "Conto senza costi" e "conto con commissione" parlano dello stesso argomento e sono vicinissimi. La ricerca ti porta il paragrafo giusto, ma la risposta va comunque letta.`,
        `Gli embedding li calcola un <b>modello di embedding</b>, che è diverso dal modello che chatta. Documenti e domande devono passare dallo <b>stesso</b> modello. Se usi modelli diversi non ricevi errori, ma risultati a caso. E se un giorno cambi modello, devi ricalcolare gli embedding di tutti i chunk già salvati nel database.`],
    ex: `In codice è semplicemente un <code>number[]</code> lungo 1536. La parte "intelligente" è il modello che sceglie quei numeri.`,
    k: [[`Vettore`, `Una lista ordinata di numeri. Ogni numero è una "dimensione".`], [`Dimensioni`, `Quanti numeri ha il vettore (1536 qui; 768 o 1024 per molti modelli open source).`], [`Ricerca semantica`, `Cercare per significato invece che per parole uguali.`]] },
  { t: `Misurare la vicinanza: coseno e pgvector`,
    s: `Per capire se due testi sono simili si misura l'angolo tra i loro vettori. pgvector permette di farlo direttamente in Postgres.`,
    p: [`Immagina ogni vettore come una freccia che parte dal centro. Due testi simili hanno frecce che puntano più o meno nella <b>stessa direzione</b>.`,
        `La <b>similarità coseno</b> misura l'angolo tra due frecce: <b>1</b> vuol dire stessa direzione (molto simili), <b>0</b> nessuna relazione, <b>−1</b> direzioni opposte. Con i testi si resta quasi sempre sopra lo zero.`,
        `La <b>distanza coseno</b> è il contrario (1 − similarità): più è <b>piccola</b>, più i testi sono vicini. Quindi i risultati si ordinano dal più piccolo al più grande.`,
        `<b>pgvector</b> è un'estensione di PostgreSQL. Aggiunge il tipo di colonna <code>vector(1536)</code> e l'operatore <code>&lt;=&gt;</code>, che calcola la distanza coseno. Perché usare pgvector e non un database vettoriale separato? Perché testo, vettore e permessi stanno nella stessa riga della stessa tabella. Una sola query SQL trova i chunk più vicini e, nello stesso <code>WHERE</code>, filtra per permessi o per documento. Con due sistemi separati dovresti tenerli allineati.`,
        `Due dettagli pratici: <code>CREATE EXTENSION vector</code> va scritto a mano nella migration, prima di creare la tabella, perché Alembic non lo propone da solo; e la colonna non si può chiamare <code>metadata</code>, perché SQLAlchemy usa già quel nome.`],
    ex: `Il coseno guarda solo la direzione, non la lunghezza: due frecce, una corta e una lunga, che puntano uguale sono "simili".`,
    k: [[`Estensione Postgres`, `Un modulo che aggiunge tipi e funzioni al database.`], [`Distanza`, `Quanto due vettori sono lontani: più piccola = più simili.`]] },
  { t: `L'indice HNSW`,
    s: `HNSW è un indice del database che trova i vettori più vicini molto in fretta, a costo di perderne raramente qualcuno.`,
    p: [`Qui "indice" vuol dire un indice del database, come quelli del Giorno 3: una struttura che velocizza la ricerca. Senza indice, a ogni domanda il database confronta il vettore della domanda con <b>tutti</b> i vettori salvati. Con molti documenti diventa lento.`,
        `<b>HNSW</b> (Hierarchical Navigable Small World) collega ogni vettore ai suoi vicini, su più livelli. La ricerca parte dal livello più alto, dove ci sono pochi punti e si fanno salti lunghi, e scende livello dopo livello verso la zona della domanda.`,
        `È <b>approssimato</b>: con le impostazioni predefinite trova circa il <b>99%</b> dei vicini veri, in un quindicesimo del tempo.`,
        `Ha tre parametri. <code>m</code> ed <code>ef_construction</code> si decidono quando crei l'indice. <code>ef_search</code>, cioè quanti candidati esplorare durante la ricerca, si può cambiare anche dopo: è quello da alzare se vuoi più precisione.`,
        `Due cose da sapere. L'indice va creato per lo stesso tipo di distanza che usi nella query (qui il coseno): se non corrispondono, Postgres non lo usa e torna alla ricerca lenta. E con i filtri: HNSW prende prima i candidati più vicini e solo dopo applica il <code>WHERE</code>. Se il filtro scarta quasi tutto, ricevi meno risultati di quelli che hai chiesto, senza nessun errore.`],
    ex: `Funziona come cercare una persona chiedendo ad amici di amici, invece di bussare a tutte le porte della città.`,
    k: [[`Indice approssimato (ANN)`, `Indice che trova quasi sempre i più vicini, molto più in fretta della ricerca esatta.`], [`Grafo`, `Insieme di punti collegati da archi.`]] },
  { t: `Chunking: tagliare i documenti`,
    s: `I documenti si tagliano in pezzi di circa 500 caratteri, chiamati chunk. Sono i pezzi che il sistema cerca e passa al modello.`,
    p: [`Non si fa l'embedding di un documento intero, per due motivi. Il vettore di un documento di 30 pagine mescola troppi argomenti e non risulta vicino a nessuna domanda precisa. E nel prompt c'è posto solo per un po' di testo, non per documenti interi.`,
        `Per questo il documento si taglia in <b>chunk</b>. Il chunk è l'unità che il sistema cerca e restituisce: se un'informazione è spezzata male tra due chunk, è difficile ritrovarla.`,
        `La funzione <code>chunk_text</code> del corso fa così: chunk di circa <b>500 caratteri</b>; cerca di tagliare alla <b>fine di una frase</b> (". ", "? ", "! " o una riga vuota), se ne trova una oltre metà del chunk; e ripete gli ultimi <b>50 caratteri</b> all'inizio del chunk successivo (si chiama <b>overlap</b>, sovrapposizione).`,
        `È un equilibrio. Un chunk <b>troppo grande</b> parla di troppe cose, e il suo vettore non è vicino a nessuna domanda precisa. Un chunk <b>troppo piccolo</b> perde il contesto, per esempio "il limite è 5.000 €" senza dire limite di cosa. Tra 400 e 800 caratteri di solito sta intero un paragrafo.`,
        `Se il documento ha una struttura, conviene seguirla: una FAQ si taglia per coppia domanda/risposta; una tabella si trasforma prima in frasi. La lunghezza fissa si usa quando una struttura non c'è.`,
        `Il corso conta in caratteri, i modelli contano in token: in italiano un token vale circa 3 caratteri.`],
    k: [[`Chunk`, `Un pezzo di documento, l'unità che viene cercata e restituita.`], [`Overlap`, `Caratteri in comune fra chunk vicini, per non spezzare il senso sul confine.`]] },
  { t: `Ingestion: preparare i documenti`,
    s: `Prima di poter cercare, ogni documento va letto, ripulito, tagliato in chunk, trasformato in embedding e salvato. Si fa una volta sola per documento.`,
    p: [`L'<b>ingestion</b> è il lavoro di preparazione dei documenti. Si fa una volta per documento, non a ogni domanda. Se il documento è grande, si elabora in <b>background</b>, così la richiesta HTTP non resta in attesa.`,
        `I passi:<br>1. <b>Leggere e ripulire</b>: si estrae il testo dal file. I PDF si leggono pagina per pagina e il numero di pagina si annota subito, perché dopo il taglio un chunk non sa più da che pagina veniva. Si tolgono intestazioni e piè di pagina ripetuti. Se una pagina non ha testo, è una scansione e serve l'OCR.<br>2. <b>Chunking</b>: il testo si taglia in chunk.<br>3. <b>Embedding</b>: si calcola il vettore di ogni chunk, mandandone tanti in una sola chiamata (<b>batch</b>). La parte lenta è il viaggio in rete, quindi 100 testi in una chiamata sono molto più veloci di 100 chiamate.<br>4. <b>Salvataggio</b>: ogni chunk diventa una riga <code>DocumentChunk</code> con testo, vettore, documento, pagina e posizione.`,
        `Tre accorgimenti: un solo <b>commit</b> alla fine, così non resta mai un documento salvato a metà; prima di salvare si cancellano i chunk dello stesso <code>document_id</code>, così ricaricare un documento lo <b>sostituisce</b> invece di duplicarlo; i passaggi identici si salvano una volta sola.`,
        `La qualità si decide nei primi passi: se il testo estratto è sporco (intestazioni ripetute, parole spezzate), anche i chunk e gli embedding lo saranno.`],
    ex: `È come una pipeline ETL: estrai, trasformi, carichi. La fai prima, così dopo la ricerca è veloce.`,
    k: [[`Ingestion`, `Caricamento e preparazione dei documenti nella base di conoscenza.`], [`Batch`, `Elaborare più elementi insieme in una sola chiamata.`], [`OCR`, `Riconoscimento del testo in un'immagine; sbaglia spesso su numeri e sigle.`], [`Metadati di provenienza`, `Da quale documento e pagina viene un chunk: servono per citare.`]] },
  { t: `Cercare, rispondere e citare`,
    s: `La domanda diventa un vettore, si prendono i chunk più vicini, e il modello risponde solo con quelli, citandoli. Se non trova la risposta, deve poterlo dire.`,
    p: [`Quando arriva una domanda, se ne calcola l'embedding con lo stesso modello dei documenti e si prendono i <b>top-k</b> chunk più vicini, di solito da 3 a 5.`,
        `Nella query SQL i valori si passano come <b>parametri</b> (per esempio <code>:vettore</code>) e non incollandoli nel testo della query. Altrimenti un input malevolo potrebbe modificare la query (SQL injection).`,
        `Serve anche una <b>soglia di similarità</b>. Il top-k restituisce sempre k risultati, anche se la domanda non c'entra niente con i documenti. La soglia scarta i chunk troppo lontani, così il sistema può capire "non ho trovato niente".`,
        `Il prompt dice due cose al modello: rispondi <b>solo</b> usando questi passaggi, e se la risposta non c'è <b>di' che non lo sai</b>. Il secondo punto è importante: se non gli dai il permesso di dire "non lo so", il modello riempie i buchi con quello che sa, con lo stesso tono sicuro.`,
        `Il modello cita le fonti scrivendo <code>[fonte-1]</code>, <code>[fonte-2]</code>. Dalla risposta si estraggono solo le fonti <b>effettivamente citate</b>. Se il modello risponde "non lo so", le fonti sono zero.`,
        `Se una risposta è sbagliata, guarda prima i chunk che il sistema ha trovato. Se erano giusti, il problema è nella generazione (prompt o modello). Se erano sbagliati, è nella ricerca.`],
    k: [[`Top-k`, `I k risultati migliori della ricerca.`], [`Soglia`, `Valore minimo di similarità sotto il quale un risultato si scarta.`], [`Citazione`, `Riferimento alla fonte usata, qui con marcatori [fonte-N].`]] },
  { t: `Dove il RAG non basta`,
    s: `Il RAG ha dei limiti, e il più insidioso è che quando sbaglia risponde comunque con sicurezza. Conviene conoscere i casi tipici.`,
    p: [`Il rischio principale: quando il RAG sbaglia non va in errore, <b>risponde</b>, con lo stesso tono di quando ha ragione.`,
        `<b>Domande che richiedono due documenti.</b> Se la risposta richiede due informazioni che stanno in documenti diversi, nessun chunk le contiene entrambe. Fare chunk più grandi non risolve. Si chiama multi-hop.`,
        `<b>Domande che chiedono un conto.</b> "Quante pratiche aperte a ottobre?" La risposta è un numero che non è scritto in nessun documento: va calcolato. Qui spesso serve una query SQL, non il RAG.`,
        `<b>Documenti vecchi.</b> Nel database ci sono i documenti com'erano quando li hai caricati con l'ingestion. Se una procedura cambia e non ricarichi il documento, il sistema risponde con la versione vecchia. E siccome cita una fonte ufficiale, l'utente si fida.`,
        `<b>Costi.</b> L'embedding costa pochissimo. La spesa principale è la generazione: più chunk metti nel prompt, più token paghi. Con k=3 il contesto è più mirato, con k=10 è più probabile includere il chunk giusto ma paghi di più.`,
