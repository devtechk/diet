  slides: [
    { t: `Cos'è un backend`,
      p: [`Un backend è un programma che riceve <b>richieste HTTP</b> e restituisce <b>risposte</b>, di solito in <b>JSON</b>.`,
          `Una richiesta ha: un <b>metodo</b> (GET leggi, POST crea/invia, PUT/PATCH modifica, DELETE cancella), un <b>indirizzo</b> (path), delle <b>intestazioni</b> (header, es. il token) e a volte un <b>corpo</b> (body, i dati in JSON).`,
          `Ogni combinazione metodo + indirizzo che il server gestisce è un <b>endpoint</b>: es. <code>POST /api/chat</code>.`,
          `Lo <b>status code</b> dice com'è andata: <b>200</b> ok, <b>201</b> creato, <b>401</b> non so chi sei, <b>403</b> non hai il permesso, <b>404</b> non trovato, <b>422</b> dati non validi, <b>429</b> troppe richieste, <b>500</b> errore del server.`,
          `<b>FastAPI</b> è il framework per scrivere backend in Python: asincrono e guidato dai type hints. <b>uvicorn</b> è il server che lo fa girare (un server <b>ASGI</b>, cioè per applicazioni Python asincrone). Lo avvii con <code>uv run uvicorn src.main:app --reload</code>.`],
      ex: `Finora chiamavi le API con HttpClient da Angular. Ora scrivi quelle API dall'altra parte del filo.`,
      k: [[`HTTP`, `Il protocollo con cui client e server si parlano.`], [`REST`, `Stile di API in cui ogni risorsa ha un indirizzo e i metodi HTTP dicono cosa farne.`], [`JSON`, `Formato testo per dati strutturati, lo stesso degli oggetti JS.`], [`Header`, `Intestazione della richiesta: coppie nome/valore (es. Authorization).`]] },
    { t: `Pydantic v2: dati che si controllano da soli`,
      p: [`Un modello Pydantic (<code>class ChatRequest(BaseModel)</code>) descrive la <b>forma</b> dei dati con i type hints, e la <b>verifica</b> quando crei l'oggetto. È il punto di ingresso dei dati: tutto ciò che arriva da fuori passa da qui. Se il modello accetta i dati, il resto del codice può fidarsi e non deve ricontrollarli.`,
          `Se arriva un dato sbagliato come parametro di un endpoint, FastAPI risponde da solo <b>422</b> con l'elenco dei campi sbagliati.`,
          `<code>Field(...)</code>: i tre puntini significano "obbligatorio". Aggiunge vincoli (<code>Field(gt=0)</code>, <code>max_length=2000</code>) e descrizioni.`,
          `Pydantic ha tipi già pronti con il controllo incluso: <code>EmailStr</code> (deve essere un'email valida), <code>UUID4</code>, <code>PositiveFloat</code> (numero maggiore di zero), <code>Literal["a","b"]</code> (solo quei valori). Invece di scrivere tu un <code>if</code> per controllare, usi il tipo giusto. Bonus: questi vincoli compaiono da soli nella documentazione su /docs, perché è lo stesso modello a validare e a descrivere l'API.`,
          `Due livelli che non si sovrappongono: <b>mypy</b> controlla il codice che scrivi tu, <b>Pydantic</b> i dati che arrivano da fuori.`],
      ex: `È come un'interface TS che però viene controllata anche a runtime, alla Zod. Il 422 è l'equivalente di un form Angular invalido, ma lato server.`,
      k: [[`Validazione`, `Verificare che i dati abbiano tipo e valori ammessi.`], [`Serializzazione`, `Trasformare un oggetto in un formato da spedire (es. JSON).`], [`Confine (boundary)`, `Il punto in cui i dati entrano dall'esterno: lì si controllano una volta per tutte.`]] },
    { t: `Validator e sintassi v2`,
      p: [`<code>@field_validator("campo")</code>: controlla un campo mentre il modello si costruisce. Vede quel campo più quelli già validati (in <code>info.data</code>).`,
          `<code>@model_validator(mode="after")</code>: gira quando il modello è completo e vede tutti i campi. Serve per le regole fra più campi (es. "data fine dopo data inizio").`,
          `Un validator può anche <b>normalizzare</b> (es. togliere spazi, mettere in maiuscolo). Se solleva <code>ValueError</code>, diventa un 422 che indica il campo.`,
          `Un validator <b>non fa I/O</b> (niente query al database): quella è logica di dominio, va nel service.`,
          `Sintassi v2 da usare sempre: <code>model_config</code> (non <code>class Config</code>), <code>.model_dump()</code> (non <code>.dict()</code>), <code>.model_validate()</code> (non <code>parse_obj()</code>). La vecchia sintassi in parte funziona ancora (con un avviso), ma alcune opzioni in v2 hanno cambiato nome: se scrivi il nome vecchio, Pydantic non dà errore e semplicemente non la applica. Il modello sembra configurato, ma non lo è.`,
          `Il nucleo di Pydantic v2 è scritto in Rust: molto più veloce della v1.`],
      ex: `field_validator ≈ un Validator su un singolo FormControl; model_validator ≈ un validator sul FormGroup intero.`,
      k: [[`Normalizzare`, `Portare un dato a una forma standard (es. "  mario " → "mario").`], [`Deprecato`, `Ancora funzionante ma destinato a sparire: non va più usato.`]] },
    { t: `Endpoint, router e response_model`,
      p: [`Un endpoint è una funzione con un decoratore: <code>@router.post("/chat", response_model=ChatResponse, status_code=201)</code>. Il decoratore descrive ciò che vede chi usa l'API (indirizzo, formato della risposta, status di successo); il corpo della funzione è l'implementazione, che puoi cambiare senza che il client se ne accorga.`,
          `<code>APIRouter(prefix="/api/chat", tags=["chat"])</code> raggruppa gli endpoint di una funzionalità (chat, categorize…). Il path nel decoratore è <b>relativo</b> al prefix: scriverlo intero produce un 404.`,
          `<code>response_model</code> è il <b>contratto della risposta</b>: valida l'uscita, <b>toglie i campi non dichiarati</b> e documenta. Esempio: il campo interno <code>tokens_used</code> non arriva al client se il modello di risposta non lo prevede. È anche una protezione contro le fughe di dati.`,
          `<code>main.py</code> <b>compone e basta</b>: crea l'app, registra i router, monta i middleware. Niente logica lì dentro.`,
          `Dai tipi, FastAPI genera la documentazione interattiva su <code>/docs</code> (Swagger UI) e <code>/redoc</code>.`],
      ex: `I router sono come i feature module di Angular: un file per area, poi tutto si registra in un punto.`,
      k: [[`OpenAPI`, `Lo standard che descrive un'API in un file; da qui nascono /docs e i client generati.`], [`Swagger UI`, `Pagina web che mostra gli endpoint e permette di provarli.`]] },
    { t: `Dependency Injection con Depends`,
      p: [`Un endpoint dichiara <b>cosa gli serve</b> (la sessione del DB, l'utente corrente, le impostazioni) con <code>Depends(funzione)</code>. FastAPI chiama la funzione e passa il risultato.`,
          `Le dipendenze sono <b>componibili</b>: una dipendenza può chiederne altre (l'utente corrente chiede il token, che chiede le Settings).`,
          `Le dipendenze comuni stanno in <code>src/api/deps.py</code>. Si <b>chiedono</b>, non si costruiscono dentro l'endpoint: così nei test le sostituisci con <code>app.dependency_overrides</code> senza toccare il codice.`,
          `Una dipendenza che solleva un errore <b>ferma la richiesta prima dell'endpoint</b>: è il posto giusto per i controlli d'accesso.`,
          `Caso tipico: se dichiari un'<b>intestazione obbligatoria</b> con <code>Header()</code> e manca, FastAPI risponde 422. Per un token mancante però serve <b>401</b>: allora la dichiari facoltativa e la controlli tu.`],
      ex: `È il <code>inject()</code> di Angular, ma per singola funzione invece che per classe. <code>dependency_overrides</code> ≈ i provider finti in <code>TestBed</code>.`,
      k: [[`Dependency Injection`, `Chi usa un oggetto non lo crea: lo riceve già pronto da fuori. Rende il codice testabile.`]] },
    { t: `Errori gestiti in un punto solo`,
      p: [`Il codice di business solleva <b>eccezioni di dominio</b> (in <code>src/exceptions.py</code>) con nomi chiari: <code>ChatSessionNotFoundError</code>, <code>RateLimitError</code>…`,
          `Ogni eccezione porta tre cose: <code>status_code</code> (lo decide chi conosce il dominio), <code>code</code> (codice stabile per il client, es. "SESSION_NOT_FOUND") e <code>message</code> (testo per una persona).`,
          `In <code>main.py</code> ci sono <b>tre handler</b> (<code>@app.exception_handler</code>):<br>1. per <code>AppError</code>: dà forma unica agli errori previsti;<br>2. per gli errori del framework (es. validazione): li porta nella stessa busta;<br>3. su <code>Exception</code>, come rete finale: risponde 500 e <b>scrive nel log</b> l'errore con il percorso della richiesta.`,
          `Così l'operatore vede "questa conversazione non esiste" invece di "errore interno", e il client riceve sempre lo stesso formato.`],
      ex: `Come un ErrorHandler/HttpInterceptor di Angular, ma lato server: una sola "busta" per tutti gli errori.`,
      k: [[`Exception handler`, `Funzione che intercetta un tipo di errore e lo trasforma in una risposta HTTP.`], [`Log`, `Registro di cosa succede nel server, per capire i problemi dopo.`]] },
    { t: `Middleware e async vs sync`,
      p: [`Un <b>middleware</b> avvolge <b>ogni</b> richiesta "a cipolla": codice prima di <code>await call_next(request)</code> all'andata, codice dopo al ritorno. Vede anche le richieste che non arrivano a nessun endpoint.`,
          `<b>Request-id</b>: un middleware assegna un codice unico a ogni richiesta e lo mette nei log e nella risposta, così puoi seguirla. È middleware e non <code>Depends</code> perché deve valere per tutte.`,
          `<b>CORS</b>: <code>CORSMiddleware</code> dice al <b>browser</b> quali siti possono chiamare l'API. Non protegge il server. Le origini si confrontano carattere per carattere: <code>http://localhost:4200</code> e <code>http://127.0.0.1:4200</code> sono origini diverse. Non usare <code>allow_origins=["*"]</code> ("tutti") insieme a <code>allow_credentials=True</code>: qualsiasi sito potrebbe chiamare l'API dal browser dell'utente usando i suoi cookie o token.`,
          `Endpoint <code>async def</code>: gira sull'event loop. Endpoint <code>def</code>: FastAPI lo esegue nel <b>thread pool</b> (40 thread, che sono anche il tetto di richieste sincrone contemporanee).`,
          `Il caso pericoloso è <code>async def</code> con dentro codice bloccante. Se devi usare una libreria solo sincrona, <code>def</code> è la scelta <b>meno</b> rischiosa. Regola del corso: sempre <code>async</code> per il codice nuovo.`],
      ex: `Il middleware è l'HttpInterceptor di Angular, ma dal lato di chi riceve.`,
      k: [[`CORS`, `Regola del browser: una pagina può chiamare un'API di un altro dominio solo se l'API lo permette.`], [`Thread pool`, `Un gruppo di thread pronti a eseguire funzioni sincrone.`], [`Origine`, `Protocollo + dominio + porta di una pagina, es. http://localhost:4200.`]] }
  ],
  flash: [
    [`422 vs 401 vs 403?`, `422 = dati non validi. 401 = non so chi sei (token assente o non valido). 403 = so chi sei ma non hai il permesso.`],
    [`A cosa serve <code>response_model</code>?`, `È il contratto della risposta: valida l'output, toglie i campi non dichiarati, documenta. Protegge dalle fughe di dati.`],
    [`<code>Field(...)</code>: cosa significano i tre puntini?`, `Che il campo è obbligatorio.`],
    [`<code>model_dump()</code> vs <code>.dict()</code>?`, `Sono la forma v2 e v1. Si scrive sempre model_dump(); .dict() funziona ancora ma è deprecato.`],
    [`<code>field_validator</code> vs <code>model_validator</code>?`, `Il primo controlla un campo durante la costruzione. Il secondo (mode="after") controlla più campi a modello completo.`],
    [`Cosa fa <code>Depends</code>?`, `Dependency Injection: FastAPI esegue la funzione indicata e passa il risultato all'endpoint. Nei test si sostituisce con dependency_overrides.`],
    [`Perché il request-id è un middleware e non un Depends?`, `Perché deve valere per ogni richiesta, anche quelle che non arrivano a nessun endpoint.`],
    [`Endpoint <code>def</code> sincrono: blocca il server?`, `No, FastAPI lo esegue nel thread pool. Il problema è codice bloccante dentro async def.`],
    [`Cosa fa <code>main.py</code>?`, `Compone: crea l'app, registra i router, monta middleware e handler. Niente logica.`]
  ],
  quiz: [
    { q: `Il client manda un JSON con un campo numerico scritto come "abc". Cosa risponde FastAPI senza codice extra?`,
      o: [`500`, `400`, `422 con il dettaglio degli errori`, `200 con il campo a null`], c: 2,
      w: `Pydantic valida il corpo e FastAPI trasforma l'errore in un 422 con la lista dei campi sbagliati.`,
      term: `<b>422 Unprocessable Entity</b>: <b>errore di validazione (validation error)</b> del <b>request body</b>.` },
    { q: `Vuoi che un campo interno <code>tokens_used</code> non arrivi mai al client. Cosa usi?`,
      o: [`Un middleware`, `Un <code>response_model</code> che non contiene quel campo`, `Un <code>field_validator</code>`, `Un exception handler`], c: 1,
      w: `response_model filtra l'output: i campi che non dichiara non vengono serializzati.`,
      term: `<b>response_model</b> fa da <b>output schema</b>: <b>filtraggio della risposta</b> e <b>serializzazione</b>.` },
    { q: `Dove va la logica che aggiunge un request-id a ogni richiesta?`,
      o: [`In ogni endpoint`, `In un middleware`, `Nel modello Pydantic`, `Nel repository`], c: 1,
      w: `Il middleware avvolge tutte le richieste: è il posto per le cose trasversali.`,
      term: `È una <b>cross-cutting concern</b> gestita da un <b>HTTP middleware</b>; il request-id serve per la <b>correlazione dei log (log correlation)</b>.` },
    { q: `Il token di autenticazione manca. Quale status è corretto?`,
      o: [`401`, `403`, `404`, `422`], c: 0,
      w: `401 = il server non sa chi sei. 403 si usa quando sa chi sei ma non hai il permesso.`,
      term: `<b>401 Unauthorized</b> = <b>non autenticato</b>; <b>403 Forbidden</b> = <b>autenticato ma non autorizzato</b>.` },
    { q: `Router con <code>prefix="/api/chat"</code> e decoratore <code>@router.post("/api/chat/send")</code>. Che indirizzo risponde?`,
      o: [`/api/chat/send`, `/api/chat/api/chat/send`, `/send`, `Errore all'avvio`], c: 1,
      w: `Il path del decoratore è relativo al prefix: va scritto solo <code>"/send"</code>. Altrimenti il client che chiama /api/chat/send riceve 404.`,
      term: `Il <b>prefix</b> dell'<b>APIRouter</b> si concatena al <b>path operation</b>: path <b>relativo</b>.` },
    { q: `Perché gli errori di business si trasformano in JSON in un handler globale e non in ogni endpoint?`,
      o: [`Per velocità`, `Per avere una forma di risposta uniforme e un solo posto da mantenere`, `Perché FastAPI lo impone`, `Per nascondere gli errori`], c: 1,
      w: `Un punto solo: stessa "busta" JSON per tutti gli errori, status coerenti, endpoint puliti.`,
      term: `<b>Gestione centralizzata degli errori (centralized error handling)</b> con <b>exception handler</b> che mappano <b>eccezioni di dominio</b> su status HTTP.` }
  ]
});

/* ============ GIORNATA 3 ============ */
DAYS.push({
  id: `g3`, n: 3, min: 20,
  title: `Database con SQLAlchemy e Alembic`,
  sub: `Salvare le conversazioni in PostgreSQL in modo asincrono e tipizzato`,
  map: {
    center: `Il database nel progetto`,
    flow: [`Endpoint<br><small>riceve la richiesta</small>`, `Service<br><small>decide e fa commit una volta</small>`, `Repository<br><small>l'unico che sa che c'è un DB</small>`, `AsyncSession<br><small>una per richiesta</small>`, `Engine + pool<br><small>connessioni riusate</small>`, `PostgreSQL`],
    branches: [
      { name: `ORM (SQLAlchemy 2.0)`, items: [
        `Una classe Python = una tabella; un oggetto = una riga.`,
        `<code>Mapped[str]</code> dichiara insieme il tipo per il DB e per mypy.`,
        `<code>select(Modello).where(...)</code> al posto di SQL scritto a mano: un nome sbagliato lo trova mypy.`,
        `<code>.scalars()</code> perché <code>execute()</code> restituisce tuple.`] },
      { name: `Connessioni`, items: [
        `URL con <code>postgresql+asyncpg://</code> (driver async).`,
        `<b>Pool</b>: connessioni tenute aperte e riusate, dimensionate sul limite di Postgres.`,
        `<code>pool_pre_ping</code>: scarta le connessioni morte.`,
        `<code>expire_on_commit=False</code>: oggetti leggibili dopo il commit.`] },
      { name: `Transazioni`, items: [
        `<code>flush</code>: manda l'SQL, i vincoli scattano, ma solo tu vedi.`,
        `<code>commit</code>: conferma e rende visibile a tutti.`,
        `Senza commit: rollback, senza errori.`,
        `Il commit sta nel service, alla fine.`] },
      { name: `Relazioni in async`, items: [
        `Caricamento pigro vietato → errore <code>MissingGreenlet</code>.`,
        `<code>selectinload</code>: seconda query <code>IN (...)</code>, per uno-a-molti.`,
        `<code>joinedload</code>: <code>JOIN</code>, per molti-a-uno.`] },
      { name: `Alembic`, items: [
        `Migration = una versione dello schema, come un commit.`,
        `Ciclo in 3 passi: genera, <b>leggi</b>, applica.`,
        `<code>alembic_version</code> ricorda dove sei arrivato.`,
        `Una migration già applicata non si modifica.`] }
    ]
  },
  slides: [
    { t: `Perché un database, e cos'è un ORM`,
      p: [`Un database dà quello che un file non può: <b>accessi contemporanei</b> senza perdere dati, <b>ricerca veloce</b> con gli indici, e <b>integrità</b>: una chiave esterna rifiuta il dato incoerente (es. un messaggio di una chat che non esiste).`,
          `Un database relazionale (qui <b>PostgreSQL</b>) salva i dati in <b>tabelle</b>: righe e colonne. Si interroga con <b>SQL</b>. L'SQL si scrive in un ordine e si esegue in un altro: prima <code>FROM</code>, poi <code>WHERE</code>, poi <code>ORDER BY</code>, poi <code>LIMIT</code>.`,
          `Un <b>ORM</b> ti fa lavorare con <b>classi Python</b> invece che con SQL scritto a mano: la classe <code>ChatSession</code> corrisponde alla tabella <code>chat_sessions</code>, un oggetto a una riga.`,
          `<b>SQLAlchemy 2.0</b> è l'ORM di riferimento in Python. Con il driver <b>asyncpg</b> lavora in modo asincrono.`,
          `L'ORM genera l'SQL ma non ti esonera dal leggerlo: un problema come la query N+1 lo riconosce solo chi guarda cosa è stato generato.`],
      ex: `SQLAlchemy ≈ TypeORM o Prisma nel mondo Node.`,
      k: [[`ORM`, `Object-Relational Mapper: traduce fra oggetti del linguaggio e righe del database.`], [`Driver`, `La libreria che parla fisicamente con il database (asyncpg per Postgres async).`], [`Chiave esterna`, `Colonna che punta alla chiave primaria di un'altra tabella; il DB rifiuta valori che non esistono.`], [`Query N+1`, `Una query per la lista più una per ogni elemento: lentissimo con tanti dati.`]] },
    { t: `Engine, pool e sessione`,
      p: [`L'<b>engine</b> (<code>create_async_engine</code>) gestisce le connessioni al DB. L'URL deve iniziare con <code>postgresql+asyncpg://</code>: se è sbagliato, l'app si ferma all'avvio.`,
          `L'engine tiene le connessioni aperte e le riusa: è il <b>connection pool</b>. <code>pool_size</code> (connessioni fisse) + <code>max_overflow</code> (extra nei picchi), moltiplicato per il numero di istanze dell'app, deve stare <b>sotto il limite</b> di connessioni di Postgres.`,
          `<code>pool_pre_ping=True</code> controlla la connessione prima di usarla: evita l'errore casuale alla prima richiesta dopo un periodo di calma.`,
          `La <b>sessione</b> (<code>AsyncSession</code>) è la "conversazione" con il DB per una richiesta. La dà all'endpoint la dipendenza <code>get_db</code>, scritta con <code>yield</code>: si apre all'inizio, si chiude alla fine. <b>Una per richiesta, mai globale</b>, perché ha uno stato.`,
          `<code>expire_on_commit=False</code>: dopo il commit l'oggetto resta leggibile. Con il default (True), in async il primo accesso a un attributo dopo il commit causa l'errore <code>MissingGreenlet</code>.`],
      ex: `Il pool è come un parcheggio di connessioni pronte: invece di aprirne una nuova ogni volta (lento), ne prendi una libera.`,
      k: [[`Connessione`, `Un canale aperto fra l'app e il database. Aprirla costa tempo.`], [`Sessione`, `Unità di lavoro: tiene traccia degli oggetti letti e modificati fino al commit.`], [`Istanza`, `Una copia dell'app in esecuzione; in produzione spesso ce ne sono più di una.`]] },
    { t: `Modelli tipizzati e query`,
      p: [`Un modello è una classe in <code>src/db/models.py</code>: <code>id: Mapped[str] = mapped_column(primary_key=True)</code>.`,
          `<code>Mapped[tipo]</code> dichiara insieme il tipo della colonna (per SQLAlchemy) e il tipo dell'attributo (per mypy). <code>mapped_column</code> contiene le opzioni: chiave primaria, indice, default.`,
          `Le decisioni del corso nei modelli: id <b>UUID</b> generati da Python; <b>indice</b> sulle colonne usate nel <code>where</code>; <code>Text</code> per le risposte del modello (lunghezza libera); <b>costo salvato su ogni messaggio</b> (così per sapere quanto è costata una conversazione basta sommare i costi dei suoi messaggi con una query SQL); date con <code>DateTime(timezone=True)</code>.`,
          `Le query si costruiscono con <code>select()</code>: <code>select(ChatSession).where(ChatSession.id == sid)</code>. Se rinomini un campo, se ne accorge mypy.`,
          `Si eseguono con <code>(await session.execute(stmt)).scalars().all()</code>. <code>.scalars()</code> serve perché <code>execute()</code> restituisce tuple anche con un'entità sola. La vecchia <code>.query()</code> in async non esiste.`],
      ex: `È un query builder tipizzato: niente stringhe SQL, l'IDE completa i campi.`,
      k: [[`Chiave primaria`, `La colonna che identifica in modo unico ogni riga (es. id).`], [`Indice`, `Struttura che velocizza la ricerca su una colonna, come l'indice di un libro.`], [`UUID`, `Identificativo casuale di 128 bit, praticamente unico al mondo.`]] },
    { t: `Relazioni: caricare i dati collegati`,
      p: [`Una sessione di chat ha molti messaggi: è una <b>relazione uno-a-molti</b>. Un messaggio appartiene a una sessione: dal suo lato è <b>molti-a-uno</b>.`,
          `La relazione si dichiara con <code>relationship</code>, con <code>cascade</code> (cancelli la chat, spariscono i messaggi) e <code>order_by</code> (messaggi in ordine).`,
          `Nel mondo sincrono, leggere <code>sessione.messages</code> fa partire una query "di nascosto" (<b>lazy loading</b>). In async questo <b>non è permesso</b>: errore <code>MissingGreenlet</code>.`,
          `Quindi la relazione va caricata <b>subito</b>, nella query stessa:<br>• <code>selectinload</code>: una seconda query con <code>IN (id1, id2, …)</code>. Giusto per l'<b>uno-a-molti</b>.<br>• <code>joinedload</code>: una <code>JOIN</code> nella stessa query. Giusto per il <b>molti-a-uno</b>; sull'uno-a-molti ripeterebbe la riga della chat per ogni messaggio.`],
      ex: `In async ogni accesso al DB deve essere un <code>await</code> visibile: niente query nascoste dentro un getter.`,
      k: [[`Lazy loading`, `Caricamento pigro: i dati collegati si leggono solo quando li usi.`], [`Eager loading`, `Caricamento anticipato: li leggi subito insieme all'oggetto principale.`], [`JOIN`, `Operazione SQL che unisce righe di due tabelle collegate.`]] },
    { t: `Transazioni: flush e commit`,
      p: [`Una <b>transazione</b> è un gruppo di modifiche che vale "tutto o niente".`,
          `<code>session.flush()</code> manda l'SQL al DB <b>dentro</b> la transazione aperta: la tua sessione vede le righe, gli altri no. È qui che il DB controlla i vincoli (es. valore unico, chiave esterna). Utile: se qualcosa non va, l'errore arriva subito dopo l'operazione che l'ha causato, invece che al commit finale dove non capisci quale scrittura era sbagliata.`,
          `<code>session.commit()</code> chiude la transazione e rende tutto visibile a tutti.`,
          `Se chiudi la sessione <b>senza commit</b>, tutto viene annullato (<b>rollback</b>) senza nessun avviso. "Senza commit non è successo niente."`,
          `Il commit lo fa il <b>service</b>, una volta sola, alla fine dell'operazione. Esempio: salvare il messaggio dell'utente e la risposta del modello sono due scritture; un commit unico le rende <b>atomiche</b>. Se il commit fosse nel repository, non potresti comporre due operazioni in una.`],
      ex: `flush ≈ "salva in bozza", commit ≈ "pubblica".`,
      k: [[`Transazione`, `Insieme di operazioni confermate o annullate insieme.`], [`Rollback`, `Annullare tutte le modifiche della transazione.`], [`Atomico`, `Che avviene per intero o per niente, mai a metà.`], [`Vincolo`, `Regola del DB (es. valore unico, non nullo) verificata a ogni scrittura.`]] },
    { t: `Alembic: versioni dello schema`,
      p: [`Quando cambi i modelli (nuova colonna, nuova tabella) il database va aggiornato. Una <b>migration</b> è uno script che porta lo schema da una versione alla successiva.`,
          `Il ciclo ha <b>tre passi</b>: <code>alembic revision --autogenerate -m "..."</code> confronta modelli e DB e <b>propone</b> una migration → tu la <b>leggi</b> → <code>alembic upgrade head</code> la applica.`,
          `Perché leggerla: una rinomina viene vista come "aggiungi colonna + elimina colonna", cioè <b>perdi i dati</b>. Va corretta a mano con <code>alter_column</code>.`,
          `In <code>env.py</code> la riga <code>from src.db import models</code> è essenziale: senza, Alembic non vede i modelli e su un DB già popolato propone di <b>cancellare tutte le tabelle</b>.`,
          `Il DB ricorda dove è arrivato nella tabella <code>alembic_version</code> (una riga). Una migration già applicata <b>non si modifica</b>: se serve, se ne scrive un'altra.`,
          `L'indirizzo del DB non sta in <code>alembic.ini</code> (che è su Git): <code>env.py</code> lo prende da Settings. Su un progetto async si crea con <code>alembic init -t async</code>.`,
          `In sviluppo Postgres gira in Docker (immagine <code>pgvector/pgvector:pg16</code>) con un <b>volume</b>, così i dati non spariscono a ogni riavvio.`],
      ex: `Una migration è come un commit Git, ma per la struttura del database. Equivale a Flyway o Liquibase nel mondo Java.`,
      k: [[`Migration`, `Script versionato che modifica lo schema del database.`], [`Schema`, `La struttura del database: tabelle, colonne, indici.`], [`Volume Docker`, `Spazio su disco che sopravvive quando il container viene ricreato.`]] },
    { t: `Repository pattern: livelli separati`,
      p: [`Il <b>repository</b> (<code>src/db/repos.py</code>, es. <code>ChatRepository</code>) è <b>l'unico posto</b> che sa che esiste un database. Espone metodi come <code>by_id</code>, <code>create_session</code>, <code>add_message</code>.`,
          `Il <b>service</b> (<code>src/services/chat_service.py</code>) contiene la logica: cosa significa una conversazione, cosa salvare, e quando la transazione finisce (commit).`,
          `L'<b>endpoint</b> (<code>src/api/chat.py</code>) riceve la richiesta, chiama il service e restituisce la risposta.`,
          `Dato che <code>Depends</code> calcola ogni dipendenza una volta per richiesta, repository e service ricevono la <b>stessa sessione</b>, quindi la stessa transazione.`,
          `Vantaggio: al Giorno 9 il service si testa con un repository finto, senza Postgres acceso; e si può cambiare il DB senza toccare la logica.`],
      ex: `Endpoint → service → repository è come componente → service → HttpClient in Angular: ogni livello fa una cosa sola.`,
      k: [[`Repository`, `Oggetto che nasconde come si leggono e scrivono i dati.`], [`Layer`, `Livello dell'architettura con una responsabilità precisa.`]] }
  ],
  flash: [
    [`Cos'è un ORM?`, `Una libreria che traduce fra classi del linguaggio e tabelle del database (SQLAlchemy ≈ TypeORM/Prisma).`],
    [`Cosa dichiara <code>Mapped[str]</code>?`, `Insieme il tipo della colonna per SQLAlchemy e il tipo dell'attributo per mypy.`],
    [`Perché serve <code>.scalars()</code>?`, `Perché execute() restituisce tuple anche quando selezioni una sola entità.`],
    [`flush vs commit?`, `flush manda l'SQL nella transazione aperta (solo tu vedi, i vincoli scattano). commit conferma e rende visibile a tutti.`],
    [`Chi fa il commit, e perché?`, `Il service, una volta alla fine: rende atomiche più scritture. Nel repository non potresti comporle.`],
    [`Perché <code>MissingGreenlet</code>?`, `Un caricamento pigro (lazy) in async. Usa selectinload/joinedload, e expire_on_commit=False.`],
    [`selectinload vs joinedload?`, `selectinload = seconda query IN(...), per uno-a-molti. joinedload = JOIN nella stessa query, per molti-a-uno.`],
    [`Il ciclo di Alembic?`, `Genera (revision --autogenerate), leggi, applica (upgrade head). Una rinomina diventa add + drop: va corretta.`],
    [`Come si dimensiona il pool?`, `(pool_size + max_overflow) × istanze sotto il limite di connessioni di Postgres.`]
  ],
  quiz: [
    { q: `Chiudi la sessione dopo aver aggiunto righe e fatto <code>flush</code>, ma senza <code>commit</code>. Cosa resta nel DB?`,
      o: [`Tutto, il flush basta`, `Niente: rollback silenzioso`, `Metà delle righe`, `Un errore che blocca l'app`], c: 1,
      w: `Il flush lavora dentro la transazione. Senza commit, alla chiusura la transazione si annulla senza avvisi.`,
      term: `<b>Rollback implicito</b> alla chiusura della sessione; la <b>transaction boundary</b> va decisa nel service.` },
    { q: `Una chat ha molti messaggi. In async vuoi leggerli insieme alla sessione. Cosa usi?`,
      o: [`Accedo a <code>sessione.messages</code> e basta`, `<code>selectinload(ChatSession.messages)</code>`, `<code>joinedload</code> sempre`, `<code>.query()</code>`], c: 1,
      w: `Per l'uno-a-molti selectinload fa una seconda query IN(...) ed evita righe duplicate; il caricamento pigro in async fallisce.`,
      term: `<b>Eager loading</b> con strategia <b>selectin</b>; evita il problema <b>N+1</b> e l'errore <b>MissingGreenlet</b>.` },
    { q: `Rinomini una colonna e lanci autogenerate. Cosa devi controllare?`,
      o: [`Niente, Alembic capisce le rinomine`, `Che non abbia generato add_column + drop_column, che cancellerebbe i dati`, `Che il file .env sia aggiornato`, `Che il pool sia abbastanza grande`], c: 1,
      w: `Autogenerate non distingue una rinomina da "nuova colonna + colonna rimossa": la migration va corretta a mano con alter_column.`,
      term: `L'<b>autogenerate</b> produce un <b>diff dello schema</b>; una rinomina richiede <code>op.alter_column</code> per evitare <b>perdita di dati (data loss)</b>.` },
    { q: `Chi dovrebbe sapere che esiste un database?`,
      o: [`L'endpoint`, `Il service`, `Solo il repository`, `Tutti i livelli`], c: 2,
      w: `Il repository incapsula l'accesso ai dati; service ed endpoint lavorano con i suoi metodi.`,
      term: `<b>Repository pattern</b> e <b>separazione dei livelli (layered architecture)</b>, con <b>dependency inversion</b> per i test.` },
    { q: `Hai 3 istanze dell'app, ognuna con <code>pool_size=10</code> e <code>max_overflow=10</code>. Quante connessioni può aprire al massimo l'insieme?`,
      o: [`10`, `20`, `60`, `30`], c: 2,
      w: `(10 + 10) × 3 = 60. Questo numero deve stare sotto il limite di connessioni di Postgres.`,
      term: `Dimensionamento del <b>connection pool</b> rispetto a <code>max_connections</code> del database.` },
    { q: `Dimentichi <code>from src.db import models</code> in <code>env.py</code> e lanci autogenerate su un DB già popolato. Cosa rischi?`,
      o: [`Niente`, `Una migration che cancella tutte le tabelle`, `Un errore di sintassi`, `Una migration duplicata`], c: 1,
      w: `Senza import Alembic vede zero modelli: per lui le tabelle esistenti "non dovrebbero esserci" e propone di eliminarle.`,
      term: `<b>target_metadata</b> vuoto: il <b>diff</b> fra <b>metadata</b> e database produce <code>drop_table</code> per tutto.` }
  ]
});

/* ============ GIORNATA 4 ============ */
DAYS.push({
  id: `g4`, n: 4, min: 20,
  title: `Integrare un LLM`,
  sub: `OpenAI e Anthropic dietro un'astrazione, output strutturato, streaming, tool use e tetto di spesa`,
  map: {
    center: `Un LLM come servizio esterno`,
    branches: [
      { name: `4 verità`, items: [
        `<b>Non-deterministico</b>: la stessa domanda può dare risposte diverse, anche con temperature 0.`,
        `<b>Costa</b> a ogni token, in entrata e (di più) in uscita.`,
        `<b>Lento</b>: da 0,5 a 5 secondi per risposta.`,
        `<b>Fallisce</b>: troppe richieste (429), contesto troppo lungo, filtro sui contenuti, rete.`] },
      { name: `Chiamare il modello`, items: [
        `Client <b>async</b> creato una volta e riusato: <code>AsyncOpenAI</code>, <code>AsyncAnthropic</code>.`,
        `Timeout scelto da te (il default è 10 minuti); i retry li fa già l'SDK.`,
        `Tre parametri decidono comportamento e conto: <code>model</code>, <code>max_tokens</code>, <code>temperature</code>.`,
        `Registra <code>usage</code> (token usati) da subito.`] },
      { name: `Astrazione`, items: [
        `<code>Protocol LLMProvider</code> con <code>complete</code> e <code>stream</code>.`,
        `<code>LLMResponse</code>: testo + token + costo + modello.`,
        `Factory: sceglie il fornitore dalla config; se il nome del modello è sbagliato dà subito un errore chiaro.`,
        `Prompt in file versionati in <code>src/llm/prompts/</code>.`] },
      { name: `Output strutturato`, items: [
        `<b>Instructor</b> + modello Pydantic: il risultato è un oggetto valido.`,
        `<code>Literal</code> chiude le categorie possibili.`,
        `Se non valida, ritenta: ogni tentativo è pagato.`] },
      { name: `Streaming`, items: [
        `<code>stream=True</code> + <code>async for</code>.`,
        `<b>SSE</b>: i pezzi arrivano al client mentre vengono generati.`,
        `Il costo si salva una volta, alla fine.`] },
      { name: `Tool use + costi`, items: [
        `Il modello <b>propone</b> una chiamata, il tuo codice valida, autorizza, esegue.`,
        `Due chiamate al modello: doppio costo e doppia latenza.`,
        `<code>CostTracker</code>: spesa di oggi controllata <b>prima</b> della chiamata → 429.`] }
    ]
  },
  slides: [
    { t: `LLM, token e prompt: le basi`,
      p: [`Un <b>LLM</b> riceve testo e genera testo, un pezzo alla volta, scegliendo ogni volta il pezzo successivo più adatto. Ogni pezzo è un <b>token</b>: un frammento di parola. In italiano un token vale circa 3 caratteri.`,
          `Si paga <b>per token</b>, sia in entrata (il prompt) sia in uscita (la risposta). L'uscita costa di più: con prezzi diversi per input e output, un prezzo unico darebbe un report dei costi sbagliato.`,
          `La conversazione si manda come lista di <b>messaggi</b> con un ruolo. Il <b>system</b> dà ruolo e regole ("sei l'assistente di LipariBank, rispondi solo su…"); lo <b>user</b> porta la domanda; l'<b>assistant</b> sono le risposte precedenti. Il modello di solito segue il system prompt, ma non è obbligato: una domanda furba dell'utente può fargli ignorare le regole. Quindi i controlli importanti (permessi, limiti) vanno nel codice, non solo nel prompt.`,
          `<b>temperature</b>: quanto il modello si allontana dalla scelta più probabile. Bassa per classificare ed estrarre, più alta per scrivere testo. Anche a 0 non è del tutto deterministico.`,
          `<b>max_tokens</b>: tetto sulla lunghezza della risposta, quindi anche sul costo. Se lo raggiunge, la risposta si tronca e <code>finish_reason</code> vale <code>"length"</code>: va controllato.`,
          `<b>model</b>: la scelta che pesa di più sul conto. Regola: usa il modello più piccolo (e quindi più economico) che risponde abbastanza bene ai tuoi test di qualità (gli <b>eval</b>, Giorno 9).`],
      ex: `Un LLM è un'API esterna come le altre che chiamavi da Angular, solo che è lenta, costosa e non sempre risponde uguale.`,
      k: [[`Token`, `Unità di testo che il modello legge e scrive; la base per prezzo e limiti.`], [`Prompt`, `Il testo di istruzioni e domanda che mandi al modello.`], [`Context window`, `Quanti token il modello può considerare in una volta, prompt e risposta insieme.`]] },
    { t: `Le quattro verità di un LLM`,
      p: [`<b>Non-determinismo</b>: la stessa domanda può dare risposte diverse. I test non possono confrontare stringhe esatte: devono accettare la variabilità e misurarla.`,
          `<b>Costo</b>: su gpt-4o-mini, al listino del corso, un milione di token costa 0,14 € in entrata e 0,56 € in uscita. Un milione di utenti, cento conversazioni al giorno da mille token: oltre 20.000 € al giorno. Il tetto di spesa è obbligatorio. La tabella dei prezzi nel codice (<code>PRICING</code>) è copiata dal listino a una certa data: quando il fornitore cambia i prezzi va aggiornata.`,
          `<b>Latenza</b>: da mezzo secondo a cinque secondi. Chi aspetta davanti a una pagina vuota ha bisogno dello streaming.`,
          `<b>Modi di fallire</b>: troppe richieste (<b>429</b>, rate limit), contesto troppo lungo, filtro sui contenuti, rete. Tre di questi arrivano come errore (eccezione). Il filtro sui contenuti no: la chiamata "riesce", ma la risposta è vuota o rifiutata. Va controllato leggendo la risposta (es. <code>finish_reason</code>).`,
          `Sul 429 l'SDK riprova da solo, due volte, aspettando sempre di più e rispettando <code>Retry-After</code>. Se aggiungi anche un tuo retry intorno, i tentativi si moltiplicano: 3 tuoi × 3 dell'SDK = fino a 9 chiamate per una sola richiesta.`,
          `<b>Contesto troppo lungo</b>: si tengono il system prompt e solo gli ultimi N messaggi (la <code>FINESTRA</code> del service).`],
      k: [[`Latenza`, `Tempo fra la richiesta e la risposta.`], [`Rate limit`, `Limite di richieste al minuto imposto dal fornitore.`], [`Retry con backoff`, `Riprovare aspettando ogni volta un po' di più.`]] },
    { t: `Chiamare OpenAI e Anthropic`,
      p: [`Esiste solo il client <b>async</b>, ed è un oggetto <b>riusato</b>: <code>AsyncOpenAI(api_key=..., timeout=..., max_retries=...)</code> si crea una volta e si passa con <code>Depends</code>. Sempre <code>await</code>.`,
          `Il <b>timeout</b> di default è di dieci minuti: va scelto tu, nella factory.`,
          `<code>AsyncAnthropic</code> diverge da OpenAI su alcuni punti:<br>• il system prompt è un <b>parametro separato</b>, non un messaggio;<br>• la risposta è una <b>lista di blocchi</b> (testo, richiesta di tool…) da leggere in modo diverso;<br>• i token si contano con nomi diversi;<br>• <code>max_tokens</code> è <b>obbligatorio</b>.`,
          `Nessuna di queste differenze va sparsa nel codice dell'app: le assorbe l'<b>astrazione</b> (slide successiva).`,
          `<code>usage</code> (token in entrata e in uscita) va registrato <b>dalla prima chiamata</b>: senza, al Giorno 9 non c'è report dei costi.`],
      ex: `Come creare un solo HttpClient configurato e iniettarlo, invece di crearne uno a ogni chiamata.`,
      k: [[`Client`, `Oggetto che sa parlare con un servizio esterno (indirizzo, chiave, timeout).`], [`Timeout`, `Tempo massimo di attesa, oltre il quale si rinuncia con un errore.`]] },
    { t: `Astrazione provider-agnostic e factory`,
      p: [`Per non legarti a un fornitore scrivi un <b>contratto</b>, cioè l'elenco dei metodi che ogni fornitore deve avere: <code>class LLMProvider(Protocol)</code> con due metodi, <code>complete</code> (risposta intera) e <code>stream</code> (risposta a pezzi).`,
          `Un <code>Protocol</code> è <b>tipizzazione strutturale</b>: le implementazioni non ereditano niente, basta che abbiano quei metodi. Anche un provider finto nei test soddisfa il contratto.`,
          `Il contratto vero è il dato <code>LLMResponse</code>: oltre al testo contiene <b>token, costo e modello</b>. Così ogni chiamata, anche in streaming, porta con sé il suo costo.`,
          `<code>OpenAIProvider</code> e <code>AnthropicProvider</code> traducono il contratto nella "lingua" del fornitore.`,
          `Una <b>factory</b> (<code>src/llm/factory.py</code>) sceglie il fornitore dalla configurazione: cambiarlo è una riga. Se nella config c'è un modello che non conosce, dà subito un errore chiaro invece di usarne un altro di nascosto.`,
          `Questo rende possibile il <b>fallback</b>: se il fornitore principale non risponde, si passa al secondo. Attenzione: il modello di riserva risponde in modo diverso (stile, qualità, formato), e questo succede proprio durante un guasto, quando è più difficile accorgersene. Il fallback va provato prima, non scoperto in produzione.`],
      ex: `<code>Protocol</code> è un'interface TS con tipizzazione strutturale: basta avere quei metodi, non serve "implements". La factory è come un provider Angular con <code>useFactory</code>.`,
      k: [[`Astrazione`, `Un contratto comune che nasconde i dettagli delle diverse implementazioni.`], [`Factory`, `Funzione che decide quale oggetto creare.`], [`Fallback`, `Piano B automatico quando il servizio principale fallisce.`]] },
    { t: `Prompt versionati`,
      p: [`I prompt sono <b>codice</b>: cambiano il comportamento dell'app, e cambiano più spesso del codice stesso.`,
          `Per questo stanno in file dentro <code>src/llm/prompts/</code>, con la <b>versione nel nome</b> (es. <code>categorize_v2</code>), e si caricano con <code>src/llm/prompt.py</code>.`,
          `Un prompt tipico ha sezioni chiare: ruolo, <b>Rules</b> (cosa fare e non fare), <b>Style</b> (tono e formato).`,
          `Vantaggi: il diff mostra cosa è cambiato nelle istruzioni; si rivedono in una pull request; e il numero di versione permette di confrontarne due con un <b>eval</b> sulle stesse domande di prova.`],
      ex: `Come tenere i template in file separati invece che come stringhe sparse nei componenti.`,
      k: [[`Eval`, `Test di qualità per un LLM: un insieme di casi e una misura dei risultati.`], [`Pull request`, `Richiesta di unire modifiche al codice principale, con revisione di un collega.`]] },
    { t: `Output strutturato con Instructor`,
      p: [`Spesso non vuoi testo libero ma <b>dati</b>: es. categorizzare un movimento bancario in una categoria fra un elenco fisso.`,
          `<b>Instructor</b> prende un modello Pydantic (<code>CategorizeResponse</code>), ne ricava lo schema, lo impone al LLM e <b>valida</b> la risposta.`,
          `Il risultato <b>è</b> un oggetto <code>CategorizeResponse</code> valido, non un dict né una stringa "probabilmente JSON". Senza Instructor chiederesti JSON nel prompt e speri che il testo sia valido. Con Instructor la risposta o è un oggetto corretto, o è un errore: non esiste il caso "testo quasi giusto".`,
          `Se la risposta non è valida, Instructor <b>ritenta</b> rimandando l'errore al modello perché lo corregga. Ogni tentativo è una chiamata <b>pagata</b>.`,
          `Il valore sta nello <b>schema</b>: <code>Literal["UTILITIES", "STIPENDIO", …]</code> chiude l'elenco e impedisce categorie inventate; nomi chiari e <code>description</code> sui campi riducono i retry.`],
      ex: `È come tipizzare la risposta di un <code>http.get&lt;T&gt;()</code>, ma con una validazione vera: se non rispetta T, si riprova.`,
      k: [[`Schema`, `Descrizione formale della forma dei dati (campi, tipi, valori ammessi).`], [`Structured output`, `Risposta del modello in un formato dati preciso, invece che testo libero.`], [`Tassonomia`, `L'elenco chiuso di categorie ammesse.`]] },
    { t: `Streaming con SSE`,
      p: [`Cinque secondi di schermo vuoto sono inaccettabili. Con lo <b>streaming</b> il modello manda la risposta a pezzi mentre la genera. Non accelera la risposta totale: fa arrivare prima il <b>primo carattere</b>, che è la differenza fra "sta pensando" e "è rotto".`,
          `Lato Python: <code>stream=True</code> e <code>async for chunk in stream</code>. Il provider espone una funzione <code>async def</code> con <code>yield</code> (un <code>AsyncGenerator</code>) che produce i pezzi uno alla volta.`,
          `Lato HTTP: i pezzi arrivano al client con <b>Server-Sent Events (SSE)</b>, un flusso di messaggi dal server al client su una sola connessione. Per provarlo da terminale: <code>curl -N</code>.`,
          `Regole: i controlli (es. la conversazione esiste?) si fanno <b>prima</b> che lo stream parta, perché lo status code (200, 404…) viaggia insieme al primo pezzo: dopo, non si può più cambiare in 404; il costo si salva <b>una volta</b>, dopo il ciclo, mai dentro.`,
          `In streaming il conteggio dei token arriva solo se lo chiedi: <code>stream_options={"include_usage": True}</code>. Altrimenti la contabilità si interrompe proprio sull'endpoint più usato.`],
      ex: `Un AsyncGenerator assomiglia a un Observable RxJS che emette valori nel tempo. SSE è una connessione che resta aperta e "spinge" eventi.`,
      k: [[`SSE`, `Server-Sent Events: standard per inviare eventi dal server al browser su HTTP.`], [`AsyncGenerator`, `Funzione asincrona che produce una serie di valori nel tempo.`], [`Chunk`, `Un pezzo della risposta in streaming.`]] },
    { t: `Tool use e tetto di spesa`,
      p: [`Con il <b>tool use</b> (function calling) dai al modello l'elenco degli strumenti disponibili: nome, <b>descrizione</b>, parametri (<code>TOOLS_SCHEMA</code>).`,
          `Il modello <b>non esegue</b> niente: <b>propone</b> una chiamata con i suoi argomenti. Il tuo codice la <b>valida</b>, controlla che sia <b>autorizzata</b>, la esegue e gli rimanda il risultato. Sono <b>due chiamate</b> al modello: doppio costo e doppia latenza. Se sai già quali dati servono, recuperali tu con una query e mettili nel prompt: il tool use serve quando è il modello a dover decidere cosa cercare.`,
          `Gli argomenti vengono da un sistema probabilistico: un <code>account_id</code> proposto dal modello <b>non è un input autenticato</b>. L'autorizzazione si verifica sempre sull'operatore della richiesta, contro i conti del suo portafoglio.`,
          `La qualità dipende dalle <code>description</code>: sono l'unica cosa che il modello legge per scegliere. Pochi strumenti, ben distinti.`,
          `<b>Cost guardrail</b> (<code>CostTracker</code>): prima di ogni chiamata si somma quanto si è speso oggi (possibile perché il costo è salvato su ogni messaggio). Oltre il tetto si risponde <b>429</b> con <code>Retry-After</code> e il modello non viene chiamato. Bloccare le richieste è l'ultima difesa: prima di arrivarci conviene risparmiare (passare a un modello più economico, accorciare le risposte).`],
      ex: `Il modello è come un collega che dice "chiameresti questa API con questi parametri?". Sei tu a decidere se farlo.`,
      k: [[`Tool use`, `Il modello chiede di eseguire funzioni del tuo codice per ottenere dati o compiere azioni.`], [`Guardrail`, `Controllo di sicurezza che blocca un comportamento indesiderato (qui: spendere troppo).`], [`Retry-After`, `Header che dice al client dopo quanto riprovare.`]] }
  ],
  flash: [
    [`Cos'è un token?`, `Un frammento di testo (in italiano circa 3 caratteri). È l'unità con cui il modello legge, scrive e si fa pagare.`],
    [`temperature = 0 rende il modello deterministico?`, `No. Lo rende più prevedibile, ma la stessa domanda può comunque dare risposte diverse.`],
    [`<code>finish_reason == "length"</code>?`, `La risposta è stata troncata perché ha raggiunto max_tokens.`],
    [`Tre differenze di Anthropic rispetto a OpenAI?`, `System prompt come parametro separato, risposta come lista di blocchi, max_tokens obbligatorio (e conteggio token con nomi diversi).`],
    [`Perché un'astrazione provider-agnostic?`, `Un Protocol con complete/stream e un'implementazione per fornitore: cambi fornitore o fai fallback dalla configurazione.`],
    [`Cosa contiene <code>LLMResponse</code>?`, `Testo, token, costo e modello: ogni chiamata porta con sé il suo costo.`],
    [`Cosa fa Instructor?`, `Impone uno schema Pydantic al modello, valida la risposta e ritenta inviando l'errore. Ogni tentativo costa.`],
    [`Lo streaming rende la risposta più veloce?`, `No: il tempo totale è simile, ma il primo carattere arriva molto prima.`],
    [`Nel tool use chi esegue la funzione?`, `Il tuo codice. Il modello propone nome e argomenti; tu validi, autorizzi, esegui e restituisci il risultato.`],
    [`Quando si controlla il tetto di spesa?`, `Prima di chiamare il modello. Se superato: 429 con Retry-After.`]
  ],
  quiz: [
    { q: `Vuoi classificare transazioni in categorie fisse. Che temperature scegli?`,
      o: [`Alta, per creatività`, `Bassa`, `Non importa`, `Negativa`], c: 1,
      w: `Per estrarre o classificare serve la risposta più probabile e stabile: temperatura bassa.`,
      term: `<b>Temperatura bassa</b> per task di <b>classificazione/estrazione</b>; più alta per <b>generazione creativa</b>. Si parla di <b>sampling</b>.` },
    { q: `Il modello risponde con <code>finish_reason == "length"</code>. Cosa è successo?`,
      o: [`Ha finito normalmente`, `La risposta è stata troncata perché ha raggiunto max_tokens`, `Ha chiamato un tool`, `Il filtro contenuti l'ha bloccata`], c: 1,
      w: `"length" significa che il limite max_tokens è stato raggiunto prima della fine naturale.`,
      term: `<b>Output troncato (truncation)</b> per <b>max_tokens</b>; <code>finish_reason</code> è lo <b>stop reason</b> della generazione.` },
    { q: `Nel tool use, il modello chiede di leggere i movimenti del conto di un cliente. Cosa deve fare il tuo codice prima di eseguire?`,
      o: [`Eseguire subito, il modello sa cosa fa`, `Validare gli argomenti e verificare che l'operatore sia autorizzato su quel conto`, `Chiedere al modello se è sicuro`, `Ignorare la richiesta`], c: 1,
      w: `Il modello propone; la responsabilità di validare e autorizzare è del tuo codice, sempre rispetto all'utente della richiesta.`,
      term: `<b>Function calling</b> con <b>validazione degli argomenti</b> e <b>controllo di autorizzazione</b>: l'output del modello è <b>input non fidato (untrusted input)</b>.` },
    { q: `Perché usare lo streaming SSE per la chat?`,
      o: [`Costa meno token`, `L'utente vede il testo comparire subito invece di aspettare secondi davanti a una pagina vuota`, `È obbligatorio con OpenAI`, `Rende il modello più preciso`], c: 1,
      w: `Il tempo totale è simile, ma il primo pezzo arriva molto prima: migliora l'esperienza percepita.`,
      term: `Migliora il <b>time to first token (TTFT)</b> e la <b>latenza percepita</b>, tramite <b>Server-Sent Events</b>.` },
    { q: `Instructor ha ritentato 3 volte prima di ottenere un oggetto valido. Quante chiamate hai pagato?`,
      o: [`1`, `3`, `0`, `Dipende dal fornitore`], c: 1,
      w: `Ogni tentativo è una chiamata completa al modello, quindi tre chiamate pagate.`,
      term: `<b>Retry con feedback di validazione</b>: ogni <b>retry</b> aggiunge <b>costo</b> e <b>latenza</b>; si limita con <code>max_retries</code>.` },
    { q: `Fai lo streaming senza <code>include_usage</code>. Cosa perdi?`,
      o: [`Il testo della risposta`, `Il conteggio dei token, quindi il costo di quella chiamata`, `La connessione SSE`, `Niente`], c: 1,
      w: `In streaming l'uso dei token arriva solo se lo chiedi: senza, la contabilità dei costi si interrompe sull'endpoint più usato.`,
      term: `<code>stream_options={"include_usage": True}</code> per ricevere l'oggetto <b>usage</b> nell'ultimo <b>chunk</b>.` }
  ]
});

/* ============ GIORNATA 5 ============ */
DAYS.push({
  id: `g5`, n: 5, min: 23,
  title: `RAG: embedding e ricerca`,
  sub: `Far rispondere il modello usando i documenti della banca, citando la fonte`,
  map: {
    center: `RAG = cerca, poi rispondi`,
    flow: [`Domanda dell'operatore`, `Embedding della domanda<br><small>testo → lista di numeri</small>`, `Ricerca top-k in pgvector<br><small>i passaggi più vicini, sopra una soglia</small>`, `Prompt con i passaggi<br><small>"usa solo questi, cita [fonte-N]"</small>`, `LLM risponde<br><small>o dice "non lo so"</small>`, `Citazioni estratte<br><small>le fonti usate</small>`],
    branches: [
      { name: `Ingestion (una volta per documento)`, items: [
        `Carica, estrai, pulisci il testo (PDF pagina per pagina, togli intestazioni ripetute).`,
        `Taglia in <b>chunk</b> di ~500 caratteri, a fine frase, con 50 di overlap.`,
        `Calcola gli <b>embedding</b> in batch.`,
        `Salva testo + vettore + provenienza (documento, pagina) con un commit unico.`] },
      { name: `Embedding`, items: [
        `Lista di numeri che rappresenta il <b>significato</b> di un testo.`,
        `Significati simili → vettori vicini, anche con parole diverse.`,
        `1536 numeri con <code>text-embedding-3-small</code>.`,
        `Stesso modello per documenti e domande.`] },
      { name: `Ricerca`, items: [
        `<b>pgvector</b>: estensione di Postgres, tipo <code>vector</code>.`,
        `<code>&lt;=&gt;</code> = distanza coseno: più piccola, più simile.`,
        `Indice <b>HNSW</b>: veloce, approssimato (~99% dei vicini veri).`,
        `<b>top-k</b> 3–5, con una soglia di similarità.`] },
      { name: `Limiti e trade-off`, items: [
        `Chunk troppo grandi: vettore generico. Troppo piccoli: frasi senza contesto.`,
        `k piccolo = precisione, k grande = copertura.`,
        `Il RAG riduce le allucinazioni, non le elimina.`,
        `Il sistema non fallisce: risponde con lo stesso tono anche quando sbaglia.`] }
    ]
  },
  slides: [
    { t: `Il problema e l'idea del RAG`,
      p: [`Un LLM sa quello che ha letto durante l'addestramento. <b>Non conosce</b> le procedure interne di LipariBank, e se gli chiedi "come si sblocca una carta da noi?" rischia di <b>inventare</b> con tono sicuro (allucinazione).`,
          `<b>RAG</b> = Retrieval-Augmented Generation:`,
          `1. <b>Retrieval</b> (recupero): cerchi nei tuoi documenti i passaggi che parlano della domanda.<br>2. <b>Augmented</b> (arricchito): li metti nel prompt insieme alla domanda.<br>3. <b>Generation</b> (generazione): il modello risponde basandosi su quei passaggi e li <b>cita</b>.`,
          `Nel progetto è l'endpoint <code>/api/ai/advice</code>: l'advisor che risponde sulle procedure della banca. Un secondo endpoint fa l'<b>ingestione</b> dei documenti (e va protetto: senza autorizzazione chiunque potrebbe scrivere nella base di conoscenza).`],
      ex: `È un esame a libro aperto: il modello non deve ricordare, deve leggere le pagine giuste che gli passi tu.`,
      k: [[`Allucinazione`, `Quando il modello afferma con sicurezza qualcosa di falso o inventato.`], [`Grounding`, `Ancorare la risposta a fonti precise.`], [`Base di conoscenza`, `Tutti i documenti caricati con l'ingestion, salvati in Postgres come chunk (testo + embedding + provenienza). È dove il RAG cerca.`]] },
    { t: `Cos'è un embedding (da zero)`,
      p: [`Il computer non capisce le parole, capisce i numeri. Un <b>embedding</b> trasforma un testo in una <b>lista di numeri</b> (un <b>vettore</b>) che ne rappresenta il <b>significato</b>.`,
          `Pensa alle coordinate GPS: 2 numeri dicono dove sta un posto, e due posti vicini hanno numeri simili. Un embedding fa lo stesso con il significato, ma usa molti più numeri: <b>1536</b> con il modello del corso (<code>text-embedding-3-small</code> di OpenAI). È una <b>posizione nello spazio del significato</b>.`,
          `Risultato: testi con <b>significato simile</b> hanno vettori <b>vicini</b>, anche se usano parole diverse. La ricerca trova "banca" cercando "istituto di credito", cosa che una ricerca per parole non fa.`,
          `Attenzione, l'embedding <b>non capisce</b>: "conto gratuito" e "conto con commissione" parlano dello stesso tema e sono vicinissimi. Il recupero porta il <b>paragrafo giusto</b>, non la <b>risposta giusta</b>.`,
          `Lo produce un <b>modello di embedding</b>, diverso dal modello che chatta. Regola fissa: <b>stesso modello</b> per documenti e domande. Modelli diversi non danno errore: danno risultati casuali. Cambiare modello significa ricalcolare gli embedding di tutti i chunk già salvati nel database.`],
      ex: `In codice è semplicemente un <code>number[]</code> lungo 1536. Il "magico" sta nel modello che sceglie quei numeri.`,
      k: [[`Vettore`, `Una lista ordinata di numeri. Ogni numero è una "dimensione".`], [`Dimensioni`, `Quanti numeri ha il vettore (1536 qui; 768 o 1024 per molti modelli open source).`], [`Ricerca semantica`, `Cercare per significato invece che per parole uguali.`]] },
    { t: `Misurare la vicinanza: coseno e pgvector`,
      p: [`Immagina ogni vettore come una freccia che parte dal centro. Due testi simili hanno frecce che puntano nella <b>stessa direzione</b>.`,
          `La <b>similarità coseno</b> misura l'angolo fra due frecce: <b>1</b> = stessa direzione, <b>0</b> = nessuna relazione, <b>−1</b> = opposte. Con i testi si sta quasi sempre sopra lo zero.`,
          `La <b>distanza coseno</b> è il contrario (1 − similarità): più è <b>piccola</b>, più i testi sono vicini. Quindi si ordina in modo <b>crescente</b>.`,
          `<b>pgvector</b> è un'estensione di PostgreSQL: aggiunge il tipo <code>vector(1536)</code> e l'operatore <code>&lt;=&gt;</code> (distanza coseno). Perché pgvector e non un database vettoriale separato: testo, vettore e permessi stanno nella <b>stessa riga</b> della stessa tabella. Così una sola query SQL cerca i vicini e, nello stesso <code>WHERE</code>, filtra per permessi o documento. Con due sistemi separati dovresti tenerli sincronizzati.`,
          `Dettagli pratici: <code>CREATE EXTENSION vector</code> va scritto a mano nella migration, <b>prima</b> della tabella (l'autogenerate non lo propone); il campo non si può chiamare <code>metadata</code> (nome riservato da SQLAlchemy).`],
      ex: `Il coseno guarda la direzione, non la lunghezza: due frecce corte e lunghe che puntano uguale sono "simili".`,
      k: [[`Estensione Postgres`, `Un modulo che aggiunge tipi e funzioni al database.`], [`Distanza`, `Quanto due vettori sono lontani: più piccola = più simili.`]] },
    { t: `L'indice HNSW`,
      p: [`Qui "indice" è un indice del database, come quelli del Giorno 3: una struttura che velocizza la ricerca. Senza indice, per ogni domanda il DB confronta il vettore della domanda con <b>tutti</b> i vettori salvati (ricerca esatta). Con tanti documenti è lento.`,
          `<b>HNSW</b> (Hierarchical Navigable Small World) costruisce un <b>grafo a strati</b>: ogni vettore è collegato ai suoi vicini. La ricerca parte dallo strato alto (pochi punti, salti lunghi) e scende verso la zona della domanda.`,
          `È <b>approssimato</b>: con i valori predefiniti ritrova circa il <b>99%</b> dei vicini veri in un quindicesimo del tempo.`,
          `Parametri: <code>m</code> ed <code>ef_construction</code> si fissano quando costruisci l'indice; <code>ef_search</code> (quanti candidati esplorare) si può cambiare per transazione ed è la leva per avere più precisione.`,
          `L'indice va creato per lo stesso tipo di distanza usato nella query (qui il coseno): se non corrispondono, Postgres non lo usa e torna alla ricerca lenta. Attenzione ai filtri: HNSW prende prima i candidati più vicini e poi applica il <code>WHERE</code>; se il filtro scarta quasi tutto, ricevi meno risultati di quelli chiesti, senza nessun errore.`],
      ex: `Come cercare qualcuno chiedendo ad amici di amici, invece di bussare a tutte le porte della città.`,
      k: [[`Indice approssimato (ANN)`, `Indice che trova quasi sempre i più vicini, molto più in fretta della ricerca esatta.`], [`Grafo`, `Insieme di punti collegati da archi.`]] },
    { t: `Chunking: tagliare i documenti`,
      p: [`Non si fa l'embedding di un documento intero, per due ragioni: il vettore di 30 pagine mescola troppi argomenti e non è vicino a nessuna domanda; e nel prompt ci sta solo una porzione di testo.`,
          `<b>Il chunk è l'unità di recupero</b>: decide cosa il sistema può trovare.`,
          `La funzione <code>chunk_text</code> del corso: circa <b>500 caratteri</b>; cerca di tagliare a <b>fine frase</b> (". ", "? ", "! ", riga vuota) se il punto è oltre metà chunk; <b>50 caratteri di sovrapposizione</b> (overlap, ~10%) fra un chunk e il successivo.`,
          `Il compromesso: un chunk <b>troppo grande</b> parla di troppe cose e il suo vettore non è vicino a nessuna domanda precisa; un chunk <b>troppo piccolo</b> perde il contesto (es. "il limite è 5.000 €" senza dire limite di cosa). 400–800 caratteri è dove sta intero un paragrafo di prosa.`,
          `Prima si guarda la <b>struttura</b>: una FAQ si taglia per coppia domanda/risposta; una tabella si trasforma in testo prima. La lunghezza fissa è ciò che resta quando non c'è struttura.`,
          `Il corso conta in caratteri, il modello in token (in italiano ~3 caratteri per token).`],
      k: [[`Chunk`, `Un pezzo di documento, l'unità che viene cercata e restituita.`], [`Overlap`, `Caratteri in comune fra chunk vicini, per non spezzare il senso sul confine.`]] },
    { t: `La pipeline di ingestion`,
      p: [`<b>Ingestion</b> = preparare i documenti perché si possano cercare. Si fa una volta per documento, non a ogni domanda. Un documento grande si elabora in <b>background</b>, non dentro la richiesta HTTP.`,
          `1. <b>Carica, estrai, pulisci</b>: dal file al testo. I PDF si leggono pagina per pagina (la pagina si cattura qui: dopo il taglio un chunk non la sa più). Si tolgono intestazioni e piè di pagina ripetuti. Una pagina senza testo è una scansione: serve l'OCR.<br>2. <b>Chunking</b>: il testo in passaggi.<br>3. <b>Embedding</b>: in <b>batch</b> (tanti testi in una sola chiamata all'API), perché la parte lenta è il viaggio di andata e ritorno in rete: 100 testi in una chiamata sono molto più veloci di 100 chiamate.<br>4. <b>Salvataggio</b>: righe <code>DocumentChunk</code> con testo, vettore, documento, pagina, posizione.`,
          `Accorgimenti: un <b>commit unico</b> evita un documento indicizzato a metà; prima si cancellano i chunk dello stesso <code>document_id</code>, così ingerire due volte <b>sostituisce</b> invece di duplicare; i passaggi identici si tengono una volta sola (impronta del testo).`,
          `I primi passi decidono la qualità: se il testo estratto è sporco (intestazioni ripetute, parole spezzate), anche chunk ed embedding saranno sporchi.`],
      ex: `È un ETL: estrai, trasformi, carichi. Lo fai prima, così la ricerca dopo è veloce.`,
      k: [[`Ingestion`, `Caricamento e preparazione dei documenti nell'indice.`], [`Batch`, `Elaborare più elementi insieme in una sola chiamata.`], [`OCR`, `Riconoscimento del testo in un'immagine; sbaglia spesso su numeri e sigle.`], [`Metadati di provenienza`, `Da quale documento e pagina viene un chunk: servono per citare.`]] },
    { t: `Retrieval, risposta e citazioni`,
      p: [`Arriva la domanda → se ne calcola l'embedding (stesso modello) → si prendono i <b>top-k</b> passaggi più vicini, di solito 3–5. Nella query SQL i valori si passano come <b>parametri</b> (<code>:vettore</code>), mai incollando testo nella stringa: altrimenti un input malevolo potrebbe modificare la query (SQL injection).`,
          `<b>Soglia di similarità</b>: il top-k da solo restituisce sempre k risultati, anche per una domanda fuori tema. La soglia distingue "non ho trovato niente" da "cinque passaggi irrilevanti".`,
          `Il prompt dice due cose: rispondi <b>esclusivamente</b> dai passaggi forniti, e se non c'è la risposta <b>di' che non lo sai</b>. Senza il secondo permesso, il modello completa con ciò che sa, con lo stesso tono sicuro.`,
          `Il modello cita con <code>[fonte-1]</code>, <code>[fonte-2]</code>. Dalla risposta si estraggono le citazioni <b>usate</b>, non tutte quelle consultate. Se il modello dice "non lo so", nessuna fonte.`,
          `Davanti a una risposta sbagliata, guarda prima i <b>chunk recuperati</b>: se erano giusti il problema è nella generazione, se erano sbagliati è nel recupero.`],
      k: [[`Top-k`, `I k risultati migliori della ricerca.`], [`Soglia`, `Valore minimo di similarità sotto il quale un risultato si scarta.`], [`Citazione`, `Riferimento alla fonte usata, qui con marcatori [fonte-N].`]] },
    { t: `I limiti del RAG`,
      p: [`Il pericolo vero: <b>il sistema non fallisce, risponde</b>, con lo stesso tono delle risposte giuste.`,
          `<b>Multi-hop</b>: la risposta richiede due fatti in documenti diversi. Nessun chunk li contiene entrambi; ingrandire i chunk non serve.`,
          `<b>Aggregazione</b>: "quante pratiche aperte a ottobre?" La risposta è un numero non scritto da nessuna parte: spesso serve una query SQL, non il RAG.`,
          `<b>Dati vecchi</b>: la tabella dei chunk nel database contiene i documenti com'erano quando li hai caricati con l'ingestion. Se una procedura cambia e non ricarichi il documento, il sistema risponde con la versione vecchia, e siccome cita una fonte ufficiale l'utente si fida.`,
          `Costi: l'embedding è la voce più economica; la generazione costa di più perché più passaggi = più token. k=3 è più preciso, k=10 copre di più.`,
          `Miglioramenti possibili (Giorno 6): <b>ricerca ibrida</b> e <b>re-ranking</b>. Si adottano solo se una misura dice che servono.`],
      k: [[`Recall`, `Quanti dei passaggi giusti la ricerca riesce a trovare.`], [`Precisione`, `Quanti dei passaggi trovati sono davvero giusti.`]] }
  ],
  flash: [
    [`Cos'è un embedding?`, `Una lista di numeri (vettore) che rappresenta il significato di un testo: testi simili → vettori vicini.`],
    [`Che cosa significa RAG?`, `Retrieval-Augmented Generation: recupero i passaggi giusti, li metto nel prompt, il modello genera la risposta citandoli.`],
    [`L'embedding capisce il testo?`, `No: misura la vicinanza di significato. "Gratuito" e "con commissione" sullo stesso tema sono vicini. Porta il paragrafo giusto, non la risposta giusta.`],
    [`Cosa fa l'operatore <code>&lt;=&gt;</code> in pgvector?`, `Calcola la distanza coseno: più piccola = più simili. Si ordina in modo crescente.`],
    [`Perché pgvector e non un DB vettoriale separato?`, `Perché testo, vettore e permessi stanno nella stessa riga, quindi una query sola con filtri nel WHERE.`],
    [`Cos'è HNSW?`, `Un indice a grafo a strati, approssimato: ~99% dei vicini veri, molto più veloce. ef_search regola la precisione.`],
    [`Perché si fa chunking?`, `Un vettore per un documento intero non è vicino a nessuna domanda, e nel prompt ci sta poco testo. Passaggi di ~500 caratteri con overlap.`],
    [`A cosa serve la soglia di similarità?`, `A distinguere "non ho trovato niente" da k risultati irrilevanti: il top-k da solo ne restituisce sempre k.`],
    [`Il RAG elimina le allucinazioni?`, `No, le riduce. Servono il permesso di dire "non lo so", le citazioni e le verifiche.`],
    [`Regola sul modello di embedding?`, `Lo stesso per documenti e domande. Cambiarlo significa ricalcolare gli embedding di tutti i chunk salvati.`]
  ],
  quiz: [
    { q: `"Carta smarrita, come la disattivo?" e "Procedura di blocco della carta". Cosa succede ai loro embedding?`,
      o: [`Sono lontani perché le parole sono diverse`, `Sono vicini perché il significato è simile`, `Sono identici`, `Non si possono confrontare`], c: 1,
      w: `Gli embedding catturano il significato, non le parole esatte: frasi con senso simile hanno vettori vicini.`,
      term: `<b>Similarità semantica</b> misurata con la <b>cosine similarity</b> nello <b>spazio vettoriale</b>.` },
    { q: `Indicizzi i documenti con il modello A e calcoli l'embedding delle domande con il modello B. Risultato?`,

      s: `Alcune domande richiedono più ricerche in posti diversi, in un ordine che dipende dalle risposte. Un agente decide da solo quali passi fare.`,
      p: [`Prova a dare al RAG del Giorno 6 questa domanda da sportello: <i>"Il cliente C-10234 vuole fare un bonifico di 25.000 euro verso il Venezuela dal conto principale. Posso procedere?"</i>`,
          `Per rispondere bene servono quattro informazioni che stanno in posti diversi: qual è il conto principale del cliente (tabelle <code>customers</code> e <code>accounts</code>), il saldo su quel conto (<code>accounts</code>), la regola sui paesi a rischio (documenti della base di conoscenza), e se nell'ultimo mese ci sono stati movimenti simili (<code>movements</code>). E se la risposta è "va segnalato", bisogna anche <b>aprire una segnalazione</b>.`,
          `Non è una semplice ricerca: sono quattro interrogazioni e un'azione. E l'ordine dipende dalle risposte: se il saldo non basta, la regola sui paesi non serve nemmeno.`,
          `Un <b>agente</b> risolve questo: invece di dirgli quali passi fare, gli dai degli <b>strumenti</b> (tool) e un limite. Sarà il modello a decidere, passo dopo passo, quale strumento usare.`,
          `Nel corso il ciclo dell'agente si scrive a mano, circa sessanta righe, senza librerie. Non perché le librerie siano sbagliate: così vedi esattamente cosa fanno, e quando qualcosa va storto sai dove guardare.`],
      more: [4],
      ex: `Il RAG è un collega che, prima di rispondere, va a leggersi il manuale. L'agente è un collega che legge il manuale, apre l'anagrafica, controlla i movimenti e, se serve, compila la segnalazione.`,
      k: [[`Agente`, `Un sistema in cui è il modello a decidere, durante l'esecuzione, quali strumenti usare e in che ordine.`], [`Tool`, `Una funzione del tuo codice che il modello può chiedere di eseguire.`]] },
    { t: `Il tool visto dal modello`,
      s: `Del tuo tool il modello vede solo nome, descrizione e parametri. La descrizione decide se e quando lo userà.`,
      p: [`Ricordi il Giorno 4: il modello non esegue niente, propone. Oggi gli strumenti sono cinque e il modello sceglie di nuovo a ogni giro.`,
          `Di ogni tool il modello vede solo <b>tre cose</b>: il nome, la descrizione e lo schema dei parametri. Non vede il corpo della funzione, non vede la query SQL. Quindi tutto ciò che influenza la sua scelta passa da lì, e soprattutto dalla <b>descrizione</b>.`,
          `Una buona descrizione dice <b>quando</b> usare il tool, non cosa fa internamente. E indica l'alternativa per i casi vicini, es. "per il saldo usa get_account_balance, non questo". Se la descrizione è vaga, il tool non verrà mai chiamato, e nessun debugger te lo dirà.`,
          `I cinque tool della giornata: <code>find_customer_accounts</code> (i conti di un cliente), <code>get_account_balance</code> (il saldo), <code>list_recent_movements</code> (i movimenti recenti), <code>search_documents</code> (cerca nelle procedure, riusando la ricerca per ruolo del Giorno 6) e <code>apri_segnalazione_compliance</code> (l'unico che <b>scrive</b>).`,
          `Lo schema dei parametri non si scrive a mano: si genera da un modello Pydantic con <code>model_json_schema()</code>. Lo stesso modello poi controlla gli argomenti che arrivano dal modello (<code>model_validate_json</code>). Una sola definizione per due usi, così le due cose non possono divergere.`,
          `Tutto questo sta nel <b>registry</b> (<code>src/agents/registry.py</code>): per ogni tool tiene schema, funzione da eseguire e un campo <code>scrive</code> che dice se ha effetti. Il valore di default è <code>True</code>: un tool aggiunto senza pensarci viene trattato con la massima prudenza.`],
      more: [5],
      ex: `Pensa alla descrizione come alla documentazione di un'API pubblica: il modello è un client che legge solo quella, non il tuo codice.`,
      k: [[`Registry`, `Il posto dove sono registrati tutti i tool, con schema, funzione e caratteristiche.`], [`Schema JSON`, `La descrizione dei parametri di un tool in formato JSON, che il modello legge.`]] },
    { t: `Il ciclo dell'agente`,
      s: `L'agente ripete: chiedi al modello, esegui il tool che propone, rimandagli il risultato. Si ferma quando il modello risponde o quando finiscono i passi o il budget.`,
      p: [`Al Giorno 4 il tool use era un giro solo: il modello chiede un tool, lo esegui, lui risponde. L'agente è <b>lo stesso giro dentro un ciclo</b>: dopo il risultato il modello può chiedere un altro tool, e un altro ancora, finché pensa di avere abbastanza informazioni.`,
          `Il ciclo sta in <code>src/agents/loop.py</code>, nella funzione <code>run_agent</code>. Il numero massimo di giri lo decidi tu (<code>MAX_STEPS = 6</code>), quanti ne farà davvero lo decide il modello.`,
          `A ogni giro si aggiungono <b>due</b> messaggi alla conversazione, non uno: il messaggio <code>assistant</code> con la richiesta del tool, e il messaggio <code>tool</code> con il risultato. Se ti dimentichi il primo, il modello riceve il risultato di una chiamata che, nella storia che legge, non ha mai fatto, e l'API rifiuta con un errore su <code>tool_call_id</code> poco chiaro. È l'errore che quasi tutti fanno la prima volta.`,
          `Il ciclo si scrive con un <code>for</code>, non con un <code>while</code>: così il limite fa parte della struttura e non puoi dimenticarti di aumentare un contatore.`,
          `Attenzione ai costi: a ogni giro il modello rilegge tutta la conversazione, compresi i risultati dei tool precedenti. Il costo cresce più che in proporzione ai passi: 6 passi possono costare quasi dieci volte la prima chiamata.`],
      more: [3],
      ex: `È come un <code>for</code> che a ogni iterazione chiama un servizio esterno e decide se continuare in base alla risposta, con un numero massimo di tentativi.`,
      k: [[`max_steps`, `Il numero massimo di giri che l'agente può fare.`]] },
    { t: `Le tre uscite dal ciclo`,
      s: `L'agente può fermarsi in tre modi, ma solo uno è una vera risposta. Gli altri due vanno dichiarati come tali.`,
      p: [`Il risultato di <code>run_agent</code> ha un campo <code>stopped_by</code> che dice perché il ciclo si è fermato:<br>• <b>"model"</b>: il modello non chiede più tool e risponde. È l'uscita normale, e l'unica che produce una risposta;<br>• <b>"max_steps"</b>: sono finiti i passi;<br>• <b>"budget"</b>: la spesa del run ha superato il tetto (<code>BUDGET_PER_RUN</code>, 5 centesimi).`,
          `Il punto su cui il corso insiste di più: quando i passi finiscono, <b>non</b> restituire l'ultima frase del modello come se fosse la risposta. Il modello era a metà ragionamento. Il codice deve rispondere con un messaggio esplicito, del tipo "non sono riuscito a completare la verifica", e il campo <code>stopped_by</code> arriva fino a chi usa l'API.`,
          `Il controllo del budget avviene prima di eseguire altri tool: se il run ha già speso troppo, si ferma lì, senza fare il passo che il modello aveva chiesto.`],
      ex: `Come una funzione che restituisce un risultato tipizzato con lo stato (<code>success</code>, <code>timeout</code>, <code>limit</code>) invece di un valore qualsiasi.`,
      k: [[`Budget per run`, `La spesa massima concessa a una singola esecuzione dell'agente.`]] },
    { t: `Quando un tool va in errore`,
      s: `Se un tool fallisce, l'errore si rimanda al modello come testo, così può correggersi. Il ciclo si interrompe solo se è il modello stesso a non rispondere.`,
      p: [`Un tool può fallire: argomenti non validi, conto inesistente, database lento. In questi casi l'errore <b>non si solleva</b>: diventa il testo del risultato che rimandi al modello, es. "argomenti non validi: n deve essere un numero".`,
          `Quasi sempre il modello si corregge al giro successivo. Se invece l'errore risalisse fino all'endpoint, l'operatore riceverebbe un 500 al quarto passo di un lavoro quasi finito.`,
          `L'eccezione si solleva solo quando fallisce <b>la chiamata al modello</b>: chiave revocata, fornitore irraggiungibile anche dopo i tentativi dell'SDK. Senza il modello il ciclo non ha senso, quindi <code>run_agent</code> si ferma e l'endpoint risponde con un errore chiaro.`,
          `Il criterio per decidere: "un altro tentativo del modello avrebbe senso?". Se sì, è un risultato da rimandargli; se no, è un'eccezione.`],
      k: [[`Osservazione`, `Il risultato di un tool rimandato al modello, compreso un eventuale messaggio d'errore.`]] },
    { t: `Il controllo d'accesso sta nel codice`,
      s: `Il modello può proporre qualsiasi argomento, ma non può decidere per conto di chi. L'utente viene inserito nei tool dal codice, prima che il modello li veda.`,
      p: [`La prima idea che viene è scrivere nel prompt "usa solo i conti dei clienti di questo operatore". Non funziona, per tre motivi: è un'istruzione nello stesso canale del testo dell'utente, che può contraddirla; il modello può sbagliare anche in buona fede, inventando un <code>account_id</code> plausibile; e "c'è scritto nel prompt" non è una garanzia che si possa mostrare a un controllo della banca.`,
          `La soluzione del corso: i tool <b>non ricevono</b> l'utente come argomento, lo <b>contengono</b>. Una funzione "factory" in <code>src/agents/tools.py</code> riceve l'operatore autenticato e crea i cinque tool già legati a lui. Il modello può proporre un <code>account_id</code>, ma non esiste un parametro con cui chiedere i dati "per conto di" qualcun altro.`,
          `Dentro ogni tool la query filtra sul <b>portafoglio dell'operatore</b>: se il conto non è di un suo cliente, la risposta è un rifiuto. <code>search_documents</code> riusa la ricerca per ruolo del Giorno 6, quindi il filtro nel <code>WHERE</code> protegge anche l'agente senza scrivere niente di nuovo.`,
          `La factory si chiama a ogni richiesta, nell'endpoint. Se creassi i tool una volta all'avvio dell'app, conterrebbero l'utente sbagliato, o nessuno.`,
          `Il modello i conti del cliente non li riceve nel prompt: li chiede a <code>find_customer_accounts</code>, che risponde solo per i clienti del portafoglio.`],
      more: [4],
      ex: `Un permesso scritto nel prompt è come un cartello "non entrare" su una porta aperta: funziona con le persone educate. Una closure invece è come un badge che apre solo le porte giuste.`,
      k: [[`Closure`, `Una funzione che "ricorda" le variabili del contesto in cui è stata creata, come in JavaScript.`], [`Factory dei tool`, `Funzione che crea i tool già legati all'utente della richiesta.`]] },
    { t: `Un tool che scrive`,
      s: `Un'azione non si annulla con un messaggio di errore. Il tool che apre le segnalazioni controlla i permessi due volte e non crea mai doppioni.`,
      p: [`Quattro tool leggono, uno scrive: <code>apri_segnalazione_compliance</code>. Se un tool che legge sbaglia, al massimo esce una frase sbagliata; se sbaglia uno che scrive, resta una riga nel database.`,
          `Per questo il permesso si controlla <b>due volte</b>: nel tool (grazie alla closure) e nel service <code>src/services/alerts.py</code>, che è l'unico punto del progetto che apre una segnalazione.`,
          `Serve anche l'<b>idempotenza</b>: se il modello chiama due volte lo stesso tool, magari perché il risultato breve non gli sembra una conferma, non devono nascere due segnalazioni. Una chiave (stesso conto, stesso operatore, stesso giorno) con un vincolo di unicità nel database garantisce una sola riga.`,
          `Il tool che scrive non va eseguito in parallelo con un'altra copia di sé: due chiamate contemporanee si scontrerebbero sul vincolo di unicità. I tool che leggono invece si potrebbero eseguire insieme (è un approfondimento facoltativo della giornata).`],
      more: [3],
      k: [[`Idempotenza`, `Proprietà di un'operazione che, ripetuta più volte, produce lo stesso effetto di una volta sola.`]] },
    { t: `Vedere dentro l'agente`,
      s: `Per ogni tool eseguito si scrive una riga di log, collegata alle altre da un run_id. Così puoi ricostruire perché l'agente ha risposto in quel modo.`,
      p: [`Con l'advisor del Giorno 6 la domanda era "perché è lento?". Con l'agente diventa "<b>perché ha risposto così?</b>". L'agente fa un numero variabile di passi, in un ordine che sceglie lui: se non li registri, hai solo la risposta finale, e da quella non capisci niente.`,
